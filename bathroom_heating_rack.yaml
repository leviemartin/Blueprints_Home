blueprint:
  name: "Bathroom Heating Rack v3.0.0"
  description: >
    **Version: 3.0.0** — room-sensor thermostat: the
    blueprint, not the rack, decides when the element runs. Inside a routine window (or a boost)
    the rack gets `drive_setpoint` while the room sensor is below the room target and
    `idle_setpoint` once the room reaches it; the rack's own sensor is never read (it only acts
    as the drive_setpoint high-limit inside the device). A slot that is not heating starts only
    below `target − restart_deadband`, so a room already at target is never heated. The room
    sensor is the bathroom humidity sensor's temperature, with an optional backup room sensor;
    with no room sensor the rack stays idle and a warning is raised. The ventilator no longer
    pauses heating. Evening slots can skip the pre-heat lead (heat from the start time). Boost is
    room-governed at `boost_target_temp`. History: v2.0.0 comfort floor, edge-triggered pushes ·
    v1.1.1 boost beats fan coordination · v1.1.0 mobile push · v1.0.5 idle setpoint.

    Warms a bathroom with a heating rack for scheduled routines, using a ΔT-based warmup lead
    for the morning, a room-sensor on/off control with a restart deadband, a boost toggle and a
    vacation switch.

    **Features:**
    - Dual-slot routines per phase (e.g. weekday + weekend morning)
    - Dynamic morning warmup: lead time follows the room ΔT, clamped to a floor and a cap
    - Room-sensor control: heat below target, stop at target, restart only below target − deadband
    - Rack's internal sensor never used for decisions; drive_setpoint is only a device high-limit
    - Ad-hoc boost toggle with auto-expiry (room-governed)
    - Vacation / full-off toggle
    - Optional mobile push (climate unavailable, room sensor offline, warmup started)

  domain: automation
  input:
    # ----- DEVICES -----
    heating_climate:
      name: Heating Rack Climate Entity
      description: The climate entity of the heating rack (e.g. a Tuya cloud thermostat element).
      selector:
        entity:
          domain: climate
    bathroom_temp_sensor:
      name: Room Temperature Sensor
      description: >-
        The room temperature that decides heating (e.g. the bathroom humidity sensor's
        temperature entity). While it is non-numeric the first numeric backup sensor is used;
        with neither the rack stays idle and a warning is raised after 10 minutes.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    backup_temp_sensors:
      name: Backup Room Temperature Sensor(s) (Optional)
      description: >-
        Room sensors used, in order, while the primary is non-numeric. Never list the rack's own
        climate entity: it reads warmer than the room.
      default: []
      selector:
        entity:
          domain: sensor
          device_class: temperature
          multiple: true

    # ----- GLOBAL CONTROLS -----
    vacation_off:
      name: Vacation / Full-Off Toggle (Optional)
      description: "Optional input_boolean(s). When any is ON the heating rack is switched off."
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    boost_toggle:
      name: Ad-hoc Boost Toggle
      description: >-
        Input boolean. When turned ON the rack heats toward boost_target_temp (room sensor) for
        boost_runtime_min, then the toggle auto-turns-off. Works outside the routine windows.
      selector:
        entity:
          domain: input_boolean

    # ----- CONTROL -----
    drive_setpoint:
      name: Drive Setpoint (°C)
      description: >-
        Setpoint sent to the rack while the room sensor calls for heat. The rack's own sensor
        reads warmer than the room, so this only caps the element inside the device; the room
        sensor decides on/off. Rounded to the device step and clamped to its range.
      default: 24
      selector:
        number: {min: 18, max: 30, step: 1, unit_of_measurement: "°C"}
    restart_deadband:
      name: Restart Deadband (°C)
      description: >-
        A window (or boost) that is not heating starts only while the room is below
        `target − deadband`; once heating it stops when the room reaches the target. Guards
        against sensor noise short-cycling the rack.
      default: 0.3
      selector:
        number: {min: 0.1, max: 2, step: 0.1, unit_of_measurement: "°C"}
    boost_target_temp:
      name: Boost Room Target (°C)
      description: Room temperature the boost heats toward (room sensor).
      default: 22
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}
    boost_runtime_min:
      name: Boost Runtime (min)
      description: The boost toggle is switched off this many minutes after it was turned on.
      default: 30
      selector:
        number: {min: 10, max: 120, step: 5, unit_of_measurement: "min"}
    idle_setpoint:
      name: Idle Setpoint (°C)
      description: >-
        Setpoint applied outside the windows and whenever the room is at target. Rounded to the
        device step and clamped to its min/max (default 7 °C matches the device minimum).
      default: 7
      selector:
        number: {min: 5, max: 20, step: 0.5, unit_of_measurement: "°C"}

    # ----- MORNING A (PRIMARY) -----
    morning_a_days:
      name: Morning A Days
      description: Weekdays on which the Morning A slot applies.
      default: ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    morning_a_target_warm:
      name: Morning A Target-Warm Time
      description: Time the room should be at target; heating may start up to the warmup cap earlier.
      default: "06:45:00"
      selector: {time: {}}
    morning_a_hold_until:
      name: Morning A Hold-Until Time
      description: End of the slot. If at or before target-warm it is taken as the next day (the slot is evaluated per calendar day, so it still ends at midnight).
      default: "07:45:00"
      selector: {time: {}}
    morning_a_target_temp:
      name: Morning A Room Target (°C)
      description: Room temperature (room sensor) the slot heats toward.
      default: 22
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}

    # ----- MORNING B (OPTIONAL) -----
    morning_b_days:
      name: Morning B Days (leave empty to disable)
      description: Weekdays on which the Morning B slot applies.
      default: []
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    morning_b_target_warm:
      name: Morning B Target-Warm Time
      description: Time the room should be at target; heating may start up to the warmup cap earlier.
      default: "08:30:00"
      selector: {time: {}}
    morning_b_hold_until:
      name: Morning B Hold-Until Time
      description: End of the slot. If at or before target-warm it is taken as the next day (the slot is evaluated per calendar day, so it still ends at midnight).
      default: "09:30:00"
      selector: {time: {}}
    morning_b_target_temp:
      name: Morning B Room Target (°C)
      description: Room temperature (room sensor) the slot heats toward.
      default: 22
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}

    # ----- EVENING A -----
    evening_a_days:
      name: Evening A Days
      description: Weekdays on which the Evening A slot applies.
      default: ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    evening_a_target_warm:
      name: Evening A Start / Target-Warm Time
      description: >-
        With evening pre-heat off: the time heating may start. With it on: the time the room
        should be at target (heating may start up to the warmup cap earlier).
      default: "18:30:00"
      selector: {time: {}}
    evening_a_hold_until:
      name: Evening A Hold-Until Time
      description: End of the slot. If at or before target-warm it is taken as the next day (the slot is evaluated per calendar day, so it still ends at midnight).
      default: "19:30:00"
      selector: {time: {}}
    evening_a_target_temp:
      name: Evening A Room Target (°C)
      description: Room temperature (room sensor) the slot heats toward.
      default: 22
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}

    # ----- EVENING B (OPTIONAL) -----
    evening_b_days:
      name: Evening B Days (leave empty to disable)
      description: Weekdays on which the Evening B slot applies.
      default: []
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    evening_b_target_warm:
      name: Evening B Start / Target-Warm Time
      description: As Evening A.
      default: "20:30:00"
      selector: {time: {}}
    evening_b_hold_until:
      name: Evening B Hold-Until Time
      description: End of the slot. If at or before target-warm it is taken as the next day (the slot is evaluated per calendar day, so it still ends at midnight).
      default: "22:00:00"
      selector: {time: {}}
    evening_b_target_temp:
      name: Evening B Room Target (°C)
      description: Room temperature (room sensor) the slot heats toward.
      default: 22
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}
    evening_preheat:
      name: Evening Pre-Heat Lead
      description: >-
        On: evening slots open up to the warmup cap before their target-warm time (like the
        morning). Off: evening slots open exactly at their start time.
      default: false
      selector: {boolean: {}}

    # ----- WARMUP FORMULA TUNING -----
    warmup_base_min:
      name: Warmup Base Minutes
      description: Fixed part of the warmup lead (minutes).
      default: 10
      selector:
        number: {min: 5, max: 30, step: 1, unit_of_measurement: "min"}
    warmup_per_degree_min:
      name: Warmup Minutes per °C
      description: Added to the lead for every °C the room is below the slot target.
      default: 5
      selector:
        number: {min: 1, max: 15, step: 1, unit_of_measurement: "min/°C"}
    warmup_min_minutes:
      name: Warmup Floor (min)
      description: Shortest lead time regardless of ΔT.
      default: 10
      selector:
        number: {min: 5, max: 30, step: 1, unit_of_measurement: "min"}
    warmup_max_minutes:
      name: Warmup Cap (min)
      description: Longest lead time regardless of ΔT.
      default: 60
      selector:
        number: {min: 20, max: 120, step: 5, unit_of_measurement: "min"}

    # ----- NOTIFICATIONS -----
    enable_notifications:
      name: Enable Warmup-Started Notifications
      description: Persistent notification (and push) each time the setpoint leaves idle.
      default: true
      selector: {boolean: {}}
    notify_targets:
      name: Mobile Push Targets
      description: >-
        List of notify services to push high-priority events to. Enter the full service name
        including the `notify.` prefix (e.g. notify.mobile_app_martin_fold); entries that do not
        look like `notify.<name>` are ignored. A target that does not exist aborts the run at the
        push step (HA does not suppress a missing action), so check it exists after editing. Leave
        empty to disable push. Events that push: climate unavailable (after 5 min), room sensor
        offline (after 10 min), warmup started.
      default: []
      selector:
        text:
          multiple: true

mode: restart
max_exceeded: silent

# =============================================
# TOP-LEVEL VARIABLES — !input pass-through
# =============================================
variables:
  entity_climate: !input heating_climate
  sensor_bathroom_temp: !input bathroom_temp_sensor
  entity_backup_temps: !input backup_temp_sensors
  entity_vacation: !input vacation_off
  entity_boost: !input boost_toggle

  drive_setpoint: !input drive_setpoint
  restart_deadband: !input restart_deadband
  boost_runtime_min: !input boost_runtime_min
  boost_target_temp: !input boost_target_temp
  idle_setpoint: !input idle_setpoint
  evening_preheat: !input evening_preheat
  warmup_base_min: !input warmup_base_min
  warmup_per_degree_min: !input warmup_per_degree_min
  warmup_min_minutes: !input warmup_min_minutes
  warmup_max_minutes: !input warmup_max_minutes
  enable_notifications: !input enable_notifications
  notify_targets: !input notify_targets

  morning_a_days: !input morning_a_days
  morning_a_target_warm: !input morning_a_target_warm
  morning_a_hold_until: !input morning_a_hold_until
  morning_a_target_temp: !input morning_a_target_temp
  morning_b_days: !input morning_b_days
  morning_b_target_warm: !input morning_b_target_warm
  morning_b_hold_until: !input morning_b_hold_until
  morning_b_target_temp: !input morning_b_target_temp
  evening_a_days: !input evening_a_days
  evening_a_target_warm: !input evening_a_target_warm
  evening_a_hold_until: !input evening_a_hold_until
  evening_a_target_temp: !input evening_a_target_temp
  evening_b_days: !input evening_b_days
  evening_b_target_warm: !input evening_b_target_warm
  evening_b_hold_until: !input evening_b_hold_until
  evening_b_target_temp: !input evening_b_target_temp

trigger:
  # T1: 1-minute tick — windows, room-sensor control, boost expiry
  - platform: time_pattern
    minutes: "/1"
    id: periodic

  # T2: boost toggle on/off (attribute-only updates ignored)
  - platform: state
    entity_id: !input boost_toggle
    to: ["on", "off"]
    id: boost_change

  # T3: vacation toggle on/off
  - platform: state
    entity_id: !input vacation_off
    to: ["on", "off"]
    id: vacation_change

  # T5: HA restart
  - platform: homeassistant
    event: start
    id: ha_start

  # T6: climate entity offline for 5 min (one push per outage; 'unknown' is the device's normal ON state)
  - platform: state
    entity_id: !input heating_climate
    to: unavailable
    for:
      minutes: 5
    id: climate_lost

  # T7: primary room sensor non-numeric for 10 min (one push per outage)
  - platform: state
    entity_id: !input bathroom_temp_sensor
    to: [unavailable, unknown]
    for:
      minutes: 10
    id: temp_lost

  # T8: backup room sensor(s) non-numeric for 10 min (fires the fully-blind push when the primary
  # is already non-numeric; one push per outage)
  - platform: state
    entity_id: !input backup_temp_sensors
    to: [unavailable, unknown]
    for:
      minutes: 10
    id: backup_lost

action:
  # =============================================
  # STEP 1: LIVE STATE (inside action for trace visibility)
  # The rack's current_temperature is deliberately never read.
  # =============================================
  - variables:
      indoor_temp_primary: "{{ states(sensor_bathroom_temp) | float(-99) }}"
      indoor_temp_backup: >-
        {% set ns = namespace(v=-99) %}{% for e in (entity_backup_temps if (entity_backup_temps is iterable and entity_backup_temps is not string) else [entity_backup_temps]) %}{% if ns.v < -50 and states(e) | float(-99) > -50 %}{% set ns.v = states(e) | float %}{% endif %}{% endfor %}{{ ns.v }}
      indoor_temp_has_primary: "{{ indoor_temp_primary | float(-99) > -50 }}"
      indoor_temp_has_backup: "{{ indoor_temp_backup | float(-99) > -50 }}"
      room_known: "{{ indoor_temp_has_primary or indoor_temp_has_backup }}"
      # 20 is a placeholder for the lead/ETA arithmetic only: without a room sensor nothing heats.
      indoor_temp: >-
        {% if indoor_temp_has_primary %}{{ indoor_temp_primary | float }}{% elif indoor_temp_has_backup %}{{ indoor_temp_backup | float }}{% else %}20{% endif %}

      current_setpoint: "{{ state_attr(entity_climate, 'temperature') | float(7) }}"
      current_hvac_mode: "{{ states(entity_climate) }}"
      # Tuya cloud climate entities report state 'unknown' while the switch DP is on and the
      # mode DP is eco (HA core tuya/climate.py hvac_mode) and 'off' when the switch is off.
      # 'unknown' is therefore the normal ON state: normalising it to 'heat_cool' keeps the
      # idempotent mode call from re-firing (and beeping) every tick.
      current_hvac_mode_normalized: "{{ 'heat_cool' if current_hvac_mode == 'unknown' else current_hvac_mode }}"
      # Device setpoint grid and range; defaults when the attributes are missing or zero.
      setpoint_step: >-
        {% set s = state_attr(entity_climate, 'target_temp_step') | float(0) %}{{ s if s > 0 else 0.5 }}
      setpoint_min: "{{ state_attr(entity_climate, 'min_temp') | float(7) }}"
      setpoint_max: "{{ state_attr(entity_climate, 'max_temp') | float(30) }}"
      # Idle and drive values as the device can hold them: rounded half-up to the step
      # (epsilon-nudged grid count, round(2)) and clamped to the range.
      idle_setpoint_dev: "{{ [setpoint_max | float, [setpoint_min | float, ((((idle_setpoint | float) / (setpoint_step | float) + 0.501) | int) * (setpoint_step | float))] | max] | min | round(2) }}"
      drive_setpoint_dev: "{{ [setpoint_max | float, [setpoint_min | float, ((((drive_setpoint | float) / (setpoint_step | float) + 0.501) | int) * (setpoint_step | float))] | max] | min | round(2) }}"
      # The rack is heating when it is ON and holds the drive value. This is what latches a
      # window's opening edge and switches the stop line from `target − deadband` to `target`.
      heating_now: "{{ current_hvac_mode_normalized == 'heat_cool' and (current_setpoint | float - drive_setpoint_dev | float) | abs < 0.1 }}"
      # Push targets: only well-formed notify service names are dispatched.
      notify_list: "{{ (notify_targets if (notify_targets is iterable and notify_targets is not string) else ([notify_targets] if notify_targets else [])) | select('match', '^notify[.][a-z0-9_]+$') | list }}"

      # Locale-safe weekday token (the %a abbreviation follows the system locale)
      today_dow: "{{ ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][now().weekday()] }}"
      now_dt: "{{ now() }}"

      # Vacation: any listed toggle ON (an empty list renders False, never bare text)
      vacation_active: "{{ expand(entity_vacation) | selectattr('state', 'eq', 'on') | list | length > 0 }}"

      # Boost (stateless age-based expiry)
      boost_runtime_min_int: "{{ (boost_runtime_min | float) | int }}"
      boost_is_on: "{{ is_state(entity_boost, 'on') }}"
      boost_age_min: >-
        {% if states[entity_boost] %}{{ ((now() - states[entity_boost].last_changed).total_seconds() / 60) | int }}{% else %}100000{% endif %}
      boost_active: "{{ boost_is_on and boost_age_min < boost_runtime_min_int }}"
      boost_expired: "{{ boost_is_on and boost_age_min >= boost_runtime_min_int }}"
      # A window's opening edge may only latch to the warmup cap when the current heat is a
      # slot-started (or long-aged) drive, never a fresh or still-active boost — otherwise an
      # expiring boost hands straight into the next window at its earliest possible open time.
      latch_ok: "{{ heating_now and not boost_is_on and boost_age_min >= warmup_max_minutes | int }}"

  # =============================================
  # STEP 2: WINDOW RESOLUTION (schedule only — the room decision is STEP 3)
  # Per slot: in_days → target_warm/hold_until (hold anchored to the next day when it is at or
  # before target_warm) → lead (0 for evening slots without pre-heat) → open edge (latched at
  # target_warm − warmup cap while latch_ok — a slot-started or long-aged drive, never a fresh
  # or active boost — so ΔT noise cannot close the window) → in_window.
  # =============================================
  - variables:
      # ----- MORNING A -----
      ma_in_days: "{{ today_dow in morning_a_days }}"
      ma_target_warm_dt: "{{ today_at(morning_a_target_warm) }}"
      ma_hold_until_dt: >-
        {% set w = today_at(morning_a_target_warm) %}{% set h = today_at(morning_a_hold_until) %}{{ h + timedelta(days=1) if h <= w else h }}
      ma_delta_T: "{{ [0, morning_a_target_temp | float - indoor_temp | float] | max }}"
      ma_warmup_min: >-
        {{ [warmup_max_minutes | int,
            [warmup_min_minutes | int,
             (warmup_base_min | int) + (warmup_per_degree_min | int) * (ma_delta_T | float)] | max
           ] | min | int }}
      ma_open_dt: "{{ as_datetime(ma_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int if latch_ok else ma_warmup_min | int)) }}"
      ma_in_window: >-
        {{ ma_in_days and as_datetime(ma_open_dt) <= as_datetime(now_dt) and as_datetime(now_dt) < as_datetime(ma_hold_until_dt) }}

      # ----- MORNING B -----
      mb_in_days: "{{ today_dow in morning_b_days }}"
      mb_target_warm_dt: "{{ today_at(morning_b_target_warm) }}"
      mb_hold_until_dt: >-
        {% set w = today_at(morning_b_target_warm) %}{% set h = today_at(morning_b_hold_until) %}{{ h + timedelta(days=1) if h <= w else h }}
      mb_delta_T: "{{ [0, morning_b_target_temp | float - indoor_temp | float] | max }}"
      mb_warmup_min: >-
        {{ [warmup_max_minutes | int,
            [warmup_min_minutes | int,
             (warmup_base_min | int) + (warmup_per_degree_min | int) * (mb_delta_T | float)] | max
           ] | min | int }}
      mb_open_dt: "{{ as_datetime(mb_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int if latch_ok else mb_warmup_min | int)) }}"
      mb_in_window: >-
        {{ mb_in_days and as_datetime(mb_open_dt) <= as_datetime(now_dt) and as_datetime(now_dt) < as_datetime(mb_hold_until_dt) }}

      # ----- EVENING A -----
      ea_in_days: "{{ today_dow in evening_a_days }}"
      ea_target_warm_dt: "{{ today_at(evening_a_target_warm) }}"
      ea_hold_until_dt: >-
        {% set w = today_at(evening_a_target_warm) %}{% set h = today_at(evening_a_hold_until) %}{{ h + timedelta(days=1) if h <= w else h }}
      ea_delta_T: "{{ [0, evening_a_target_temp | float - indoor_temp | float] | max }}"
      ea_warmup_min: >-
        {% if evening_preheat %}{{ [warmup_max_minutes | int, [warmup_min_minutes | int, (warmup_base_min | int) + (warmup_per_degree_min | int) * (ea_delta_T | float)] | max] | min | int }}{% else %}0{% endif %}
      ea_open_dt: "{{ as_datetime(ea_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int if (evening_preheat and latch_ok) else ea_warmup_min | int)) }}"
      ea_in_window: >-
        {{ ea_in_days and as_datetime(ea_open_dt) <= as_datetime(now_dt) and as_datetime(now_dt) < as_datetime(ea_hold_until_dt) }}

      # ----- EVENING B -----
      eb_in_days: "{{ today_dow in evening_b_days }}"
      eb_target_warm_dt: "{{ today_at(evening_b_target_warm) }}"
      eb_hold_until_dt: >-
        {% set w = today_at(evening_b_target_warm) %}{% set h = today_at(evening_b_hold_until) %}{{ h + timedelta(days=1) if h <= w else h }}
      eb_delta_T: "{{ [0, evening_b_target_temp | float - indoor_temp | float] | max }}"
      eb_warmup_min: >-
        {% if evening_preheat %}{{ [warmup_max_minutes | int, [warmup_min_minutes | int, (warmup_base_min | int) + (warmup_per_degree_min | int) * (eb_delta_T | float)] | max] | min | int }}{% else %}0{% endif %}
      eb_open_dt: "{{ as_datetime(eb_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int if (evening_preheat and latch_ok) else eb_warmup_min | int)) }}"
      eb_in_window: >-
        {{ eb_in_days and as_datetime(eb_open_dt) <= as_datetime(now_dt) and as_datetime(now_dt) < as_datetime(eb_hold_until_dt) }}

  # =============================================
  # STEP 3: ROOM DECISION — one target, one stop line
  # Source: boost > evening (A, B) > morning (A, B) > none. The rack heats only while the room
  # sensor is below the line: `target` while it is already heating, `target − deadband` to
  # start. No room sensor → no heating (the rack's own sensor is never a substitute).
  # =============================================
  - variables:
      target_source: "{% if boost_active %}boost{% elif ea_in_window %}evening_a{% elif eb_in_window %}evening_b{% elif ma_in_window %}morning_a{% elif mb_in_window %}morning_b{% else %}none{% endif %}"
      room_target: "{% if target_source == 'boost' %}{{ boost_target_temp | float }}{% elif target_source == 'evening_a' %}{{ evening_a_target_temp | float }}{% elif target_source == 'evening_b' %}{{ evening_b_target_temp | float }}{% elif target_source == 'morning_a' %}{{ morning_a_target_temp | float }}{% elif target_source == 'morning_b' %}{{ morning_b_target_temp | float }}{% else %}0{% endif %}"
      heat_line: "{{ (room_target | float - (0 if heating_now else restart_deadband | float)) | round(2) }}"
      call_for_heat: "{{ target_source != 'none' and room_known and indoor_temp | float | round(2) < heat_line | float }}"

  # =============================================
  # STEP 4: PRIORITY (first match wins)
  # P1 vacation > P3 boost > P4 evening > P5 morning > P6 idle; a window or boost whose room is
  # at target reads `<label>_satisfied`, one without any room sensor `<label>_blind`.
  # Every desired_* template is single-line so the rendered value carries no whitespace.
  # =============================================
  - variables:
      desired_mode: "{% if vacation_active %}off{% else %}heat_cool{% endif %}"
      desired_setpoint: "{% if vacation_active %}none{% elif call_for_heat %}{{ drive_setpoint_dev }}{% else %}{{ idle_setpoint_dev }}{% endif %}"
      active_priority: >-
        {% set base = {'boost': 'P3_boost', 'evening_a': 'P4_evening', 'evening_b': 'P4_evening', 'morning_a': 'P5_morning', 'morning_b': 'P5_morning'} %}{% if vacation_active %}P1_vacation{% elif target_source == 'none' %}P6_idle{% elif call_for_heat %}{{ base[target_source] }}{% elif not room_known %}{{ base[target_source] }}_blind{% else %}{{ base[target_source] }}_satisfied{% endif %}

  # =============================================
  # STEP 5: CLIMATE VALIDATION — 'unavailable' or a missing entity is a hard stop ('unknown' is
  # the Tuya device's normal ON state). The in-HA warning follows the state; the push fires
  # once, on the climate_lost trigger. The temp_lost edge fires once, so its push is also
  # delivered from this branch (it would otherwise be swallowed by the stop).
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states[entity_climate] is none or states(entity_climate) == 'unavailable' }}"
        sequence:
          - service: persistent_notification.create
            continue_on_error: true
            data:
              title: "Heating Rack — Climate Unavailable"
              message: >
                {{ entity_climate }} is {{ states(entity_climate) }}.
                Holding current state.
              notification_id: "heating_rack_climate_unavailable"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id | default('') == 'climate_lost' }}"
                sequence:
                  - repeat:
                      for_each: "{{ notify_list }}"
                      sequence:
                        - service: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "Heating Rack — Climate Unavailable"
                            message: >-
                              {{ entity_climate }} has been unavailable for 5 min.
                              Holding current state.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id | default('') == 'temp_lost' }}"
                sequence:
                  - repeat:
                      for_each: "{{ notify_list }}"
                      sequence:
                        - service: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "Heating Rack — Room Sensor Offline"
                            message: >-
                              {{ sensor_bathroom_temp }} non-numeric for 10 min while the climate entity
                              is unavailable.
          - stop: "Climate entity unavailable"
      - conditions:
          - condition: template
            value_template: "{{ states[entity_climate] is not none and states(entity_climate) != 'unavailable' }}"
        sequence:
          - service: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: "heating_rack_climate_unavailable"

  # =============================================
  # STEP 6: IDEMPOTENT SERVICE CALLS — continue_on_error so a cloud error never skips the
  # notification edges or the boost expiry below; the next tick retries the call.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ current_hvac_mode_normalized != desired_mode }}"
        sequence:
          - service: climate.set_hvac_mode
            continue_on_error: true
            target:
              entity_id: "{{ entity_climate }}"
            data:
              hvac_mode: "{{ desired_mode }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ desired_setpoint != 'none'
                 and (current_setpoint | float - desired_setpoint | float) | abs > 0.1 }}
        sequence:
          - service: climate.set_temperature
            continue_on_error: true
            target:
              entity_id: "{{ entity_climate }}"
            data:
              temperature: "{{ desired_setpoint | float }}"

  # =============================================
  # STEP 7: ROOM SENSOR WARNING — state-driven in HA (created every tick while the primary is
  # non-numeric, dismissed when it is back); the push fires once, on the temp_lost trigger.
  # Sits after the climate calls so a push problem can never block a setpoint write.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not indoor_temp_has_primary }}"
        sequence:
          - service: persistent_notification.create
            continue_on_error: true
            data:
              title: "Heating Rack — Room Sensor Offline"
              message: >
                {{ sensor_bathroom_temp }} is non-numeric.
                {% if indoor_temp_has_backup %}Using the backup room sensor ({{ indoor_temp }}°C).{% else %}No backup room sensor: the rack stays idle until a room sensor returns.{% endif %}
              notification_id: "heating_rack_sensor_warning"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id | default('') == 'temp_lost' }}"
                sequence:
                  - repeat:
                      for_each: "{{ notify_list }}"
                      sequence:
                        - service: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "Heating Rack — Room Sensor Offline"
                            message: >-
                              {{ sensor_bathroom_temp }} non-numeric for 10 min.
                              {% if indoor_temp_has_backup %}Using the backup room sensor.{% else %}No room sensor: scheduled heating is blocked.{% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id | default('') == 'backup_lost' and not indoor_temp_has_backup }}"
                sequence:
                  - repeat:
                      for_each: "{{ notify_list }}"
                      sequence:
                        - service: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "Heating Rack — Room Sensor Offline"
                            message: >-
                              {{ sensor_bathroom_temp }} and the backup room sensor are non-numeric.
                              No room sensor: scheduled heating is blocked.
      - conditions:
          - condition: template
            value_template: "{{ indoor_temp_has_primary }}"
        sequence:
          - service: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: "heating_rack_sensor_warning"

  # =============================================
  # STEP 8: WARMUP-STARTED NOTIFICATION — edge-triggered on the setpoint leaving idle
  # (current_setpoint was read before the set_temperature call above); dismissed on the tick
  # that returns the setpoint to idle. A restart inside the same window is a new edge.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications
                 and desired_setpoint != 'none'
                 and desired_setpoint | float > idle_setpoint_dev | float + 0.1
                 and current_setpoint | float <= idle_setpoint_dev | float + 0.1 }}
        sequence:
          - variables:
              eta_delta: "{{ [0, room_target | float - indoor_temp | float] | max }}"
              eta_min: >-
                {{ [warmup_max_minutes | int,
                    [warmup_min_minutes | int,
                     (warmup_base_min | int) + (warmup_per_degree_min | int) * (eta_delta | float)] | max
                   ] | min | int }}
          - service: persistent_notification.create
            continue_on_error: true
            data:
              title: "Heating Rack — Warmup Started"
              message: >
                Priority: {{ active_priority }}.
                Room {{ indoor_temp | round(1) }}°C → target
                {{ room_target }}°C. ETA ~{{ eta_min }} min.
              notification_id: "heating_rack_warmup_started"
          - repeat:
              for_each: "{{ notify_list }}"
              sequence:
                - service: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "Heating Rack — Warmup Started"
                    message: >-
                      {{ active_priority }}: {{ indoor_temp | round(1) }}°C
                      → {{ room_target }}°C. ETA ~{{ eta_min }} min.

      - conditions:
          - condition: template
            value_template: >-
              {{ desired_setpoint != 'none'
                 and desired_setpoint | float <= idle_setpoint_dev | float + 0.1
                 and current_setpoint | float > idle_setpoint_dev | float + 0.1 }}
        sequence:
          - service: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: "heating_rack_warmup_started"

  # =============================================
  # STEP 9: DEBUG NOTIFICATION (manual run only)
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id | default('manual') == 'manual' }}"
        sequence:
          - service: persistent_notification.create
            continue_on_error: true
            data:
              title: "Heating Rack Debug — {{ now().strftime('%H:%M:%S') }}"
              message: >
                **Room:** {{ indoor_temp | round(1) }}°C (primary {{ indoor_temp_primary }}, backup {{ indoor_temp_backup }}, known {{ room_known }})
                | **Setpoint:** {{ current_setpoint }}°C (step {{ setpoint_step }}, range {{ setpoint_min }}–{{ setpoint_max }}, idle {{ idle_setpoint_dev }}, drive {{ drive_setpoint_dev }})
                | **Mode:** {{ current_hvac_mode }} | **Heating:** {{ heating_now }} | **Latch OK:** {{ latch_ok }}
                | **Push:** {{ notify_list }}

                **Vacation:** {{ vacation_active }}
                | **Boost:** {{ 'ON' if boost_is_on else 'off' }} (age {{ boost_age_min }}m, expires {{ boost_runtime_min_int }}m)
                | **Today:** {{ today_dow }}

                **Morning A:** days={{ ma_in_days }}, ΔT={{ ma_delta_T | round(1) }}°C, warmup={{ ma_warmup_min }}m, open={{ as_datetime(ma_open_dt).strftime('%H:%M') }}, hold_until={{ as_datetime(ma_hold_until_dt).strftime('%a %H:%M') }}, in_window={{ ma_in_window }}

                **Morning B:** days={{ mb_in_days }}, ΔT={{ mb_delta_T | round(1) }}°C, warmup={{ mb_warmup_min }}m, open={{ as_datetime(mb_open_dt).strftime('%H:%M') }}, hold_until={{ as_datetime(mb_hold_until_dt).strftime('%a %H:%M') }}, in_window={{ mb_in_window }}

                **Evening A:** days={{ ea_in_days }}, preheat={{ evening_preheat }}, warmup={{ ea_warmup_min }}m, open={{ as_datetime(ea_open_dt).strftime('%H:%M') }}, hold_until={{ as_datetime(ea_hold_until_dt).strftime('%a %H:%M') }}, in_window={{ ea_in_window }}

                **Evening B:** days={{ eb_in_days }}, preheat={{ evening_preheat }}, warmup={{ eb_warmup_min }}m, open={{ as_datetime(eb_open_dt).strftime('%H:%M') }}, hold_until={{ as_datetime(eb_hold_until_dt).strftime('%a %H:%M') }}, in_window={{ eb_in_window }}

                **→ Source:** {{ target_source }} | **Target:** {{ room_target }}°C | **Line:** {{ heat_line }}°C | **Call:** {{ call_for_heat }}
                | **→ Priority:** {{ active_priority }}
                | **→ Desired:** mode={{ desired_mode }}, setpoint={{ desired_setpoint }}
              notification_id: "heating_rack_debug"

  # =============================================
  # STEP 10: BOOST EXPIRY — the LAST step: the turn_off restarts this automation (mode: restart,
  # boost_change), which would abort anything after it.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ boost_expired }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ entity_boost }}"
