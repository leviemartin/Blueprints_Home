blueprint:
  name: "Bathroom Heating Rack v1.1.1"
  description: >
    **Version: 1.1.1** — Boost now beats fan coordination in the priority waterfall. Previously, tapping the boost toggle while the exhaust fan was running silently demoted the request to a P2 fan-pause (setpoint stayed at idle_setpoint, no heating). The user-visible symptom was "boost button does nothing during/after showers." v1.1.1 reorders precedence: vacation > **boost** > fan_coord(morning/evening only) > evening > morning > idle, so explicit user intent wins over automatic heat-saving. Fan coordination still pauses the scheduled P4/P5 auto routines during active ventilation. v1.1.0 added opt-in mobile push via `notify_targets`. v1.0.5 drove idle/pause setpoint to `idle_setpoint` (default 7°C). v1.0.4 normalised 'unknown'→'heat_cool' to stop per-tick beeping. v1.0.3 stopped blocking on state='unknown'. v1.0.2 skipped set_preset_mode for integrations that reject 'none'. v1.0.1 fixed datetime arithmetic via as_datetime().

    Pre-heats the bathroom heating rack for adult morning and kids bath
    routines using dynamic ΔT-based warmup, predictive motion override,
    and ventilator coordination.

    **Features:**
    - Dual-slot routines per phase (e.g., weekday + weekend morning)
    - Dynamic warmup: self-adjusts across seasons via indoor ΔT
    - Predictive motion: hall → morning; stairs → evening
    - Ad-hoc boost toggle with auto-expiry
    - Ventilator coordination via eco preset (no heat eviction)
    - Vacation / full-off toggle

  domain: automation
  input:
    # ----- DEVICES -----
    heating_climate:
      name: Heating Rack Climate Entity
      description: The climate entity wrapping the heating rack smart plug.
      selector:
        entity:
          domain: climate
    bathroom_temp_sensor:
      name: Bathroom Temperature Sensor
      description: Indoor bathroom temperature sensor (for ΔT-based warmup).
      selector:
        entity:
          domain: sensor
          device_class: temperature
    hall_motion:
      name: Hall Motion Sensor (Morning Predictor)
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    stairs_motion:
      name: Stairs Motion Sensor (Evening Predictor)
      selector:
        entity:
          domain: binary_sensor
          device_class: motion
    fan_switch:
      name: Ventilator Switch
      description: "The exhaust fan entity (coordination target). Matches bathroom_ventilator blueprint's light-domain convention."
      selector:
        entity:
          domain: light

    # ----- GLOBAL CONTROLS -----
    vacation_off:
      name: Vacation / Full-Off Toggle (Optional)
      description: "Optional input_boolean. When ON, heating rack is forced off."
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    boost_toggle:
      name: Ad-hoc Boost Toggle
      description: "Input boolean. When turned ON, heats to boost_target_temp for boost_runtime_min then auto-turns-off."
      selector:
        entity:
          domain: input_boolean

    # ----- BOOST SETTINGS -----
    boost_target_temp:
      name: Boost Target Temperature (°C)
      default: 23
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}
    boost_runtime_min:
      name: Boost Runtime (min)
      default: 30
      selector:
        number: {min: 10, max: 120, step: 5, unit_of_measurement: "min"}
    idle_setpoint:
      name: Idle / Pause Setpoint (°C)
      description: "Setpoint applied when no routine is active (P6 idle) and when the fan is running during a routine (P2 pause). Keeps the heater from warming the room outside active windows. Default 7°C matches typical device min_temp."
      default: 7
      selector:
        number: {min: 5, max: 20, step: 0.5, unit_of_measurement: "°C"}

    # ----- MORNING A (PRIMARY) -----
    morning_a_days:
      name: Morning A Days
      default: ["mon", "tue", "wed", "thu", "fri"]
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    morning_a_target_warm:
      name: Morning A Target-Warm Time
      default: "06:45:00"
      selector: {time: {}}
    morning_a_hold_until:
      name: Morning A Hold-Until Time
      default: "08:00:00"
      selector: {time: {}}
    morning_a_target_temp:
      name: Morning A Target Temperature (°C)
      default: 23
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}

    # ----- MORNING B (OPTIONAL) -----
    morning_b_days:
      name: Morning B Days (leave empty to disable)
      default: []
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    morning_b_target_warm:
      name: Morning B Target-Warm Time
      default: "08:30:00"
      selector: {time: {}}
    morning_b_hold_until:
      name: Morning B Hold-Until Time
      default: "10:00:00"
      selector: {time: {}}
    morning_b_target_temp:
      name: Morning B Target Temperature (°C)
      default: 23
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}

    # ----- EVENING A (KIDS BATH) -----
    evening_a_days:
      name: Evening A (Kids Bath) Days
      default: []
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    evening_a_target_warm:
      name: Evening A Target-Warm Time
      default: "18:15:00"
      selector: {time: {}}
    evening_a_hold_until:
      name: Evening A Hold-Until Time
      default: "19:30:00"
      selector: {time: {}}
    evening_a_target_temp:
      name: Evening A Target Temperature (°C)
      default: 25
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}

    # ----- EVENING B (OPTIONAL ADULT EVENING) -----
    evening_b_days:
      name: Evening B Days (leave empty to disable)
      default: []
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}
    evening_b_target_warm:
      name: Evening B Target-Warm Time
      default: "20:30:00"
      selector: {time: {}}
    evening_b_hold_until:
      name: Evening B Hold-Until Time
      default: "22:00:00"
      selector: {time: {}}
    evening_b_target_temp:
      name: Evening B Target Temperature (°C)
      default: 23
      selector:
        number: {min: 18, max: 28, step: 0.5, unit_of_measurement: "°C"}

    # ----- WARMUP FORMULA TUNING -----
    warmup_base_min:
      name: Warmup Base Minutes
      default: 10
      selector:
        number: {min: 5, max: 30, step: 1, unit_of_measurement: "min"}
    warmup_per_degree_min:
      name: Warmup Minutes per °C
      default: 5
      selector:
        number: {min: 1, max: 15, step: 1, unit_of_measurement: "min/°C"}
    warmup_min_minutes:
      name: Warmup Floor (min)
      default: 10
      selector:
        number: {min: 5, max: 30, step: 1, unit_of_measurement: "min"}
    warmup_max_minutes:
      name: Warmup Cap (min)
      default: 60
      selector:
        number: {min: 20, max: 120, step: 5, unit_of_measurement: "min"}

    # ----- BEHAVIOR TOGGLES -----
    enable_predictive_motion:
      name: Enable Predictive Motion Override
      default: true
      selector: {boolean: {}}
    enable_notifications:
      name: Enable Persistent Notifications
      default: true
      selector: {boolean: {}}
    notify_targets:
      name: Mobile Push Targets
      description: >-
        List of notify services to push high-priority events to. Enter the
        full service name including the `notify.` prefix (e.g.,
        notify.mobile_app_martin). Leave empty to disable push. Events that
        push: climate unavailable, sensor warning, warmup started.
      default: []
      selector:
        text:
          multiple: true

mode: restart
max_exceeded: silent

# =============================================
# TOP-LEVEL VARIABLES — !input pass-through
# (matches bathroom_ventilator.yaml pattern; guarantees !input
#  resolves at automation creation and is available everywhere below)
# =============================================
variables:
  # Entity mappings
  entity_climate: !input heating_climate
  sensor_bathroom_temp: !input bathroom_temp_sensor
  sensor_hall_motion: !input hall_motion
  sensor_stairs_motion: !input stairs_motion
  entity_fan: !input fan_switch
  entity_vacation: !input vacation_off
  entity_boost: !input boost_toggle

  # Settings
  boost_runtime_min: !input boost_runtime_min
  boost_target_temp: !input boost_target_temp
  idle_setpoint: !input idle_setpoint
  warmup_base_min: !input warmup_base_min
  warmup_per_degree_min: !input warmup_per_degree_min
  warmup_min_minutes: !input warmup_min_minutes
  warmup_max_minutes: !input warmup_max_minutes
  enable_predictive_motion: !input enable_predictive_motion
  enable_notifications: !input enable_notifications
  notify_targets: !input notify_targets

  # Routine slot inputs
  morning_a_days: !input morning_a_days
  morning_a_target_warm: !input morning_a_target_warm
  morning_a_hold_until: !input morning_a_hold_until
  morning_a_target_temp: !input morning_a_target_temp
  morning_b_days: !input morning_b_days
  morning_b_target_warm: !input morning_b_target_warm
  morning_b_hold_until: !input morning_b_hold_until
  morning_b_target_temp: !input morning_b_target_temp
  evening_a_days: !input evening_a_days
  evening_a_target_warm: !input evening_a_target_warm
  evening_a_hold_until: !input evening_a_hold_until
  evening_a_target_temp: !input evening_a_target_temp
  evening_b_days: !input evening_b_days
  evening_b_target_warm: !input evening_b_target_warm
  evening_b_hold_until: !input evening_b_hold_until
  evening_b_target_temp: !input evening_b_target_temp

# Triggers and action will be added in later tasks.
trigger:
  # T1: Periodic 1-minute tick for dynamic auto_start + boost expiry
  - platform: time_pattern
    minutes: "/1"
    id: periodic

  # T2: Hall motion (morning predictive accelerator)
  - platform: state
    entity_id: !input hall_motion
    to: "on"
    id: hall_motion_on

  # T3: Stairs motion (evening predictive accelerator)
  - platform: state
    entity_id: !input stairs_motion
    to: "on"
    id: stairs_motion_on

  # T4: Boost toggle state change
  - platform: state
    entity_id: !input boost_toggle
    id: boost_change

  # T5: Vacation toggle state change
  - platform: state
    entity_id: !input vacation_off
    id: vacation_change

  # T6: Fan state change (ventilator coordination)
  - platform: state
    entity_id: !input fan_switch
    id: fan_change

  # T7: HA restart
  - platform: homeassistant
    event: start
    id: ha_start
action:
  # =============================================
  # STEP 1: COMPUTE LIVE STATE (inside action for trace visibility)
  # =============================================
  - variables:
      # --- Live sensor reads ---
      indoor_temp_primary: "{{ states(sensor_bathroom_temp) | float(-99) }}"
      indoor_temp_fallback: "{{ state_attr(entity_climate, 'current_temperature') | float(-99) }}"
      indoor_temp_has_primary: "{{ indoor_temp_primary | float(-99) > -50 }}"
      indoor_temp_has_fallback: "{{ indoor_temp_fallback | float(-99) > -50 }}"
      indoor_temp_both_unavailable: "{{ not indoor_temp_has_primary and not indoor_temp_has_fallback }}"
      indoor_temp: >-
        {% if indoor_temp_has_primary %}{{ indoor_temp_primary | float }}{% elif indoor_temp_has_fallback %}{{ indoor_temp_fallback | float }}{% else %}20{% endif %}

      current_setpoint: "{{ state_attr(entity_climate, 'temperature') | float(7) }}"
      current_hvac_mode: "{{ states(entity_climate) }}"
      # Tuya Cloud climate entities persistently report state='unknown' even when
      # in heat_cool mode. Normalising 'unknown' → 'heat_cool' prevents the
      # idempotent service-call check from firing set_hvac_mode every tick
      # (which causes the device to beep each time).
      current_hvac_mode_normalized: "{{ 'heat_cool' if current_hvac_mode == 'unknown' else current_hvac_mode }}"
      current_preset: "{{ state_attr(entity_climate, 'preset_mode') }}"
      fan_is_on: "{{ is_state(entity_fan, 'on') }}"

      # --- Time helpers ---
      today_dow: "{{ now().strftime('%a') | lower }}"
      now_dt: "{{ now() }}"

      # --- Vacation (safely handle empty list default) ---
      vacation_active: >-
        {% if entity_vacation is iterable and entity_vacation | length > 0 %}{{ expand(entity_vacation) | selectattr('state','eq','on') | list | length > 0 }}{% else %}false{% endif %}

      # --- Boost (stateless age-based expiry) ---
      boost_runtime_min_int: "{{ (boost_runtime_min | float) | int }}"
      boost_is_on: "{{ is_state(entity_boost, 'on') }}"
      boost_age_min: >-
        {% if states[entity_boost] %}{{ ((now() - states[entity_boost].last_changed).total_seconds() / 60) | int }}{% else %}0{% endif %}
      boost_active: "{{ boost_is_on and boost_age_min < boost_runtime_min_int }}"
      boost_expired: "{{ boost_is_on and boost_age_min >= boost_runtime_min_int }}"

  # =============================================
  # STEP 1b: ROUTINE SLOT RESOLUTION
  # =============================================
  - variables:
      # ----- MORNING A -----
      ma_in_days: "{{ today_dow in morning_a_days }}"
      ma_target_warm_dt: "{{ today_at(morning_a_target_warm) }}"
      ma_hold_until_dt: "{{ today_at(morning_a_hold_until) }}"
      ma_delta_T: "{{ [0, morning_a_target_temp | float - indoor_temp | float] | max }}"
      ma_warmup_min: >-
        {{ [warmup_max_minutes | int,
            [warmup_min_minutes | int,
             (warmup_base_min | int) + (warmup_per_degree_min | int) * (ma_delta_T | float)] | max
           ] | min | int }}
      ma_auto_start_dt: >-
        {{ as_datetime(ma_target_warm_dt) - timedelta(minutes=ma_warmup_min | int) }}
      ma_motion_lead_dt: >-
        {{ as_datetime(ma_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int) + 30) }}
      # Fallback to yesterday-midnight when motion sensor is missing — guarantees motion_in_lead=false
      ma_motion_last: >-
        {% if states[sensor_hall_motion] %}{{ states[sensor_hall_motion].last_changed }}{% else %}{{ today_at('00:00:00') - timedelta(days=1) }}{% endif %}
      ma_motion_in_lead: >-
        {{ enable_predictive_motion and
           as_datetime(ma_motion_last) > as_datetime(ma_motion_lead_dt) and
           as_datetime(ma_motion_last) < as_datetime(ma_target_warm_dt) }}
      ma_effective_start: >-
        {% if ma_motion_in_lead %}{{ [as_datetime(ma_auto_start_dt), as_datetime(ma_motion_last)] | min }}{% else %}{{ ma_auto_start_dt }}{% endif %}
      ma_active: >-
        {{ ma_in_days and
           as_datetime(ma_effective_start) <= as_datetime(now_dt) and
           as_datetime(now_dt) < as_datetime(ma_hold_until_dt) }}

      # ----- MORNING B -----
      mb_in_days: "{{ today_dow in morning_b_days }}"
      mb_target_warm_dt: "{{ today_at(morning_b_target_warm) }}"
      mb_hold_until_dt: "{{ today_at(morning_b_hold_until) }}"
      mb_delta_T: "{{ [0, morning_b_target_temp | float - indoor_temp | float] | max }}"
      mb_warmup_min: >-
        {{ [warmup_max_minutes | int,
            [warmup_min_minutes | int,
             (warmup_base_min | int) + (warmup_per_degree_min | int) * (mb_delta_T | float)] | max
           ] | min | int }}
      mb_auto_start_dt: "{{ as_datetime(mb_target_warm_dt) - timedelta(minutes=mb_warmup_min | int) }}"
      mb_motion_lead_dt: "{{ as_datetime(mb_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int) + 30) }}"
      mb_motion_last: >-
        {% if states[sensor_hall_motion] %}{{ states[sensor_hall_motion].last_changed }}{% else %}{{ today_at('00:00:00') - timedelta(days=1) }}{% endif %}
      mb_motion_in_lead: >-
        {{ enable_predictive_motion and
           as_datetime(mb_motion_last) > as_datetime(mb_motion_lead_dt) and
           as_datetime(mb_motion_last) < as_datetime(mb_target_warm_dt) }}
      mb_effective_start: >-
        {% if mb_motion_in_lead %}{{ [as_datetime(mb_auto_start_dt), as_datetime(mb_motion_last)] | min }}{% else %}{{ mb_auto_start_dt }}{% endif %}
      mb_active: >-
        {{ mb_in_days and as_datetime(mb_effective_start) <= as_datetime(now_dt) and as_datetime(now_dt) < as_datetime(mb_hold_until_dt) }}

      # ----- EVENING A -----
      ea_in_days: "{{ today_dow in evening_a_days }}"
      ea_target_warm_dt: "{{ today_at(evening_a_target_warm) }}"
      ea_hold_until_dt: "{{ today_at(evening_a_hold_until) }}"
      ea_delta_T: "{{ [0, evening_a_target_temp | float - indoor_temp | float] | max }}"
      ea_warmup_min: >-
        {{ [warmup_max_minutes | int,
            [warmup_min_minutes | int,
             (warmup_base_min | int) + (warmup_per_degree_min | int) * (ea_delta_T | float)] | max
           ] | min | int }}
      ea_auto_start_dt: "{{ as_datetime(ea_target_warm_dt) - timedelta(minutes=ea_warmup_min | int) }}"
      ea_motion_lead_dt: "{{ as_datetime(ea_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int) + 30) }}"
      ea_motion_last: >-
        {% if states[sensor_stairs_motion] %}{{ states[sensor_stairs_motion].last_changed }}{% else %}{{ today_at('00:00:00') - timedelta(days=1) }}{% endif %}
      ea_motion_in_lead: >-
        {{ enable_predictive_motion and
           as_datetime(ea_motion_last) > as_datetime(ea_motion_lead_dt) and
           as_datetime(ea_motion_last) < as_datetime(ea_target_warm_dt) }}
      ea_effective_start: >-
        {% if ea_motion_in_lead %}{{ [as_datetime(ea_auto_start_dt), as_datetime(ea_motion_last)] | min }}{% else %}{{ ea_auto_start_dt }}{% endif %}
      ea_active: >-
        {{ ea_in_days and as_datetime(ea_effective_start) <= as_datetime(now_dt) and as_datetime(now_dt) < as_datetime(ea_hold_until_dt) }}

      # ----- EVENING B -----
      eb_in_days: "{{ today_dow in evening_b_days }}"
      eb_target_warm_dt: "{{ today_at(evening_b_target_warm) }}"
      eb_hold_until_dt: "{{ today_at(evening_b_hold_until) }}"
      eb_delta_T: "{{ [0, evening_b_target_temp | float - indoor_temp | float] | max }}"
      eb_warmup_min: >-
        {{ [warmup_max_minutes | int,
            [warmup_min_minutes | int,
             (warmup_base_min | int) + (warmup_per_degree_min | int) * (eb_delta_T | float)] | max
           ] | min | int }}
      eb_auto_start_dt: "{{ as_datetime(eb_target_warm_dt) - timedelta(minutes=eb_warmup_min | int) }}"
      eb_motion_lead_dt: "{{ as_datetime(eb_target_warm_dt) - timedelta(minutes=(warmup_max_minutes | int) + 30) }}"
      eb_motion_last: >-
        {% if states[sensor_stairs_motion] %}{{ states[sensor_stairs_motion].last_changed }}{% else %}{{ today_at('00:00:00') - timedelta(days=1) }}{% endif %}
      eb_motion_in_lead: >-
        {{ enable_predictive_motion and
           as_datetime(eb_motion_last) > as_datetime(eb_motion_lead_dt) and
           as_datetime(eb_motion_last) < as_datetime(eb_target_warm_dt) }}
      eb_effective_start: >-
        {% if eb_motion_in_lead %}{{ [as_datetime(eb_auto_start_dt), as_datetime(eb_motion_last)] | min }}{% else %}{{ eb_auto_start_dt }}{% endif %}
      eb_active: >-
        {{ eb_in_days and as_datetime(eb_effective_start) <= as_datetime(now_dt) and as_datetime(now_dt) < as_datetime(eb_hold_until_dt) }}

      # ----- AGGREGATES -----
      morning_active: "{{ ma_active or mb_active }}"
      evening_active: "{{ ea_active or eb_active }}"
      morning_temp: >-
        {% if ma_active %}{{ morning_a_target_temp | float }}{% else %}{{ morning_b_target_temp | float }}{% endif %}
      evening_temp: >-
        {% if ea_active %}{{ evening_a_target_temp | float }}{% else %}{{ evening_b_target_temp | float }}{% endif %}

  # =============================================
  # STEP 2: SENSOR VALIDATION
  # =============================================
  # Only treat 'unavailable' as a true hard-stop. 'unknown' is NOT checked
  # here because some integrations (notably Tuya Cloud climate entities)
  # report state='unknown' as a normal operating state even when the device
  # is online, temperatures are updating, and service calls succeed.
  # Blocking on 'unknown' would prevent the priority waterfall from ever
  # running against those devices.
  - choose:
      # Climate entity unavailable — hard stop
      - conditions:
          - condition: template
            value_template: >-
              {{ states(entity_climate) == 'unavailable' }}
        sequence:
          - service: persistent_notification.create
            data:
              title: "Heating Rack — Climate Unavailable"
              message: >
                {{ entity_climate }} is {{ states(entity_climate) }}.
                Holding current state.
              notification_id: "heating_rack_climate_unavailable"
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - service: "{{ repeat.item }}"
                  data:
                    title: "Heating Rack — Climate Unavailable"
                    message: >-
                      {{ entity_climate }} is {{ states(entity_climate) }}.
                      Holding current state.
          - stop: "Climate entity unavailable"

      # Both primary temp sensor AND climate.current_temperature unavailable — soft warn, continue
      - conditions:
          - condition: template
            value_template: "{{ indoor_temp_both_unavailable }}"
        sequence:
          - service: persistent_notification.create
            data:
              title: "Heating Rack — Temperature Sensor Warning"
              message: >
                Both {{ sensor_bathroom_temp }} and
                {{ entity_climate }}.current_temperature are unavailable.
                Warmup formula is using 20°C as a fallback — ΔT-based
                lead time will be inaccurate until a sensor returns.
              notification_id: "heating_rack_sensor_warning"
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - service: "{{ repeat.item }}"
                  data:
                    title: "Heating Rack — Temperature Sensor Warning"
                    message: >-
                      Both {{ sensor_bathroom_temp }} and
                      {{ entity_climate }}.current_temperature are
                      unavailable. Warmup using 20°C fallback — ETA
                      inaccurate until a sensor returns.

  # =============================================
  # STEP 3: BOOST EXPIRY CLEANUP
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ boost_expired }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ entity_boost }}"

  # =============================================
  # STEP 4: PRIORITY CHOOSE (P1–P6)
  # Each branch resolves desired_mode, desired_preset, desired_setpoint
  # via a nested variables block, then falls through to the idempotent
  # service-call block at the end.
  #
  # NOTE: all desired_* templates are single-line to avoid embedded
  # whitespace/newlines in the output string (which would break
  # equality checks like `desired_setpoint != 'none'`).
  #
  # Precedence (v1.1.1+): P1 vacation > P3 boost > P2 fan_coord > P4 evening
  # > P5 morning > P6 idle. Boost beats fan_coord because a user tapping
  # boost is explicit intent that should win over the automatic heat-saving
  # fan pause. Fan_coord still pauses P4/P5 auto routines during active
  # ventilation. P2/P3 labels are historical — the numeric suffix no
  # longer reflects the evaluation order.
  # =============================================
  - variables:
      desired_mode: "{% if vacation_active %}off{% else %}heat_cool{% endif %}"
      desired_preset: "{% if vacation_active %}none{% elif boost_active %}none{% elif fan_is_on and (morning_active or evening_active) %}eco{% elif evening_active or morning_active %}none{% else %}eco{% endif %}"
      # P2 (fan pause) and P6 (idle) drive the setpoint to `idle_setpoint` (default 7°C)
      # rather than leaving the previous active-routine setpoint in place. Earlier
      # versions left setpoint='none' for these states assuming preset=eco would
      # impose a low frost-protect value; on the Tuya ECOSO device the explicit
      # setpoint always wins regardless of preset, so we'd continue to heat to the
      # previous target (e.g. 23°C from a boost) during idle. See v1.0.5 notes.
      desired_setpoint: "{% if vacation_active %}none{% elif boost_active %}{{ boost_target_temp | float }}{% elif fan_is_on and (morning_active or evening_active) %}{{ idle_setpoint | float }}{% elif evening_active %}{{ evening_temp | float }}{% elif morning_active %}{{ morning_temp | float }}{% else %}{{ idle_setpoint | float }}{% endif %}"
      active_priority: "{% if vacation_active %}P1_vacation{% elif boost_active %}P3_boost{% elif fan_is_on and (morning_active or evening_active) %}P2_fan_coord{% elif evening_active %}P4_evening{% elif morning_active %}P5_morning{% else %}P6_idle{% endif %}"

  # =============================================
  # STEP 4b: IDEMPOTENT SERVICE CALLS
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ current_hvac_mode_normalized != desired_mode }}"
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: "{{ entity_climate }}"
            data:
              hvac_mode: "{{ desired_mode }}"

  # Set preset_mode only when we want a real preset (e.g. "eco").
  # Skipping the service call when desired_preset == 'none' is an explicit
  # workaround: many HA climate integrations (including generic_thermostat
  # with only ["eco"] in preset_modes) reject set_preset_mode: 'none' with
  # "not a valid preset". On those integrations, explicit setpoint changes
  # (climate.set_temperature) automatically pull the thermostat out of the
  # previous preset, so skipping here is safe.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ desired_preset != 'none'
                 and (current_preset | default('none')) != desired_preset }}
        sequence:
          - service: climate.set_preset_mode
            target:
              entity_id: "{{ entity_climate }}"
            data:
              preset_mode: "{{ desired_preset }}"

  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ desired_setpoint != 'none'
                 and (current_setpoint | float - desired_setpoint | float) | abs > 0.1 }}
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: "{{ entity_climate }}"
            data:
              temperature: "{{ desired_setpoint | float }}"

  # =============================================
  # STEP 5: NOTIFICATIONS
  # =============================================
  - choose:
      # Warmup started — transitioning to P3/P4/P5 from non-active
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications
                 and active_priority in ['P3_boost','P4_evening','P5_morning']
                 and (current_hvac_mode == 'off' or
                      (current_preset | default('none')) == 'eco') }}
        sequence:
          - variables:
              eta_delta: "{{ [0, desired_setpoint | float - indoor_temp | float] | max }}"
              eta_min: >-
                {{ [warmup_max_minutes | int,
                    [warmup_min_minutes | int,
                     (warmup_base_min | int) + (warmup_per_degree_min | int) * (eta_delta | float)] | max
                   ] | min | int }}
          - service: persistent_notification.create
            data:
              title: "Heating Rack — Warmup Started"
              message: >
                Priority: {{ active_priority }}.
                Current {{ indoor_temp | round(1) }}°C → target
                {{ desired_setpoint }}°C. ETA ~{{ eta_min }} min.
              notification_id: "heating_rack_warmup_started"
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - service: "{{ repeat.item }}"
                  data:
                    title: "Heating Rack — Warmup Started"
                    message: >-
                      {{ active_priority }}: {{ indoor_temp | round(1) }}°C
                      → {{ desired_setpoint }}°C. ETA ~{{ eta_min }} min.

      # Target reached — within 0.5°C of desired while routine active
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications
                 and active_priority in ['P3_boost','P4_evening','P5_morning']
                 and desired_setpoint != 'none'
                 and (indoor_temp | float - desired_setpoint | float) | abs < 0.5 }}
        sequence:
          - service: persistent_notification.create
            data:
              title: "Heating Rack — At Target"
              message: >
                Bathroom at {{ indoor_temp | round(1) }}°C
                (target {{ desired_setpoint }}°C). {{ active_priority }}.
              notification_id: "heating_rack_target_reached"

  # =============================================
  # STEP 6: DEBUG NOTIFICATION (Manual Run Only)
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id | default('manual') == 'manual' }}"
        sequence:
          - service: persistent_notification.create
            data:
              title: "Heating Rack Debug — {{ now().strftime('%H:%M:%S') }}"
              message: >
                **Indoor:** {{ indoor_temp | round(1) }}°C
                | **Setpoint:** {{ current_setpoint }}°C
                | **Mode:** {{ current_hvac_mode }}
                | **Preset:** {{ current_preset | default('none') }}

                **Fan:** {{ 'ON' if fan_is_on else 'OFF' }}
                | **Vacation:** {{ vacation_active }}
                | **Boost:** {{ 'ON' if boost_is_on else 'off' }} (age {{ boost_age_min }}m, expires {{ boost_runtime_min_int }}m)

                **Today:** {{ today_dow }}

                **Morning A:** days={{ ma_in_days }}, ΔT={{ ma_delta_T }}°C, warmup={{ ma_warmup_min }}m, auto_start={{ as_datetime(ma_auto_start_dt).strftime('%H:%M') }}, eff_start={{ as_datetime(ma_effective_start).strftime('%H:%M') }}, active={{ ma_active }}

                **Morning B:** days={{ mb_in_days }}, active={{ mb_active }}

                **Evening A:** days={{ ea_in_days }}, ΔT={{ ea_delta_T }}°C, warmup={{ ea_warmup_min }}m, auto_start={{ as_datetime(ea_auto_start_dt).strftime('%H:%M') }}, eff_start={{ as_datetime(ea_effective_start).strftime('%H:%M') }}, active={{ ea_active }}

                **Evening B:** days={{ eb_in_days }}, active={{ eb_active }}

                **→ Priority:** {{ active_priority }}
                | **→ Desired:** mode={{ desired_mode }}, preset={{ desired_preset }}, setpoint={{ desired_setpoint }}
              notification_id: "heating_rack_debug"
