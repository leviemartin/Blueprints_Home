blueprint:
  name: "Circadian Living Room Lights v3.0.0"
  description: >
    **Version: 3.0.0 - Dual presence (FP2 + FP300)**
    
    A comprehensive lighting automation for the Living Room that adapts to human presence, 
    circadian rhythms, and specific family routines. Optimized for Philips Hue Infuse and Bulbs.
    
    **Features:**
    - **Fully Configurable Profiles:** Customize Time, Kelvin, and Brightness for Dinner, Toddler, Evening, and Night.
    - **Brightness Calibration:** Scale ceiling light brightness to match bulbs for even distribution.
    - **Separate Control:** Independent inputs for Hue Bulbs and Hue Ceiling Lights.
    - **Native Hue Effects:** Optional "Candlelight" or "Fireplace" effects for Evening and Night modes.
    - **Manual Override:** Pause automation via a Switch or Input Boolean (e.g., for Movie Night).
    - **Daylight Harvesting:** Auto-Off if naturally bright (>400 lux).
    - **Flicker Protection:** Hybrid Lux logic prevents rapid toggling.
    - **Dual Presence:** Either FP2 or FP300 on turns lights on.
    - **Presence Timeout:** Lights turn off only after both sensors are clear for presence_timeout,
      or late_night_timeout inside the late-night window.
    - **FP300 Offline:** After 30 min unavailable or unknown, push to each notify target.
    
  domain: automation
  input:
    hue_bulbs:
      name: Philips Hue Bulbs
      description: Select your Philips Hue bulbs/spots and Gradient TV strips here.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    hue_ceiling:
      name: Philips Hue Ceiling Lights (Infuse)
      description: Select your Hue Infuse ceiling light entities (Main and Backlight) here.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    ceiling_brightness_scale:
      name: Ceiling Brightness Scale
      description: "Scale ceiling brightness to match bulbs for even distribution (e.g., 0.6 = 60% of bulb brightness)."
      default: 0.6
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.05
    presence_fp2:
      name: Presence Sensor (FP2)
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
    presence_fp300:
      name: Presence Sensor (FP300)
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
    presence_timeout:
      name: Presence Timeout
      description: "Wait this long after both presence sensors are clear before turning off lights (Default: 5 min)."
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    late_night_timeout:
      name: Late-Night Timeout
      default: 1
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
    late_night_start:
      name: Late-Night Start
      default: "23:00:00"
      selector:
        time:
    late_night_end:
      name: Late-Night End
      default: "06:30:00"
      selector:
        time:
    illuminance_entity:
      name: Illuminance (Lux) Sensor
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    override_entity:
      name: Manual Override Switch
      description: "If ON, automation pauses. Use a Helper (Input Boolean) toggled by your Remote."
      default: []
      selector:
        entity:
          domain: 
            - input_boolean
            - switch
    
    # --- Thresholds ---
    lux_on_threshold:
      name: Turn On Threshold
      description: "Lights turn ON if Lux drops below this (Default: 150)."
      default: 150
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    lux_off_threshold:
      name: Turn Off Threshold (Daylight Harvesting)
      description: "Lights turn OFF if Lux stays above this (Default: 400)."
      default: 400
      selector:
        number:
          min: 100
          max: 2000
          unit_of_measurement: lx
    lux_off_duration:
      name: Turn Off Duration
      description: "How long Lux must be high before turning off (Anti-Flicker)."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

    # --- DINNER PROFILE ---
    time_dinner:
      name: Dinner Start Time
      default: "18:00:00"
      selector:
        time:
    dinner_kelvin:
      name: Dinner Color (K)
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    dinner_bri:
      name: Dinner Brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- TODDLER PROFILE ---
    time_toddler:
      name: Toddler Prep Start Time
      default: "19:00:00"
      selector:
        time:
    toddler_kelvin:
      name: Toddler Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    toddler_bri:
      name: Toddler Brightness (%)
      default: 60
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- EVENING PROFILE ---
    time_evening:
      name: Evening Start Time
      default: "20:00:00"
      selector:
        time:
    evening_kelvin:
      name: Evening Color (K)
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    evening_bri:
      name: Evening Brightness (%)
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    evening_effect:
      name: Evening Effect
      description: "Optional native Hue effect for the ceiling lights."
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Candlelight"
              value: "candlelight"
            - label: "Fireplace"
              value: "fireplace"

    # --- NIGHT PROFILE ---
    time_night:
      name: Night Start Time
      default: "22:00:00"
      selector:
        time:
    night_kelvin:
      name: Night Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    night_bri:
      name: Night Brightness (%)
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    night_effect:
      name: Night Effect
      description: "Optional native Hue effect for the ceiling lights."
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Candlelight"
              value: "candlelight"
            - label: "Fireplace"
              value: "fireplace"

    # --- General Light Settings ---
    max_kelvin:
      name: Max Kelvin (Daylight)
      description: Used for Day Mode calculation.
      default: 4500
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    min_kelvin:
      name: Min Kelvin (Warm)
      description: Used for Day Mode calculation.
      default: 2200
      selector:
        number:
          min: 2000
          max: 4000
          step: 100
          unit_of_measurement: K

    notify_targets:
      name: Mobile Push Targets
      description: >-
        List of notify services to push high-priority events to. Enter the full service name
        including the `notify.` prefix (e.g. notify.mobile_app_martin_fold); entries that do not
        look like `notify.<name>` are ignored. A target that does not exist aborts the run at the
        push step (HA does not suppress a missing action), so check it exists after editing. Leave
        empty to disable push. Events that push: FP300 unavailable or unknown for 30 min.
      default: []
      selector:
        text:
          multiple: true

mode: restart
max_exceeded: silent

trigger_variables:
  late_night_timeout: !input late_night_timeout

trigger:
  # Either sensor can turn the room on.
  - platform: state
    entity_id: !input presence_fp2
    to: "on"
    id: "presence_on_fp2"
  - platform: state
    entity_id: !input presence_fp300
    to: "on"
    id: "presence_on_fp300"

  # Each clear transition re-arms its timer and updates last_changed.
  - platform: state
    entity_id: !input presence_fp2
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: !input presence_timeout
    id: "presence_off_long_fp2"
  - platform: state
    entity_id: !input presence_fp300
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: !input presence_timeout
    id: "presence_off_long_fp300"
  - platform: state
    entity_id: !input presence_fp2
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: "{{ [1, [60, late_night_timeout | int(1)] | min] | max }}"
    id: "presence_off_short_fp2"
  - platform: state
    entity_id: !input presence_fp300
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: "{{ [1, [60, late_night_timeout | int(1)] | min] | max }}"
    id: "presence_off_short_fp300"

  # 3. Periodic Update (Circadian Shift)
  - platform: time_pattern
    minutes: "/5"
    id: "update_loop"

  # 4. Daylight Harvesting (Auto-OFF)
  - platform: numeric_state
    entity_id: !input illuminance_entity
    above: !input lux_off_threshold
    for: 
      minutes: !input lux_off_duration
    id: "lux_high"

  # 5. Daylight Fading (Auto-ON)
  - platform: numeric_state
    entity_id: !input illuminance_entity
    below: !input lux_on_threshold
    id: "lux_low"

  # 6. Override Turned OFF (Resume)
  - platform: state
    entity_id: !input override_entity
    to: "off"
    id: "override_resume"

  - platform: state
    entity_id: !input presence_fp300
    to: "unavailable"
    for:
      minutes: 30
    id: "fp300_unavailable_30m"
  - platform: state
    entity_id: !input presence_fp300
    to: "unknown"
    for:
      minutes: 30
    id: "fp300_unknown_30m"

variables:
  # Inputs
  hue_list_bulbs: !input hue_bulbs
  hue_list_ceiling: !input hue_ceiling
  # Combine for presence checks (turn-on/off logic)
  all_target_lights: "{{ hue_list_bulbs + hue_list_ceiling }}"
  
  sensor_lux: !input illuminance_entity
  presence_fp2: !input presence_fp2
  presence_fp300: !input presence_fp300
  presence_timeout: !input presence_timeout
  late_night_timeout: !input late_night_timeout
  late_night_start: !input late_night_start
  late_night_end: !input late_night_end
  notify_targets: !input notify_targets
  entity_override: !input override_entity
  threshold_on: !input lux_on_threshold
  val_max_k: !input max_kelvin
  val_min_k: !input min_kelvin
  
  # Scaling
  c_scale: !input ceiling_brightness_scale
  
  # Time Slots
  t_dinner: !input time_dinner
  t_toddler: !input time_toddler
  t_evening: !input time_evening
  t_night: !input time_night
  
  # Profile Settings
  k_dinner: !input dinner_kelvin
  b_dinner: !input dinner_bri
  k_toddler: !input toddler_kelvin
  b_toddler: !input toddler_bri
  k_evening: !input evening_kelvin
  b_evening: !input evening_bri
  e_evening: !input evening_effect
  k_night: !input night_kelvin
  b_night: !input night_bri
  e_night: !input night_effect

action:
  # 1. Check Override First
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ entity_override != [] and is_state(entity_override, 'on') and trigger.id | default('') not in ['fp300_unavailable_30m', 'fp300_unknown_30m'] }}"
        sequence:
          - stop: "Manual Override is ON. Automation halted."

  # 2. Calculate Common Logic Variables
  - variables:
      current_lux: "{{ states(sensor_lux) | float(0) }}"
      is_presence_on: "{{ (presence_fp2 is string and presence_fp2 | length > 0 and is_state(presence_fp2, 'on')) or (presence_fp300 is string and presence_fp300 | length > 0 and is_state(presence_fp300, 'on')) }}"
      late_night_minutes: "{{ [1, [60, late_night_timeout | int(1)] | min] | max }}"
      in_late_window: >
        {% set t = now().strftime('%H:%M:%S') %}
        {% if late_night_start < late_night_end %}
          {{ late_night_start <= t and t < late_night_end }}
        {% elif late_night_start > late_night_end %}
          {{ late_night_start <= t or t < late_night_end }}
        {% else %}{{ false }}{% endif %}
      presence_off_ok: >
        {% set tid = trigger.id | default('') %}
        {% set short_ids = ['presence_off_short_fp2', 'presence_off_short_fp300'] %}
        {% set off_ids = ['presence_off_long_fp2', 'presence_off_long_fp300'] + short_ids %}
        {% if tid not in off_ids or (tid in short_ids and not in_late_window) %}{{ false }}
        {% else %}
          {% set other = presence_fp300 if tid in ['presence_off_long_fp2', 'presence_off_short_fp2'] else presence_fp2 %}
          {% set minutes = late_night_minutes if tid in short_ids else presence_timeout %}
          {% if not (other is string and other | length > 0) %}{{ true }}
          {% else %}
            {% set st = states[other] %}
            {% set lc = st.last_changed if (st is not none and st.last_changed is defined) else none %}
            {{ states(other) in ['off', 'unavailable', 'unknown'] and lc is not none
               and as_timestamp(now()) - as_timestamp(lc) >= (minutes | float(0)) * 60 }}
          {% endif %}
        {% endif %}
      notify_list: "{{ (notify_targets if (notify_targets is iterable and notify_targets is not string) else ([notify_targets] if notify_targets else [])) | select('match', '^notify[.][a-z0-9_]+$') | list }}"
      
      # Determine Current Mode based on Time
      mode: >
        {% set t_now = now().strftime('%H:%M:%S') %}
        {% if t_now >= t_night %} night
        {% elif t_now >= t_evening %} evening
        {% elif t_now >= t_toddler %} toddler
        {% elif t_now >= t_dinner %} dinner
        {% elif t_now >= '06:00:00' %} day
        {% else %} night {% endif %}
      
      # Target Kelvin (Base)
      target_kelvin: >
        {% if mode == 'dinner' %} {{ k_dinner }}
        {% elif mode == 'toddler' %} {{ k_toddler }}
        {% elif mode == 'evening' %} {{ k_evening }}
        {% elif mode == 'night' %} {{ k_night }}
        {% else %}
          {# Day Mode: Use Sun Elevation #}
          {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set pct = (elev + 6) / 51 %}
          {% set k = (val_max_k - val_min_k) * pct + val_min_k %}
          {{ [val_min_k, [val_max_k, k] | min] | max | int }}
        {% endif %}
        
      target_brightness: >
        {% if mode == 'dinner' %} {{ b_dinner }}
        {% elif mode == 'toddler' %} {{ b_toddler }}
        {% elif mode == 'evening' %} {{ b_evening }}
        {% elif mode == 'night' %} {{ b_night }}
        {% else %} 100 {% endif %}

      ceiling_bri: "{{ (target_brightness | float * c_scale | float) | round(0) | int }}"

      target_effect: >
        {% if mode == 'evening' %} {{ e_evening }}
        {% elif mode == 'night' %} {{ e_night }}
        {% else %} none {% endif %}

  - choose:
      # SCENARIO 1: TURN OFF
      - conditions:
          - condition: or
            conditions:
              - condition: template
                value_template: "{{ presence_off_ok }}"
              - condition: trigger
                id: "lux_high"
        sequence:
          - if:
              - condition: template
                value_template: "{{ all_target_lights != [] }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: "{{ all_target_lights }}"
                data:
                  transition: 5

      # SCENARIO 2: TURN ON
      - conditions:
          - condition: template
            value_template: "{{ is_presence_on }}"
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: ["presence_on_fp2", "presence_on_fp300"]
                  - condition: template
                    value_template: "{{ current_lux < threshold_on }}"
              - condition: trigger
                id: "lux_low"
              - condition: trigger
                id: "override_resume"
        sequence:
          # Turn on Bulbs (Native transition)
          - if:
              - condition: template
                value_template: "{{ hue_list_bulbs != [] }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ hue_list_bulbs }}"
                data:
                  color_temp_kelvin: "{{ target_kelvin }}"
                  brightness_pct: "{{ target_brightness }}"
                  transition: 2
          # Turn on Ceiling Lights (Scaled and/or Effect)
          - if:
              - condition: template
                value_template: "{{ hue_list_ceiling != [] }}"
            then:
              - choose:
                  # Apply with Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect != 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ hue_list_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 2
                          effect: "{{ target_effect }}"
                  # Apply without Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect == 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ hue_list_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 2

      # SCENARIO 3: UPDATE LOOP
      - conditions:
          - condition: trigger
            id: "update_loop"
          - condition: template
            value_template: >
              {{ expand(all_target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}
          - condition: template
            value_template: "{{ current_lux < (threshold_on + 300) }}" 
        sequence:
          # Update Active Bulbs (Native 30s)
          - if:
              - condition: template
                value_template: "{{ expand(hue_list_bulbs) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: >
                    {{ expand(hue_list_bulbs) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
                data:
                  color_temp_kelvin: "{{ target_kelvin }}"
                  brightness_pct: "{{ target_brightness }}"
                  transition: 30
          # Update Active Ceiling Lights (Native 30s)
          - if:
              - condition: template
                value_template: "{{ expand(hue_list_ceiling) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
            then:
              - variables:
                  on_ceiling: >
                    {{ expand(hue_list_ceiling) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
              - choose:
                  # Update with Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect != 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ on_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 30
                          effect: "{{ target_effect }}"
                  # Update without Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect == 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ on_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 30

  # ponytail: mode restart can interrupt pushes; use a queued script if delivery must be durable.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id | default('') in ['fp300_unavailable_30m', 'fp300_unknown_30m'] }}"
        sequence:
          - repeat:
              for_each: "{{ notify_list }}"
              sequence:
                - service: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "Living Room Lights - FP300 offline"
                    message: >-
                      {{ presence_fp300 }} has been {{ 'unavailable' if trigger.id == 'fp300_unavailable_30m' else 'unknown' }} for 30 min.
                      The lights follow the FP2 alone until it returns.
