blueprint:
  name: "Circadian Living Room Lights v3.3.0"
  description: >
    **Version: 3.3.0 - Manual changes respected (RFC 2026-11-26)**
    
    A comprehensive lighting automation for the Living Room that adapts to human presence, 
    circadian rhythms, and specific family routines. Optimized for Philips Hue Infuse and Bulbs.
    
    **Features:**
    - **Fully Configurable Profiles:** Customize Time, Kelvin, and Brightness for Dinner, Toddler, Evening, and Night.
    - **Brightness Calibration:** Scale ceiling light brightness to match bulbs for even distribution.
    - **Separate Control:** Independent inputs for Hue Bulbs and Hue Ceiling Lights.
    - **Native Hue Effects:** Optional "Candlelight" or "Fireplace" effects for Evening and Night modes.
    - **Manual Override:** Pause automation via a Switch or Input Boolean (e.g., for Movie Night).
    - **Re-check:** Every trigger, HA start, automation reload and a 5-min tick recompute whether
      the lights should be on; the tick can only turn lights off, never on. Start and reload act on
      the current lux at once, because HA drops the lux timers.
    - **Daylight Harvesting:** Off above lux_off_threshold held lux_off_duration; on again below
      lux_on_threshold held lux_on_duration. No lux reading means no lux decision.
    - **Dual Presence:** Either FP2 or FP300 on turns lights on.
    - **Presence Timeout:** Lights turn off only after both sensors are clear for presence_timeout,
      or late_night_timeout inside the late-night window. A missing, unavailable or unknown sensor
      counts as clear.
    - **Night Window:** Between fp300_ignore_start and fp300_ignore_end (01:00-06:00) the FP300 is
      ignored (it cannot turn lights on or keep them on). Before turning off in the window the lights
      dim to 30 % of the profile brightness for 1 min; FP2 presence restores them.
    - **Manual Changes:** A light whose colour or brightness was changed by hand is left alone by
      the 5-min update until the next profile start (day, dinner, toddler, evening, night). Lights
      switched off by hand stay off until the room has been empty for the timeout.
    - **Sensor Offline:** After 30 min unavailable or unknown, push to each notify target; a sensor
      missing from Home Assistant is pushed once an hour.
    
  domain: automation
  input:
    hue_bulbs:
      name: Philips Hue Bulbs
      description: Select your Philips Hue bulbs/spots and Gradient TV strips here.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    hue_ceiling:
      name: Philips Hue Ceiling Lights (Infuse)
      description: Select your Hue Infuse ceiling light entities (Main and Backlight) here.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    ceiling_brightness_scale:
      name: Ceiling Brightness Scale
      description: "Scale ceiling brightness to match bulbs for even distribution (e.g., 0.6 = 60% of bulb brightness)."
      default: 0.6
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.05
    presence_fp2:
      name: Presence Sensor (FP2)
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
    presence_fp300:
      name: Presence Sensor (FP300)
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
    presence_timeout:
      name: Presence Timeout
      description: "Wait this long after both presence sensors are clear before turning off lights (Default: 5 min)."
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    late_night_timeout:
      name: Late-Night Timeout
      default: 1
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: min
    late_night_start:
      name: Late-Night Start
      default: "23:00:00"
      selector:
        time:
    late_night_end:
      name: Late-Night End
      default: "06:30:00"
      selector:
        time:
    fp300_ignore_start:
      name: Ignore FP300 From
      description: "Start of the night window in which the FP300 is ignored (e.g. a dog on the couch). Equal start and end means no window."
      default: "01:00:00"
      selector:
        time:
    fp300_ignore_end:
      name: Ignore FP300 Until
      description: "End of the night window (exclusive; may cross midnight)."
      default: "06:00:00"
      selector:
        time:
    illuminance_entity:
      name: Illuminance (Lux) Sensor
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    override_entity:
      name: Manual Override Switch
      description: "If ON, automation pauses. Use a Helper (Input Boolean) toggled by your Remote."
      default: []
      selector:
        entity:
          domain: 
            - input_boolean
            - switch
    
    # --- Thresholds ---
    lux_on_threshold:
      name: Turn On Threshold
      description: "Lights turn ON if Lux drops below this (Default: 150)."
      default: 150
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    lux_off_threshold:
      name: Turn Off Threshold (Daylight Harvesting)
      description: "Lights turn OFF if Lux stays above this (Default: 400)."
      default: 400
      selector:
        number:
          min: 100
          max: 2000
          unit_of_measurement: lx
    lux_off_duration:
      name: Turn Off Duration
      description: "How long Lux must be high before turning off (Anti-Flicker)."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    lux_on_duration:
      name: Turn On Duration
      description: "How long Lux must be low before lights that daylight turned off come back on (Anti-Flicker)."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

    # --- DINNER PROFILE ---
    time_dinner:
      name: Dinner Start Time
      default: "18:00:00"
      selector:
        time:
    dinner_kelvin:
      name: Dinner Color (K)
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    dinner_bri:
      name: Dinner Brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- TODDLER PROFILE ---
    time_toddler:
      name: Toddler Prep Start Time
      default: "19:00:00"
      selector:
        time:
    toddler_kelvin:
      name: Toddler Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    toddler_bri:
      name: Toddler Brightness (%)
      default: 60
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- EVENING PROFILE ---
    time_evening:
      name: Evening Start Time
      default: "20:00:00"
      selector:
        time:
    evening_kelvin:
      name: Evening Color (K)
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    evening_bri:
      name: Evening Brightness (%)
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    evening_effect:
      name: Evening Effect
      description: "Optional native Hue effect for the ceiling lights."
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Candlelight"
              value: "candlelight"
            - label: "Fireplace"
              value: "fireplace"

    # --- NIGHT PROFILE ---
    time_night:
      name: Night Start Time
      default: "22:00:00"
      selector:
        time:
    night_kelvin:
      name: Night Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    night_bri:
      name: Night Brightness (%)
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    night_effect:
      name: Night Effect
      description: "Optional native Hue effect for the ceiling lights."
      default: "none"
      selector:
        select:
          options:
            - label: "None"
              value: "none"
            - label: "Candlelight"
              value: "candlelight"
            - label: "Fireplace"
              value: "fireplace"

    # --- General Light Settings ---
    max_kelvin:
      name: Max Kelvin (Daylight)
      description: Used for Day Mode calculation.
      default: 4500
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    min_kelvin:
      name: Min Kelvin (Warm)
      description: Used for Day Mode calculation.
      default: 2200
      selector:
        number:
          min: 2000
          max: 4000
          step: 100
          unit_of_measurement: K

    notify_targets:
      name: Mobile Push Targets
      description: >-
        List of notify services to push high-priority events to. Enter the full service name
        including the `notify.` prefix (e.g. notify.mobile_app_martin_fold); entries that do not
        look like `notify.<name>` are ignored. A target that does not exist aborts the run at the
        push step (HA does not suppress a missing action), so check it exists after editing. Leave
        empty to disable push. Events that push: FP300 unavailable or unknown for 30 min.
      default: []
      selector:
        text:
          multiple: true

mode: restart
max_exceeded: silent

trigger_variables:
  late_night_timeout: !input late_night_timeout
  dog_start: !input fp300_ignore_start
  dog_end: !input fp300_ignore_end

trigger:
  # Either sensor can turn the room on.
  - platform: state
    entity_id: !input presence_fp2
    to: "on"
    id: "presence_on_fp2"
  - platform: state
    entity_id: !input presence_fp300
    to: "on"
    id: "presence_on_fp300"

  # Wake-ups when a sensor has been clear long enough; the decision re-checks the whole room.
  - platform: state
    entity_id: !input presence_fp2
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: !input presence_timeout
    id: "presence_off_long_fp2"
  - platform: state
    entity_id: !input presence_fp300
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: !input presence_timeout
    id: "presence_off_long_fp300"
  - platform: state
    entity_id: !input presence_fp2
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: "{{ [1, [60, late_night_timeout | int(1)] | min] | max }}"
    id: "presence_off_short_fp2"
  - platform: state
    entity_id: !input presence_fp300
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: "{{ [1, [60, late_night_timeout | int(1)] | min] | max }}"
    id: "presence_off_short_fp300"
  # Night window: FP2 clear for late_night_timeout dims (short trigger above), one minute more turns off.
  - platform: state
    entity_id: !input presence_fp2
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: "{{ [1, [60, late_night_timeout | int(1)] | min] | max + 1 }}"
    id: "presence_off_night_fp2"

  # Re-check: circadian shift, missed timers and missed lux crossings. Never turns lights on.
  - platform: time_pattern
    minutes: "/5"
    id: "update_loop"
  - platform: homeassistant
    event: start
    id: "ha_start"
  - platform: event
    event_type: automation_reloaded
    id: "reload"

  # Daylight harvesting, both edges held.
  - platform: numeric_state
    entity_id: !input illuminance_entity
    above: !input lux_off_threshold
    for:
      minutes: !input lux_off_duration
    id: "lux_high"
  - platform: numeric_state
    entity_id: !input illuminance_entity
    below: !input lux_on_threshold
    for:
      minutes: !input lux_on_duration
    id: "lux_low"

  - platform: state
    entity_id: !input override_entity
    to: "off"
    id: "override_resume"

  # Night window start: lights the FP300 was holding dim, then go off (re-checked by the decision).
  - platform: template
    value_template: >
        {% set ns = namespace(m=-1) %}
        {% if dog_start != dog_end %}
          {% set start = today_at(dog_start) %}
          {% if start > now() %}{% set start = start - timedelta(days=1) %}{% endif %}
          {% set ns.m = ((as_timestamp(now()) - as_timestamp(start)) // 60) | int %}
        {% endif %}
        {{ ns.m == [1, [60, late_night_timeout | int(1)] | min] | max }}
    id: "dog_window_dim"
  - platform: template
    value_template: >
        {% set ns = namespace(m=-1) %}
        {% if dog_start != dog_end %}
          {% set start = today_at(dog_start) %}
          {% if start > now() %}{% set start = start - timedelta(days=1) %}{% endif %}
          {% set ns.m = ((as_timestamp(now()) - as_timestamp(start)) // 60) | int %}
        {% endif %}
        {{ ns.m == [1, [60, late_night_timeout | int(1)] | min] | max + 1 }}
    id: "dog_window_off"

  # Profile starts re-apply colour and brightness even to lights changed by hand (D6).
  - platform: time
    at: "06:00:00"
    id: "profile_day"
  - platform: time
    at: !input time_dinner
    id: "profile_dinner"
  - platform: time
    at: !input time_toddler
    id: "profile_toddler"
  - platform: time
    at: !input time_evening
    id: "profile_evening"
  - platform: time
    at: !input time_night
    id: "profile_night"

  - platform: state
    entity_id: !input presence_fp2
    to: "unavailable"
    for:
      minutes: 30
    id: "fp2_unavailable_30m"
  - platform: state
    entity_id: !input presence_fp2
    to: "unknown"
    for:
      minutes: 30
    id: "fp2_unknown_30m"
  - platform: state
    entity_id: !input presence_fp300
    to: "unavailable"
    for:
      minutes: 30
    id: "fp300_unavailable_30m"
  - platform: state
    entity_id: !input presence_fp300
    to: "unknown"
    for:
      minutes: 30
    id: "fp300_unknown_30m"

variables:
  # Inputs
  hue_list_bulbs: !input hue_bulbs
  hue_list_ceiling: !input hue_ceiling
  all_target_lights: "{{ hue_list_bulbs + hue_list_ceiling }}"

  sensor_lux: !input illuminance_entity
  presence_fp2: !input presence_fp2
  presence_fp300: !input presence_fp300
  presence_timeout: !input presence_timeout
  late_night_timeout: !input late_night_timeout
  late_night_start: !input late_night_start
  late_night_end: !input late_night_end
  dog_start: !input fp300_ignore_start
  dog_end: !input fp300_ignore_end
  notify_targets: !input notify_targets
  entity_override: !input override_entity
  threshold_on: !input lux_on_threshold
  threshold_off: !input lux_off_threshold
  off_duration: !input lux_off_duration
  val_max_k: !input max_kelvin
  val_min_k: !input min_kelvin
  notice_ids: ["fp2_unavailable_30m", "fp2_unknown_30m", "fp300_unavailable_30m", "fp300_unknown_30m"]

  # Scaling
  c_scale: !input ceiling_brightness_scale

  # Time Slots
  t_dinner: !input time_dinner
  t_toddler: !input time_toddler
  t_evening: !input time_evening
  t_night: !input time_night

  # Profile Settings
  k_dinner: !input dinner_kelvin
  b_dinner: !input dinner_bri
  k_toddler: !input toddler_kelvin
  b_toddler: !input toddler_bri
  k_evening: !input evening_kelvin
  b_evening: !input evening_bri
  e_evening: !input evening_effect
  k_night: !input night_kelvin
  b_night: !input night_bri
  e_night: !input night_effect

action:
  # 1. Manual override pauses everything except the offline notices.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ entity_override != [] and is_state(entity_override, 'on') and trigger.id | default('') not in ['fp2_unavailable_30m', 'fp2_unknown_30m', 'fp300_unavailable_30m', 'fp300_unknown_30m'] }}"
        sequence:
          - stop: "Manual Override is ON. Automation halted."

  # 2. Recompute the whole room from current state.
  - variables:
      current_lux: "{{ states(sensor_lux) | float(none) }}"
      lux_age: >
        {% set st = states[sensor_lux] if sensor_lux is string and sensor_lux | length > 0 else none %}
        {% if st is not none and st.last_changed is defined and st.last_changed is not none %}{{ (as_timestamp(now()) - as_timestamp(st.last_changed)) | round(0) }}{% else %}{{ none }}{% endif %}
      presence_sensors: >
        {{ [presence_fp2, presence_fp300] | select('string') | reject('eq', '') | list }}
      missing_sensors: >
        {% set ns = namespace(m=[]) %}
        {% for s in presence_sensors %}{% if states[s] is none %}{% set ns.m = ns.m + [s] %}{% endif %}{% endfor %}
        {{ ns.m }}
      in_dog_window: >
        {% set t = now().strftime('%H:%M:%S') %}
        {% if dog_start < dog_end %}
          {{ dog_start <= t and t < dog_end }}
        {% elif dog_start > dog_end %}
          {{ dog_start <= t or t < dog_end }}
        {% else %}{{ false }}{% endif %}
      window_age: >
        {% if in_dog_window %}
          {% set start = today_at(dog_start) %}
          {% if start > now() %}{% set start = start - timedelta(days=1) %}{% endif %}
          {{ as_timestamp(now()) - as_timestamp(start) }}
        {% else %}{{ 0 }}{% endif %}
      # Inside the night window the FP300 does not count (D9).
      is_presence_on: >
        {% set ns = namespace(v=false) %}
        {% for s in presence_sensors %}
          {% if is_state(s, 'on') and not (in_dog_window and s == presence_fp300) %}{% set ns.v = true %}{% endif %}
        {% endfor %}
        {{ ns.v }}
      late_night_minutes: "{{ [1, [60, late_night_timeout | int(1)] | min] | max }}"
      in_late_window: >
        {% set t = now().strftime('%H:%M:%S') %}
        {% if late_night_start < late_night_end %}
          {{ late_night_start <= t and t < late_night_end }}
        {% elif late_night_start > late_night_end %}
          {{ late_night_start <= t or t < late_night_end }}
        {% else %}{{ false }}{% endif %}
      off_minutes: "{{ late_night_minutes if (in_late_window or in_dog_window) else presence_timeout | float(5) }}"
      # Seconds every counted sensor has been clear. A missing sensor is skipped; a present one
      # with no last_changed counts as just changed. In the night window the FP300 counts as clear
      # since the window start at the latest, whatever it does inside the window.
      empty_age: >
        {% set ns = namespace(a=1000000000) %}
        {% for s in presence_sensors %}
          {% set st = states[s] %}
          {% if st is not none %}
            {% set lc = st.last_changed if st.last_changed is defined else none %}
            {% set clear = st.state in ['off', 'unavailable', 'unknown'] %}
            {% set own = as_timestamp(now()) - as_timestamp(lc) if clear and lc is not none else 0 %}
            {# In the window FP300 changes do not count: never younger than the window itself. #}
            {% set age = [own, window_age] | max if in_dog_window and s == presence_fp300 else own %}
            {% set ns.a = [ns.a, age] | min %}
          {% endif %}
        {% endfor %}
        {{ ns.a }}
      room_empty: "{{ empty_age >= (off_minutes + (1 if in_dog_window else 0)) * 60 }}"
      dim_due: "{{ in_dog_window and not room_empty and empty_age >= off_minutes * 60 }}"
      # A presence_on only switches lights on when the room had been empty for the timeout
      # before it; a sensor blinking while someone sits there does not undo a manual off (D12).
      was_empty: >
        {% set tid = trigger.id | default('') %}
        {% if tid not in ['presence_on_fp2', 'presence_on_fp300'] %}{{ false }}
        {% else %}
          {% set me = trigger.entity_id | default('') %}
          {% set fs = trigger.from_state | default(none) %}
          {% set ns = namespace(a=1000000000) %}
          {% for s in presence_sensors %}
            {% if s == me %}
              {% if fs is not none and fs.state in ['off', 'unavailable', 'unknown']
                    and fs.last_changed is defined and fs.last_changed is not none %}
                {% set age = as_timestamp(now()) - as_timestamp(fs.last_changed) %}
              {% else %}{% set age = 0 %}{% endif %}
            {% elif in_dog_window and s == presence_fp300 %}{% set age = 1000000000 %}
            {% else %}
              {% set st = states[s] %}
              {% if st is none %}{% set age = 1000000000 %}
              {% else %}
                {% set lc = st.last_changed if st.last_changed is defined else none %}
                {% if st.state in ['off', 'unavailable', 'unknown'] and lc is not none %}
                  {% set age = as_timestamp(now()) - as_timestamp(lc) %}
                {% else %}{% set age = 0 %}{% endif %}
              {% endif %}
            {% endif %}
            {% set ns.a = [ns.a, age] | min %}
          {% endfor %}
          {{ ns.a >= (off_minutes + (1 if in_dog_window else 0)) * 60 }}
        {% endif %}
      lights_on: >
        {% set ns = namespace(v=false) %}
        {% for l in all_target_lights %}{% if is_state(l, 'on') %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ ns.v }}
      # HA does not keep numeric_state `for:` timers across a restart or reload, and a trigger
      # attached while already past its threshold stays unarmed; start and reload therefore
      # act on the current reading at once (Codex J2 P1).
      bright: >
        {{ current_lux is number and current_lux > threshold_off | float(0)
           and (trigger.id | default('') in ['lux_high', 'ha_start', 'reload']
                or (lux_age is number and lux_age >= off_duration | float(0) * 60)) }}
      decision: >
        {% set tid = trigger.id | default('') %}
        {% set dark = current_lux is not number or current_lux < threshold_on | float(0) %}
        {% if lights_on and room_empty %}off
        {% elif lights_on and dim_due %}dim
        {% elif lights_on and bright %}off
        {% elif not lights_on and is_presence_on and dark
              and (tid in ['lux_low', 'override_resume', 'ha_start', 'reload']
                   or (tid in ['presence_on_fp2', 'presence_on_fp300'] and was_empty)) %}on
        {% elif lights_on and is_presence_on and tid in ['presence_on_fp2', 'presence_on_fp300', 'override_resume'] %}update
        {% elif lights_on and (tid in ['update_loop', 'ha_start', 'reload'] or tid.startswith('profile_')) %}update
        {% else %}none{% endif %}
      notify_list: "{{ (notify_targets if (notify_targets is iterable and notify_targets is not string) else ([notify_targets] if notify_targets else [])) | select('match', '^notify[.][a-z0-9_]+$') | list }}"

      # Determine Current Mode based on Time
      mode: >
        {% set t_now = now().strftime('%H:%M:%S') %}
        {% if t_now >= t_night %} night
        {% elif t_now >= t_evening %} evening
        {% elif t_now >= t_toddler %} toddler
        {% elif t_now >= t_dinner %} dinner
        {% elif t_now >= '06:00:00' %} day
        {% else %} night {% endif %}

      # Target Kelvin (Base)
      target_kelvin: >
        {% if mode == 'dinner' %} {{ k_dinner }}
        {% elif mode == 'toddler' %} {{ k_toddler }}
        {% elif mode == 'evening' %} {{ k_evening }}
        {% elif mode == 'night' %} {{ k_night }}
        {% else %}
          {# Day Mode: Use Sun Elevation #}
          {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set pct = (elev + 6) / 51 %}
          {% set k = (val_max_k - val_min_k) * pct + val_min_k %}
          {{ [val_min_k, [val_max_k, k] | min] | max | int }}
        {% endif %}

      target_brightness: >
        {% if mode == 'dinner' %} {{ b_dinner }}
        {% elif mode == 'toddler' %} {{ b_toddler }}
        {% elif mode == 'evening' %} {{ b_evening }}
        {% elif mode == 'night' %} {{ b_night }}
        {% else %} 100 {% endif %}

      ceiling_bri: "{{ (target_brightness | float * c_scale | float) | round(0) | int }}"
      dim_pct: "{{ [1, (target_brightness | float * 0.3) | round(0) | int] | max }}"
      target_effect: >
        {% if mode == 'evening' %} {{ e_evening }}
        {% elif mode == 'night' %} {{ e_night }}
        {% else %} none {% endif %}
      # Lit lights the update may touch. A light more than 5 % or 150 K away from the target (and
      # not at our own dim level), or in a colour mode, was changed by hand: skip it until the
      # next profile start (D6, D20).
      force_update: "{{ (trigger.id | default('')).startswith('profile_') }}"
      update_bulbs: >
        {% set ns = namespace(l=[]) %}
        {% for l in hue_list_bulbs %}
          {% set st = states[l] %}
          {% if st is not none and st.state == 'on' %}
            {% set a = st.attributes %}
            {% set pct = (a.get('brightness') | float(0)) / 2.55 %}
            {% set k = a.get('color_temp_kelvin') %}
            {% set bri_ok = (pct - target_brightness | float(0)) | abs <= 5 or (pct - dim_pct | float(0)) | abs <= 5 %}
            {% set k_ok = k is none or (k | float(0) - target_kelvin | float(0)) | abs <= 150 %}
            {% set mode_ok = a.get('color_mode') in [none, 'color_temp', 'brightness', 'onoff'] %}
            {% if force_update or (bri_ok and k_ok and mode_ok) %}{% set ns.l = ns.l + [l] %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}
      update_ceiling: >
        {% set ns = namespace(l=[]) %}
        {% for l in hue_list_ceiling %}
          {% set st = states[l] %}
          {% if st is not none and st.state == 'on' %}
            {% set a = st.attributes %}
            {% set pct = (a.get('brightness') | float(0)) / 2.55 %}
            {% set k = a.get('color_temp_kelvin') %}
            {% set bri_ok = (pct - ceiling_bri | float(0)) | abs <= 5 or (pct - [1, (dim_pct * c_scale | float) | round(0) | int] | max) | abs <= 5 %}
            {% set k_ok = k is none or (k | float(0) - target_kelvin | float(0)) | abs <= 150 %}
            {% set mode_ok = target_effect != 'none' or a.get('color_mode') in [none, 'color_temp', 'brightness', 'onoff'] %}
            {% if force_update or (bri_ok and k_ok and mode_ok) %}{% set ns.l = ns.l + [l] %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.l }}


  # 3. Apply the decision.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ decision == 'off' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ all_target_lights != [] }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: "{{ all_target_lights }}"
                data:
                  transition: 5

      - conditions:
          - condition: template
            value_template: "{{ decision == 'on' }}"
        sequence:
          # Turn on Bulbs (Native transition)
          - if:
              - condition: template
                value_template: "{{ hue_list_bulbs != [] }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ hue_list_bulbs }}"
                data:
                  color_temp_kelvin: "{{ target_kelvin }}"
                  brightness_pct: "{{ target_brightness }}"
                  transition: 2
          # Turn on Ceiling Lights (Scaled and/or Effect)
          - if:
              - condition: template
                value_template: "{{ hue_list_ceiling != [] }}"
            then:
              - choose:
                  # Apply with Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect != 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ hue_list_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 2
                          effect: "{{ target_effect }}"
                  # Apply without Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect == 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ hue_list_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 2

      - conditions:
          - condition: template
            value_template: "{{ decision == 'update' }}"
        sequence:
          # Update Active Bulbs (Native 30s)
          - if:
              - condition: template
                value_template: "{{ update_bulbs | count > 0 }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ update_bulbs }}"
                data:
                  color_temp_kelvin: "{{ target_kelvin }}"
                  brightness_pct: "{{ target_brightness }}"
                  transition: 30
          # Update Active Ceiling Lights (Native 30s)
          - if:
              - condition: template
                value_template: "{{ update_ceiling | count > 0 }}"
            then:
              - choose:
                  # Update with Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect != 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ update_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 30
                          effect: "{{ target_effect }}"
                  # Update without Effect
                  - conditions:
                      - condition: template
                        value_template: "{{ target_effect == 'none' }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ update_ceiling }}"
                        data:
                          color_temp_kelvin: "{{ target_kelvin }}"
                          brightness_pct: "{{ ceiling_bri }}"
                          transition: 30

      - conditions:
          - condition: template
            value_template: "{{ decision == 'dim' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ expand(hue_list_bulbs) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: >
                    {{ expand(hue_list_bulbs) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
                data:
                  brightness_pct: "{{ dim_pct }}"
                  transition: 2
          - if:
              - condition: template
                value_template: "{{ expand(hue_list_ceiling) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: >
                    {{ expand(hue_list_ceiling) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
                data:
                  brightness_pct: "{{ [1, (dim_pct * c_scale | float) | round(0) | int] | max }}"
                  transition: 2

  # 4. Offline notices, after the light calls. mode: restart can interrupt a push.
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id | default('') in ['fp2_unavailable_30m', 'fp2_unknown_30m', 'fp300_unavailable_30m', 'fp300_unknown_30m']
                 or (trigger.id | default('') == 'update_loop' and now().minute == 0 and missing_sensors | count > 0) }}
        sequence:
          - repeat:
              for_each: "{{ notify_list }}"
              sequence:
                - service: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    title: "Living Room Lights - presence sensor offline"
                    message: >-
                      {% set tid = trigger.id | default('') %}
                      {% if tid.startswith('fp2_') or tid.startswith('fp300_') %}
                      {% set sensor = presence_fp2 if tid.startswith('fp2_') else presence_fp300 %}
                      {% set other = presence_fp300 if tid.startswith('fp2_') else presence_fp2 %}
                      {{ sensor }} has been {{ 'unavailable' if 'unavailable' in tid else 'unknown' }} for 30 min.
                      The lights follow {{ other }} alone until it returns.
                      {% else %}
                      {{ missing_sensors | join(', ') }} missing in Home Assistant (renamed or removed?).
                      The lights ignore it until the automation instance is updated.
                      {% endif %}
