blueprint:
  name: "Circadian Living Room Lights v1.3.3"
  description: >
    **Version: 1.3.3**
    
    A comprehensive lighting automation for the Living Room that adapts to human presence, 
    circadian rhythms, and specific family routines.
    
    **Features:**
    - **Fully Configurable Profiles:** Customize Time, Kelvin, and Brightness for Dinner, Toddler, Evening, and Night.
    - **Manual Override:** Pause automation via a Switch or Input Boolean (e.g., for Movie Night).
    - **Daylight Harvesting:** Auto-Off if naturally bright (>400 lux).
    - **Flicker Protection:** Hybrid Lux logic prevents rapid toggling.
    - **Presence Timeout:** Configurable delay before turning off lights.
    
  domain: automation
  input:
    hue_lights:
      name: Philips Hue Lights
      description: Select your Philips Hue bulbs/groups here.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    govee_lights:
      name: Govee Lights
      description: Select your Govee Ceiling Light(s) here.
      default: []
      selector:
        entity:
          domain: light
          multiple: true
    govee_brightness_scale:
      name: Govee Brightness Scale
      description: "Scale Govee brightness to match Hue (e.g., 0.4 = 40% of Hue brightness). Only applies in Kelvin mode."
      default: 0.4
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.05
    presence_entity:
      name: Presence Sensor
      selector:
        entity:
          domain: binary_sensor
          device_class: occupancy
    presence_timeout:
      name: Presence Timeout
      description: "Wait this long after motion clears before turning off lights (Default: 5 min)."
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: min
    illuminance_entity:
      name: Illuminance (Lux) Sensor
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    override_entity:
      name: Manual Override Switch
      description: "If ON, automation pauses. Use a Helper (Input Boolean) toggled by your Remote."
      default: []
      selector:
        entity:
          domain: 
            - input_boolean
            - switch
    
    # --- Thresholds ---
    lux_on_threshold:
      name: Turn On Threshold
      description: "Lights turn ON if Lux drops below this (Default: 150)."
      default: 150
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    lux_off_threshold:
      name: Turn Off Threshold (Daylight Harvesting)
      description: "Lights turn OFF if Lux stays above this (Default: 400)."
      default: 400
      selector:
        number:
          min: 100
          max: 2000
          unit_of_measurement: lx
    lux_off_duration:
      name: Turn Off Duration
      description: "How long Lux must be high before turning off (Anti-Flicker)."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

    # --- DINNER PROFILE ---
    time_dinner:
      name: Dinner Start Time
      default: "18:00:00"
      selector:
        time:
    dinner_kelvin:
      name: Dinner Color (K)
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    dinner_bri:
      name: Dinner Brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- TODDLER PROFILE ---
    time_toddler:
      name: Toddler Prep Start Time
      default: "19:00:00"
      selector:
        time:
    toddler_kelvin:
      name: Toddler Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    toddler_bri:
      name: Toddler Brightness (%)
      default: 60
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- EVENING PROFILE ---
    time_evening:
      name: Evening Start Time
      default: "20:00:00"
      selector:
        time:
    evening_kelvin:
      name: Evening Color (K)
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    evening_bri:
      name: Evening Brightness (%)
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- NIGHT PROFILE ---
    time_night:
      name: Night Start Time
      default: "22:00:00"
      selector:
        time:
    night_kelvin:
      name: Night Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    night_bri:
      name: Night Brightness (%)
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- General Light Settings ---
    max_kelvin:
      name: Max Kelvin (Daylight)
      description: Used for Day Mode calculation.
      default: 4500
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    min_kelvin:
      name: Min Kelvin (Warm)
      description: Used for Day Mode calculation.
      default: 2200
      selector:
        number:
          min: 2000
          max: 4000
          step: 100
          unit_of_measurement: K

mode: restart
max_exceeded: silent

trigger:
  # 1. Presence Detected
  - platform: state
    entity_id: !input presence_entity
    to: "on"
    id: "presence_on"
  
  # 2. Presence Cleared (With Timeout)
  - platform: state
    entity_id: !input presence_entity
    to: "off"
    for: 
      minutes: !input presence_timeout
    id: "presence_off"
  
  # 3. Periodic Update (Circadian Shift)
  - platform: time_pattern
    minutes: "/5"
    id: "update_loop"

  # 4. Daylight Harvesting (Auto-OFF)
  - platform: numeric_state
    entity_id: !input illuminance_entity
    above: !input lux_off_threshold
    for: 
      minutes: !input lux_off_duration
    id: "lux_high"

  # 5. Daylight Fading (Auto-ON)
  - platform: numeric_state
    entity_id: !input illuminance_entity
    below: !input lux_on_threshold
    id: "lux_low"

  # 6. Override Turned OFF (Resume)
  - platform: state
    entity_id: !input override_entity
    to: "off"
    id: "override_resume"

variables:
  # Inputs
  hue_list: !input hue_lights
  govee_list: !input govee_lights
  # Combine for presence checks (turn-on logic)
  all_target_lights: "{{ hue_list + govee_list }}"
  
  sensor_lux: !input illuminance_entity
  sensor_presence: !input presence_entity
  entity_override: !input override_entity
  threshold_on: !input lux_on_threshold
  val_max_k: !input max_kelvin
  val_min_k: !input min_kelvin
  
  # Scaling
  g_scale: !input govee_brightness_scale
  
  # Time Slots
  t_dinner: !input time_dinner
  t_toddler: !input time_toddler
  t_evening: !input time_evening
  t_night: !input time_night
  
  # Profile Settings
  k_dinner: !input dinner_kelvin
  b_dinner: !input dinner_bri
  k_toddler: !input toddler_kelvin
  b_toddler: !input toddler_bri
  k_evening: !input evening_kelvin
  b_evening: !input evening_bri
  k_night: !input night_kelvin
  b_night: !input night_bri

action:
  # 1. Check Override First
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ entity_override != [] and is_state(entity_override, 'on') }}"
        sequence:
          - stop: "Manual Override is ON. Automation halted."

  # 2. Calculate Common Logic Variables
  - variables:
      current_lux: "{{ states(sensor_lux) | float(0) }}"
      is_presence_on: "{{ is_state(sensor_presence, 'on') }}"
      
      # Determine Current Mode based on Time
      mode: >
        {% set t_now = now().strftime('%H:%M:%S') %}
        {% if t_now >= t_night %} night
        {% elif t_now >= t_evening %} evening
        {% elif t_now >= t_toddler %} toddler
        {% elif t_now >= t_dinner %} dinner
        {% elif t_now >= '06:00:00' %} day
        {% else %} night {% endif %}
      
      # Target Kelvin (Base)
      target_kelvin: >
        {% if mode == 'dinner' %} {{ k_dinner }}
        {% elif mode == 'toddler' %} {{ k_toddler }}
        {% elif mode == 'evening' %} {{ k_evening }}
        {% elif mode == 'night' %} {{ k_night }}
        {% else %}
          {# Day Mode: Use Sun Elevation #}
          {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set pct = (elev + 6) / 51 %}
          {% set k = (val_max_k - val_min_k) * pct + val_min_k %}
          {{ [val_min_k, [val_max_k, k] | min] | max | int }}
        {% endif %}
        
      target_brightness: >
        {% if mode == 'dinner' %} {{ b_dinner }}
        {% elif mode == 'toddler' %} {{ b_toddler }}
        {% elif mode == 'evening' %} {{ b_evening }}
        {% elif mode == 'night' %} {{ b_night }}
        {% else %} 100 {% endif %}

      # --- Govee Specific Logic ---
      # For Kelvin < 2700, use RGB interpolation.
      # For Kelvin >= 2700, use Kelvin + Scaled Brightness.
      g_is_rgb: "{{ target_kelvin | int < 2700 }}"
      
      govee_rgb: >
        {% if g_is_rgb %}
          {% set k = target_kelvin | int %}
          {# Interpolate between 2000K [255, 85, 0] and 2700K [255, 166, 87] #}
          {% set k_adj = [2000, [2700, k]|min]|max %}
          {% set factor = (k_adj - 2000) / 700 %}
          {% set r = 255 %}
          {% set g = (85 + (166 - 85) * factor) | round(0) | int %}
          {% set b = (0 + (87 - 0) * factor) | round(0) | int %}
          {{ [r, g, b] }}
        {% else %} [] {% endif %}

      govee_bri: >
        {# If in RGB mode, don't scale. If in Kelvin mode, scale. #}
        {% if g_is_rgb %} {{ target_brightness }}
        {% else %} {{ (target_brightness | float * g_scale | float) | round(0) | int }} {% endif %}

  - choose:
      # SCENARIO 1: TURN OFF
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "presence_off"
              - condition: trigger
                id: "lux_high"
        sequence:
          - if:
              - condition: template
                value_template: "{{ all_target_lights != [] }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: "{{ all_target_lights }}"
                data:
                  transition: 5

      # SCENARIO 2: TURN ON
      - conditions:
          - condition: template
            value_template: "{{ is_presence_on }}"
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: "presence_on"
                  - condition: template
                    value_template: "{{ current_lux < threshold_on }}"
              - condition: trigger
                id: "lux_low"
              - condition: trigger
                id: "override_resume"
        sequence:
          # Turn on Hue Lights
          - if:
              - condition: template
                value_template: "{{ hue_list != [] }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ hue_list }}"
                data:
                  kelvin: "{{ target_kelvin }}"
                  brightness_pct: "{{ target_brightness }}"
                  transition: 2
          # Turn on Govee Lights
          - if:
              - condition: template
                value_template: "{{ govee_list != [] }}"
            then:
              - choose:
                  # RGB Mode
                  - conditions:
                      - condition: template
                        value_template: "{{ g_is_rgb }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ govee_list }}"
                        data:
                          brightness_pct: "{{ govee_bri }}"
                          rgb_color: "{{ govee_rgb }}"
                          transition: 2
                  # Kelvin Mode
                  - conditions:
                      - condition: template
                        value_template: "{{ not g_is_rgb }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ govee_list }}"
                        data:
                          brightness_pct: "{{ govee_bri }}"
                          kelvin: "{{ target_kelvin }}"
                          transition: 2

      # SCENARIO 3: UPDATE LOOP
      - conditions:
          - condition: trigger
            id: "update_loop"
          - condition: template
            value_template: >
              {{ expand(all_target_lights) | selectattr('state', 'eq', 'on') | list | count > 0 }}
          - condition: template
            value_template: "{{ current_lux < (threshold_on + 300) }}" 
        sequence:
          # Update Hue
          - if:
              - condition: template
                value_template: "{{ expand(hue_list) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: >
                    {{ expand(hue_list) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
                data:
                  kelvin: "{{ target_kelvin }}"
                  brightness_pct: "{{ target_brightness }}"
                  transition: 30
          # Update Govee
          - if:
              - condition: template
                value_template: "{{ expand(govee_list) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
            then:
              - variables:
                  on_govee: >
                    {{ expand(govee_list) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
              - choose:
                  # RGB Mode
                  - conditions:
                      - condition: template
                        value_template: "{{ g_is_rgb }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ on_govee }}"
                        data:
                          brightness_pct: "{{ govee_bri }}"
                          rgb_color: "{{ govee_rgb }}"
                          transition: 30
                  # Kelvin Mode
                  - conditions:
                      - condition: template
                        value_template: "{{ not g_is_rgb }}"
                    sequence:
                      - service: light.turn_on
                        target:
                          entity_id: "{{ on_govee }}"
                        data:
                          brightness_pct: "{{ govee_bri }}"
                          kelvin: "{{ target_kelvin }}"
                          transition: 30
