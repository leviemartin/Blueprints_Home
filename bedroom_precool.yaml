blueprint:
  name: "Bedroom Sleep Pre-Cool v1.2.0"
  description: >
    **Version: 1.2.0** — ceiling-fan coordination: night_mode fan_only (park,
    off at the lock unless already over the band, a two-beep night guard
    (turn_on + unconditional set_hvac_mode, so the unit always restarts in
    cooling mode) with the running unit as latch and a 15-minute settle
    check), pre-chill offset
    that the lead prediction and the learner aim at, bedroom fan list written
    under one edge-triggered rule (last_updated touch detection, interlock
    sensors with a clear hold, live re-check before every call), day-parity
    switches for the fan-assist / night-fan experiments; the night guard and
    settle both honour v1.1.0's manual override. Manual override: a setpoint
    changed on the unit during the pre-cool is respected until the bedtime
    lock, and a unit switched off inside the pre-cool window stays off; a real
    daily forecast backs the prediction between hourly fetches; the auto-learn
    write is clamped to the helper's own range, with a notice while that range
    is narrower than −60…120. History: v1.1.0 manual override, helper-range
    clamp, daily-forecast backstop · v1.0.3 `night_fan` input (default low):
    the fan mode locked in at bedtime, matched case-insensitively against the
    unit's modes, with a notice when the unit lacks it. v1.0.2 wake-time
    turn-off works again (running-unit latch bounded to bedtime − lead cap; a
    manual daytime turn-on ends within a minute) · v1.0.1 instants carried as
    timestamps across the variables boundary · v1.0.0 initial.

    Predictive pre-cooling of bedrooms via a single hall LG air conditioner.
    Reaches an ideal sleep temperature by a fixed bedtime, then holds the room
    quietly overnight within a strict beep budget, with a self-learning
    lead-time prediction.

    LG ACs beep on every command sent over ThinQ — a firmware tone that cannot
    be silenced in software. This blueprint therefore treats AC commands as a
    scarce resource after bedtime: it adjusts freely *before* bedtime, locks a
    maintaining setpoint and the night fan *at* bedtime, permits at most one corrective command at
    a deep-night checkpoint, and turns the AC off at wake.

    The AC is in the hall, not the bedrooms — cold air migrates through open
    doors. Cooling is therefore indirect and laggy, so the turn-on time is
    *predicted* from indoor gap, hourly weather forecast, and solar gain, with a
    self-learning bias that auto-corrects from each night's observed outcome.

    **Features:**
    - 6-phase stateless daily state machine (DAY-OFF, PRECOOL, BEDTIME-LOCK,
      NIGHT-HOLD, DEEP-NIGHT-CHECK, DEEP-HOLD)
    - Predictive turn-on: transparent linear lead-time formula
      (indoor gap + forecast outdoor + solar) recomputed every minute
    - Self-learning lead-time bias persisted in an input_number helper
    - Closed-loop pre-cool on the warmest bedroom (DRIVE / HOLD sub-states)
    - Strict beep budget after bedtime: the lock issues at most 3 commands
      (mode, setpoint, night fan — typically 1-2), the deep-night check at most 1
    - Night fan input (default low): the fan mode locked in at bedtime, matched
      by exact name (case-insensitive) to the unit's modes, with a notice if the
      unit lacks it
    - Manual override (v1.1.0): a setpoint changed on the unit during the
      pre-cool is left alone until the bedtime lock; a unit switched off inside
      the pre-cool window stays off for the night; one notice per override
    - Daily forecast backstop (v1.1.0): between hourly fetches the prediction
      uses the day's forecast high, not the live outdoor reading alone
    - Opt-in humidity-aware dry mode (default off — cool is the proven path)
    - Idempotent service calls — a stray command is a stray beep
    - Vacation toggle, manual-run debug notification
    - Night Mode: AC-hold (v1.0.x, unit runs all night) or fan-only, which
      parks the unit at the lock, switches it off, and hands the night to the
      Bedroom Fans unless the warmest room is already over the guard band
    - Bedroom Fans, written under one edge-triggered rule (configured,
      available, not already at target, interlock clear including its clear
      hold, untouched since the reference), with day-parity fan-assist /
      night-fan experiments and a live re-check before every command
    - Night Guard: turn_on + an unconditional set_hvac_mode restore the
      parked AC state in cooling mode if a fan-only bedroom drifts over
      ideal + tolerance, with a 15-minute settle check that corrects
      setpoint or fan (mode only after a manual night start) from live reads

    **Requirements:**
    - Home Assistant Core 2025.7+ (LG ThinQ set_temperature fix, PR #147008)
    - One LG AC connected via the LG ThinQ integration (a `climate` entity)
    - Bedroom temperature sensors (e.g., Aqara) — the control target
    - An outdoor temperature sensor
    - A weather entity that provides an HOURLY forecast — Met.no or Open-Meteo
      (Buienradar has no hourly forecast and will not work)
    - An input_number helper to persist the self-learned lead-time bias
      (min −60 or lower, max 120 or higher, step 1 — the write is clamped to
      the helper's range and a notice is raised while it is narrower)

  domain: automation
  input:
    # =======================================================
    # GROUP 1 — DEVICES & SENSORS
    # =======================================================
    ac_climate:
      name: LG AC Climate Entity
      description: The climate entity for the hall LG air conditioner (LG ThinQ integration).
      selector:
        entity:
          domain: climate
    bedroom_temp_sensors:
      name: Bedroom Temperature Sensors
      description: >
        One or more in-room temperature sensors (e.g., Aqara). These are the
        control target — the blueprint cools until the warmest bedroom reaches
        the ideal temperature.
      selector:
        entity:
          domain: sensor
          device_class: temperature
          multiple: true
    bedroom_humidity_sensors:
      name: Bedroom Humidity Sensors (Optional)
      description: >
        In-room humidity sensors. Only used when Enable Dry Mode is on; drives
        the cool-vs-dry choice. Leave empty if not using dry mode.
      default: []
      selector:
        entity:
          domain: sensor
          device_class: humidity
          multiple: true
    outdoor_temp_sensor:
      name: Outdoor Temperature Sensor
      description: An outdoor temperature sensor entity — heat-load term and forecast fallback.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    weather_entity:
      name: Weather Entity (hourly forecast)
      description: >
        A weather entity that supports an HOURLY forecast — Met.no (HA default,
        keyless) or Open-Meteo. Buienradar provides only a daily forecast and
        must NOT be used here. The forecast anticipates the evening heat load.
      selector:
        entity:
          domain: weather
    sun_entity:
      name: Sun Entity
      description: The built-in sun entity — provides the solar-gain term. Leave as the default.
      default: sun.sun
      selector:
        entity:
          domain: sun
    lead_bias_helper:
      name: Lead-Time Bias Helper (input_number)
      description: >
        An input_number helper the blueprint uses to persist its self-learned
        lead-time correction (minutes) across restarts. Create one via
        Settings -> Devices & Services -> Helpers -> Number with min -60 (or
        lower), max 120 (or higher), step 1. The blueprint clamps its write
        to the helper's range and warns while the range is narrower.
        Required when Enable Auto-Learn is on.
      default: []
      selector:
        entity:
          domain: input_number
          multiple: true
    ac_sound_switch:
      name: AC Sound Switch (Optional)
      description: >
        The switch entity for the LG AC beep sound, if exposed. The blueprint
        keeps it muted. Leave empty if not available.
      default: []
      selector:
        entity:
          domain: switch
          multiple: true

    # =======================================================
    # GROUP 2 — TARGET TEMPERATURES
    # =======================================================
    ideal_temp:
      name: Ideal Sleep Temperature (°C)
      description: >
        The target temperature for the warmest bedroom by bedtime. 19 °C is
        within the recommended child sleep range (16-20 °C, The Lullaby Trust).
        The minimum is a 16 °C child-safety floor.
      default: 19.0
      selector:
        number:
          min: 16.0
          max: 25.0
          step: 0.5
          unit_of_measurement: "°C"
    hall_offset:
      name: Hall Cooling Offset (°C)
      description: >
        How much colder the hall AC must hold than the bedroom ideal, to push
        cold air through the doorway. Indirect room-to-room cooling is
        thermally weak, so this is typically 3-6 °C. Tune it using the overnight
        drift reported in the debug notification.
      default: 3.0
      selector:
        number:
          min: 0.0
          max: 10.0
          step: 0.5
          unit_of_measurement: "°C"
    drive_setpoint:
      name: Drive Setpoint (°C)
      description: >
        The aggressive hall setpoint used while actively driving the bedrooms
        down (DRIVE sub-state). Set this to the AC's minimum for the fastest
        pre-cool — it is clamped to the AC's real min_temp at runtime.
      default: 16.0
      selector:
        number:
          min: 14.0
          max: 22.0
          step: 0.5
          unit_of_measurement: "°C"
    tolerance:
      name: Drift Tolerance (°C)
      description: >
        The dead band around the ideal temperature for the deep-night check
        and the cool-vs-dry decision. A drift larger than this triggers the
        single deep-night correction.
      default: 1.5
      selector:
        number:
          min: 0.5
          max: 4.0
          step: 0.5
          unit_of_measurement: "°C"
    correction_step:
      name: Deep-Night Correction Step (°C)
      description: How far to nudge the hall setpoint at the single deep-night corrective command.
      default: 1.5
      selector:
        number:
          min: 0.5
          max: 4.0
          step: 0.5
          unit_of_measurement: "°C"
    skip_threshold:
      name: Cool-Day Skip Threshold (°C)
      description: >
        If the forecast peak stays below this and the bedrooms are already at
        or below ideal, the AC never starts — the mild-day skip.
      default: 22.0
      selector:
        number:
          min: 16.0
          max: 28.0
          step: 0.5
          unit_of_measurement: "°C"
    humidity_threshold:
      name: Humidity Threshold (%)
      description: >
        Above this room humidity, dry mode is preferred over cool — only when
        Enable Dry Mode is on and the temperature gap is small.
      default: 65
      selector:
        number:
          min: 40
          max: 80
          step: 1
          unit_of_measurement: "%"

    # =======================================================
    # GROUP 3 — SCHEDULE
    # =======================================================
    bedtime:
      name: Bedtime
      description: The time the warmest bedroom should be at the ideal temperature.
      default: "19:30:00"
      selector:
        time: {}
    wake_time:
      name: Wake Time
      description: The time the AC is turned off in the morning.
      default: "07:15:00"
      selector:
        time: {}
    deep_night_check:
      name: Deep-Night Check Time
      description: >
        The single overnight checkpoint (e.g., 01:00). If the warmest bedroom
        has drifted outside ideal +/- tolerance, one corrective command fires
        within a fixed 10-minute window after this time.
      default: "01:00:00"
      selector:
        time: {}

    # =======================================================
    # GROUP 4 — PREDICTION TUNING
    # =======================================================
    base_minutes:
      name: Base Lead Minutes
      description: The fixed baseline lead time before any temperature or solar terms are added.
      default: 20
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: "min"
    k_indoor:
      name: Indoor Coefficient (min per °C)
      description: >
        Lead minutes added per °C the warmest bedroom is above ideal. This is
        the dominant term — the indoor gap is what the AC must actually close.
      default: 15
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: "min/°C"
    k_outdoor:
      name: Outdoor Coefficient (min per °C)
      description: >
        Lead minutes added per °C the outdoor peak is above ideal. Deliberately
        small — outdoor heat is a secondary leak correction, not a co-equal term.
      default: 1.0
      selector:
        number:
          min: 0
          max: 15
          step: 0.5
          unit_of_measurement: "min/°C"
    solar_max_minutes:
      name: Solar Maximum Minutes
      description: The maximum lead contribution from solar gain, at peak radiant load.
      default: 45
      selector:
        number:
          min: 0
          max: 120
          step: 1
          unit_of_measurement: "min"
    safety_margin_minutes:
      name: Safety Margin Minutes
      description: >
        A fixed early bias. Starting early is cheap; missing bedtime is not —
        so the estimate is biased early.
      default: 25
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: "min"
    lead_cap_minutes:
      name: Lead Cap Minutes
      description: The hard upper bound on total lead time — the earliest the AC can ever start before bedtime.
      default: 240
      selector:
        number:
          min: 60
          max: 360
          step: 10
          unit_of_measurement: "min"
    solar_afternoon_only:
      name: Solar — Afternoon Azimuths Only
      description: >
        When on, solar gain only contributes for post-solar-noon sun positions
        (azimuth roughly 180-300°), capturing the low evening sun on west-facing
        bedrooms while ignoring the morning sun.
      default: true
      selector:
        boolean: {}
    learn_gain:
      name: Auto-Learn Gain
      description: >
        How aggressively the lead-time bias self-corrects each night. Higher
        converges faster but overshoots more. 0.4 converges over ~3-6 nights.
      default: 0.4
      selector:
        number:
          min: 0
          max: 1
          step: 0.05

    # =======================================================
    # GROUP 5 — BEHAVIOUR
    # =======================================================
    sensor_strategy:
      name: Bedroom Sensor Strategy
      description: >
        How to aggregate multiple bedroom sensors. 'max' (the warmest room)
        guarantees every room reaches ideal; 'average' is gentler but can leave
        the warmest room above ideal.
      default: "max"
      selector:
        select:
          options:
            - label: "Warmest room (max)"
              value: "max"
            - label: "Average of rooms"
              value: "average"
    enable_fan_control:
      name: Enable Fan Control
      description: >
        When on, the blueprint sets a high fan while driving, a normal fan
        while holding, and the Night Fan Mode at bedtime.
      default: true
      selector:
        boolean: {}
    night_fan:
      name: Night Fan Mode
      description: >
        The fan mode locked in at bedtime and left alone overnight. Only used
        when Enable Fan Control is on. Matched by exact name (case-insensitive)
        against the unit's fan modes — synonyms such as 'Mid' or 'Power' are not
        mapped; if the unit does not offer the name, the normal (hold) fan mode
        is used instead and a notification says so.
      default: "low"
      selector:
        select:
          options:
            - label: "Low"
              value: "low"
            - label: "Medium"
              value: "medium"
            - label: "High"
              value: "high"
            - label: "Auto"
              value: "auto"
    night_mode:
      name: Night Mode
      description: >
        What happens to the AC at bedtime. 'AC hold' (default) locks the maintaining
        setpoint and the Night Fan Mode and lets the unit run until Wake Time (the
        v1.0.x behaviour). 'Fan-only' parks the unit on that same state, switches it
        OFF at the bedtime lock and hands the night to the Bedroom Fans; if the warmest
        bedroom exceeds Ideal + Drift Tolerance after bedtime the unit is switched back
        on (one beep — it restores the parked state, which the blueprint re-checks for
        15 minutes) and stays on until Wake Time.
      default: "ac_hold"
      selector:
        select:
          options:
            - label: "AC hold — unit runs all night (v1.0.x)"
              value: "ac_hold"
            - label: "Fan-only — unit off at bedtime, back on only if too warm"
              value: "fan_only"
    prechill_offset:
      name: Pre-Chill Offset (°C)
      description: >
        Fan-only nights only: PRECOOL drives the warmest bedroom this far BELOW the
        Ideal Sleep Temperature before the lock (the lead-time prediction, the
        cool-day skip and the auto-learn all aim at that deeper target), so the rooms
        start the coast with a margin. 0 = drive to ideal exactly. Ignored in AC-hold
        mode.
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          unit_of_measurement: "°C"
    enable_dry_mode:
      name: Enable Dry Mode
      description: >
        When on, the blueprint may pick dry mode over cool when the room is
        humid and the temperature gap is small. Default OFF — LG dry-mode
        target-temperature behaviour is model-dependent; enable only after
        verifying on the actual unit.
      default: false
      selector:
        boolean: {}
    enable_auto_learn:
      name: Enable Auto-Learn
      description: >
        When on, the blueprint reads and updates the lead-time bias helper,
        self-correcting the prediction from each cooling night's outcome.
      default: true
      selector:
        boolean: {}

    # =======================================================
    # GROUP 6 — GLOBAL CONTROLS
    # =======================================================
    vacation_toggle:
      name: Vacation Toggle (Optional)
      description: "Optional input_boolean. When ON, the AC is forced off and the blueprint stands down."
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    enable_notifications:
      name: Enable Persistent Notifications
      description: When on, fault and status persistent notifications are created.
      default: true
      selector:
        boolean: {}

    # =======================================================
    # GROUP 7 — BEDROOM FANS (optional)
    # =======================================================
    bedroom_fans:
      name: Bedroom Fans (Optional)
      description: >
        Ceiling fans in the bedrooms, one per room. Leave empty to keep the v1.0.x
        behaviour (no fan is ever commanded). The blueprint writes a fan at most once
        per transition and only if nobody has touched it since — a fan a safety
        automation switched off, or one you changed by hand, is left alone.
      default: []
      selector:
        entity:
          domain: fan
          multiple: true
    interlocked_fans:
      name: Interlocked Fans (Optional)
      description: >
        The subset of Bedroom Fans that must never be commanded while a Fan Interlock
        sensor is on or has just cleared (e.g. a fan at head height with a
        height-gated presence sensor).
      default: []
      selector:
        entity:
          domain: fan
          multiple: true
    fan_interlocks:
      name: Fan Interlock Sensors (Optional)
      description: >
        Binary sensors that block commands to the Interlocked Fans while 'on'. An
        unavailable or missing sensor also blocks (fail-safe).
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true
    interlock_clear_minutes:
      name: Interlock Clear Hold (min)
      description: >
        An interlock sensor that changed state within the last N minutes still blocks.
        Set this LONGER than the safety automation's own resume hold on the same fan
        (kids-room cutoff: 3 min → 5 here), so this blueprint never writes the fan in
        the same minute the safety automation resumes it, and never inside its hold.
      default: 5
      selector:
        number:
          min: 0
          max: 15
          step: 1
          unit_of_measurement: "min"
    night_fans:
      name: Night Fans — Which Nights
      description: >
        On which nights the Bedroom Fans are set to the Night Fan Percentage at the
        bedtime lock (applied inside the Fan Settle Window to any fan nobody touched).
        Odd/even = day of the year of the night's START date (the date at wake time),
        for A/B comparisons.
      default: "all"
      selector:
        select:
          options:
            - label: "Every night"
              value: "all"
            - label: "Odd days of the year"
              value: "odd"
            - label: "Even days of the year"
              value: "even"
            - label: "Never"
              value: "off"
    night_fan_percentage:
      name: Night Fan Percentage
      description: The fan speed for the night (1 = the lowest step on a Tuya ceiling fan).
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    fan_assist:
      name: Pre-Cool Fan Assist — Which Days
      description: >
        On which days the Bedroom Fans run at the Pre-Cool Fan Percentage from the
        moment the AC starts (experiment: does a fan in the room speed the measured
        drop?). Default off. Odd/even as for Night Fans.
      default: "off"
      selector:
        select:
          options:
            - label: "Off"
              value: "off"
            - label: "Every day"
              value: "all"
            - label: "Odd days of the year"
              value: "odd"
            - label: "Even days of the year"
              value: "even"
    precool_fan_percentage:
      name: Pre-Cool Fan Percentage
      description: The fan speed during pre-cool fan assist (21 = step 2 on a Tuya ceiling fan).
      default: 21
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
    fan_settle_minutes:
      name: Fan Settle Window (min)
      description: >
        How long after the bedtime lock (and after the AC start) a pending fan setting
        may still be applied to a fan nobody has touched. Must end before midnight.
      default: 45
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: "min"
    fans_at_wake:
      name: Fans At Wake
      description: Leave the Bedroom Fans as they are at Wake Time (default) or switch them off.
      default: "leave"
      selector:
        select:
          options:
            - label: "Leave as they are"
              value: "leave"
            - label: "Switch off"
              value: "off"

mode: restart
max_exceeded: silent

# =============================================
# TOP-LEVEL VARIABLES — !input pass-through
# (matches bathroom_heating_rack / lg_ac_climate; guarantees every
#  !input resolves at automation-creation time and is available
#  everywhere below — including the action block)
# =============================================
variables:
  # --- Group 1: devices & sensors ---
  ac_climate: !input ac_climate
  bedroom_temp_sensors: !input bedroom_temp_sensors
  bedroom_humidity_sensors: !input bedroom_humidity_sensors
  outdoor_temp_sensor: !input outdoor_temp_sensor
  weather_entity: !input weather_entity
  sun_entity: !input sun_entity
  lead_bias_helper: !input lead_bias_helper
  ac_sound_switch: !input ac_sound_switch
  # --- Group 2: target temperatures ---
  ideal_temp: !input ideal_temp
  hall_offset: !input hall_offset
  drive_setpoint: !input drive_setpoint
  tolerance: !input tolerance
  correction_step: !input correction_step
  skip_threshold: !input skip_threshold
  humidity_threshold: !input humidity_threshold
  # --- Group 3: schedule ---
  bedtime: !input bedtime
  wake_time: !input wake_time
  deep_night_check: !input deep_night_check
  # --- Group 4: prediction tuning ---
  base_minutes: !input base_minutes
  k_indoor: !input k_indoor
  k_outdoor: !input k_outdoor
  solar_max_minutes: !input solar_max_minutes
  safety_margin_minutes: !input safety_margin_minutes
  lead_cap_minutes: !input lead_cap_minutes
  solar_afternoon_only: !input solar_afternoon_only
  learn_gain: !input learn_gain
  # --- Group 5: behaviour ---
  sensor_strategy: !input sensor_strategy
  enable_fan_control: !input enable_fan_control
  night_fan: !input night_fan
  night_mode: !input night_mode
  prechill_offset: !input prechill_offset
  enable_dry_mode: !input enable_dry_mode
  enable_auto_learn: !input enable_auto_learn
  # --- Group 6: global controls ---
  vacation_toggle: !input vacation_toggle
  enable_notifications: !input enable_notifications
  # --- Group 7: bedroom fans ---
  bedroom_fans: !input bedroom_fans
  interlocked_fans: !input interlocked_fans
  fan_interlocks: !input fan_interlocks
  interlock_clear_minutes: !input interlock_clear_minutes
  night_fans: !input night_fans
  night_fan_percentage: !input night_fan_percentage
  fan_assist: !input fan_assist
  precool_fan_percentage: !input precool_fan_percentage
  fan_settle_minutes: !input fan_settle_minutes
  fans_at_wake: !input fans_at_wake

trigger:
  # T1: Periodic 1-minute tick — phase derivation, prediction, transitions
  - platform: time_pattern
    minutes: "/1"
    id: periodic
  # T2: Vacation toggle state change — instant disable / re-enable
  - platform: state
    entity_id: !input vacation_toggle
    id: vacation_change
  # T3: HA restart — reconcile phase after a restart
  - platform: homeassistant
    event: start
    id: ha_start

action:
  # =============================================
  # STEP 1: MUTE SOUND SWITCH (standalone pre-step)
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ ac_sound_switch not in [[], none, ''] and
                 expand(ac_sound_switch) | selectattr('state', 'eq', 'on')
                 | list | count > 0 }}
        sequence:
          - service: switch.turn_off
            target:
              entity_id: "{{ ac_sound_switch }}"

  # =============================================
  # STEP 2a: LIVE-STATE VARIABLES
  # All variables computed inside action: so HA generates a trace
  # entry on any template failure.
  # =============================================
  - variables:
      # True only on a real trigger (periodic / vacation_change / ha_start);
      # a manual "Run" has no trigger.id. STEP 6's phase dispatch is gated on
      # this so a manual Run is debug-inspect-only — it never actuates the AC
      # nor double-applies the BEDTIME_LOCK auto-learn write. Matches the
      # STEP 8 debug gate's `trigger.id | default('manual')` logic.
      is_real_trigger: "{{ trigger.id is defined }}"
      # --- Bedroom temperature aggregation (skip unavailable sensors) ---
      bedroom_valid_temps: >-
        {% set ns = namespace(vals=[]) %}
        {% for s in bedroom_temp_sensors %}
          {% set v = states(s) %}
          {% if v not in ['unavailable', 'unknown', 'none', none]
                and v | float(none) is not none %}
            {% set ns.vals = ns.vals + [v | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.vals }}
      bedroom_sensors_ok: "{{ bedroom_valid_temps | length > 0 }}"
      warmest_bedroom: >-
        {% if bedroom_valid_temps | length == 0 %}
          {{ ideal_temp | float }}
        {% elif sensor_strategy == 'average' %}
          {{ ((bedroom_valid_temps | sum) / (bedroom_valid_temps | length)) | round(2) }}
        {% else %}
          {{ bedroom_valid_temps | max }}
        {% endif %}
      coldest_bedroom: >-
        {% if bedroom_valid_temps | length == 0 %}
          {{ ideal_temp | float }}
        {% else %}
          {{ bedroom_valid_temps | min }}
        {% endif %}
      # --- Bedroom humidity (only meaningful when dry mode enabled) ---
      bedroom_valid_humidity: >-
        {% set ns = namespace(vals=[]) %}
        {% for s in bedroom_humidity_sensors %}
          {% set v = states(s) %}
          {% if v not in ['unavailable', 'unknown', 'none', none]
                and v | float(none) is not none %}
            {% set ns.vals = ns.vals + [v | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.vals }}
      room_humidity: >-
        {% if bedroom_valid_humidity | length == 0 %}
          0
        {% else %}
          {{ bedroom_valid_humidity | max }}
        {% endif %}
      # --- Outdoor live reading ---
      outdoor_now_raw: "{{ states(outdoor_temp_sensor) }}"
      outdoor_now_ok: >-
        {{ outdoor_now_raw not in ['unavailable', 'unknown', 'none', none]
           and outdoor_now_raw | float(none) is not none }}
      outdoor_now: "{{ outdoor_now_raw | float(ideal_temp | float) }}"
      # --- AC live state ---
      current_hvac_mode: "{{ states(ac_climate) }}"
      ac_unavailable: "{{ current_hvac_mode in ['unavailable', 'unknown'] }}"
      ac_is_running: "{{ current_hvac_mode not in ['off', 'unavailable', 'unknown'] }}"
      # LG returns null setpoints in some non-cool modes — guard the read.
      current_setpoint_raw: "{{ state_attr(ac_climate, 'temperature') }}"
      current_setpoint_known: "{{ current_setpoint_raw not in [none, 'none', 'unknown', 'unavailable'] }}"
      current_setpoint: "{{ current_setpoint_raw | float(ideal_temp | float) }}"
      current_fan: "{{ state_attr(ac_climate, 'fan_modes') and state_attr(ac_climate, 'fan_mode') or 'unknown' }}"
      # --- AC capability discovery (never hard-code) ---
      ac_min_temp: "{{ state_attr(ac_climate, 'min_temp') | float(16) }}"
      ac_max_temp: "{{ state_attr(ac_climate, 'max_temp') | float(30) }}"
      ac_temp_step: "{{ [state_attr(ac_climate, 'target_temp_step') | float(0.5), 0.1] | max }}"
      # Seconds since the unit's last STATE (hvac-mode) change — the age of its
      # current running or off spell. Attribute-only pushes do not move it.
      ac_state_age_sec: "{{ (as_timestamp(now()) - (as_timestamp(states[ac_climate].last_changed) | float(0))) if states[ac_climate] is not none else 0 }}"
      ac_fan_modes: "{{ state_attr(ac_climate, 'fan_modes') | default([], true) }}"
      ac_hvac_modes: "{{ state_attr(ac_climate, 'hvac_modes') | default([], true) }}"
      # --- Vacation ---
      vacation_active: >-
        {% if vacation_toggle is iterable and vacation_toggle | length > 0 %}
          {{ expand(vacation_toggle) | selectattr('state', 'eq', 'on')
             | list | length > 0 }}
        {% else %}
          false
        {% endif %}
      # --- v1.2.0 fan coordination: live facts ---
      fan_only_mode: "{{ night_mode == 'fan_only' }}"
      # The bedtime target: ideal in AC-hold mode, ideal − pre-chill in fan-only mode.
      # Defined HERE, before STEP 2c, because delta_in, cooling_needed, the DRIVE/HOLD
      # substate and the auto-learn error all key on it (board R1-08).
      bedtime_target: "{{ (ideal_temp | float - prechill_offset | float) if fan_only_mode else (ideal_temp | float) }}"
      # Any interlock sensor on / unavailable / unknown / absent from the state machine
      # blocks the interlocked fans — the same fail-safe direction as the cutoff
      # blueprint — and so does a sensor whose STATE changed within the last
      # interlock_clear_minutes (last_changed, not last_updated): the cutoff resumes its
      # fan at clear + its hold, and this blueprint must never write the fan in that
      # minute or inside the hold (board R1-09).
      interlock_blocked: >-
        {% if fan_interlocks is iterable and fan_interlocks is not string
              and fan_interlocks | length > 0 %}
          {% set found = expand(fan_interlocks) | list %}
          {% set recent = as_timestamp(now()) - (interlock_clear_minutes | float) * 60 %}
          {{ found | length < fan_interlocks | length
             or found | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0
             or found | map(attribute='last_changed') | map('as_timestamp') | select('gt', recent) | list | length > 0 }}
        {% else %}
          {{ false }}
        {% endif %}
      # The unit's last off<->on transition as a timestamp (setpoint/fan edits touch
      # last_updated, not last_changed). Reference instant for pre-cool fan assist and
      # for the guard-settle window.
      ac_started_ts: >-
        {% set s = expand(ac_climate) | list %}
        {{ as_timestamp(s[0].last_changed) if s | length > 0 else 0 }}

  # =============================================
  # STEP 2b: FORECAST FETCH
  # weather.get_forecasts is the PLURAL current action — the singular
  # weather.get_forecast was deprecated. Both calls read HA's cached forecast
  # (Met.no refreshes upstream every 55-65 min), so they are cheap. The HOURLY
  # window (now -> bedtime) is fetched near a 15-minute boundary; a DAILY
  # forecast backs every other day-side tick, and any tick whose hourly
  # window comes back empty. Fetched into response variables, then
  # forecast_max is templated from them.
  # =============================================
  - variables:
      # Fetch only near a 15-minute boundary (minute mod 15 == 0) AND only
      # during the daytime wake -> bedtime window — the forecast result is
      # consumed by DAY_OFF alone, so fetching it overnight is pure waste.
      forecast_fetch_due: >-
        {{ (now().minute | int) % 15 == 0
           and now().strftime('%H:%M:%S') >= wake_time
           and now().strftime('%H:%M:%S') < bedtime }}
      # FORECAST_DAILY is bit 1 of the weather entity's supported_features
      # (FORECAST_HOURLY = 2, FORECAST_TWICE_DAILY = 4). get_forecasts RAISES
      # for a type the entity lacks, so the daily call is gated on the bit.
      weather_daily_supported: >-
        {{ (state_attr(weather_entity, 'supported_features') | int(0)) | bitwise_and(1) > 0 }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ forecast_fetch_due }}"
        sequence:
          # continue_on_error: a weather-entity failure must not abort the
          # whole action run — the daily backstop -> outdoor_now chain below
          # handles a missing/empty response.
          - service: weather.get_forecasts
            continue_on_error: true
            target:
              entity_id: "{{ weather_entity }}"
            data:
              type: hourly
            response_variable: hourly_forecast_resp
  - variables:
      # Source the forecast list straight from the service response_variable —
      # a response_variable has well-defined run scope, so no choose-branch
      # variable leaks across the boundary. On a non-fetch tick the fetch
      # branch never ran, so hourly_forecast_resp is simply undefined; the
      # `is defined` guard then yields the empty-list path. Filter forecast
      # entries to the window now -> bedtime, take the max temperature.
      # A response whose forecast is null / a scalar / a string / a mapping
      # yields [] — a template that iterates it would otherwise abort the run.
      forecast_list_safe: >-
        {{ hourly_forecast_resp[weather_entity].forecast
           if hourly_forecast_resp is defined
              and hourly_forecast_resp is mapping
              and weather_entity in hourly_forecast_resp
              and hourly_forecast_resp[weather_entity] is mapping
              and hourly_forecast_resp[weather_entity].forecast is defined
              and hourly_forecast_resp[weather_entity].forecast is iterable
              and hourly_forecast_resp[weather_entity].forecast is not string
              and hourly_forecast_resp[weather_entity].forecast is not mapping
           else [] }}
      # Variables are re-parsed between steps: a datetime becomes a plain
      # string and any later .strftime()/comparison on it raises. Carry
      # instants as UNIX timestamps (floats survive the round-trip).
      bedtime_ts: >-
        {% set bt = today_at(bedtime) %}
        {{ as_timestamp(bt if bt >= now() else bt + timedelta(days=1)) }}
      forecast_window_temps: >-
        {% set ns = namespace(vals=[]) %}
        {% for f in forecast_list_safe %}
          {% set ts = f.datetime | default(none) %}
          {% set tp = f.temperature | default(none) %}
          {% if ts is not none and tp | float(none) is not none %}
            {% set fdt = as_datetime(ts, none) %}
            {% if fdt is not none and fdt >= now() and as_timestamp(fdt) <= bedtime_ts | float %}
              {% set ns.vals = ns.vals + [tp | float] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.vals }}
      # The daily backstop is due on every day-side tick whose hourly window
      # is empty: the 14 of 15 ticks without a fetch, and a fetch tick whose
      # window has no entry left before bedtime.
      forecast_daily_due: >-
        {{ forecast_window_temps | length == 0
           and weather_daily_supported
           and now().strftime('%H:%M:%S') >= wake_time
           and now().strftime('%H:%M:%S') < bedtime }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ forecast_daily_due }}"
        sequence:
          - service: weather.get_forecasts
            continue_on_error: true
            target:
              entity_id: "{{ weather_entity }}"
            data:
              type: daily
            response_variable: daily_forecast_resp
  - variables:
      forecast_daily_list: >-
        {{ daily_forecast_resp[weather_entity].forecast
           if daily_forecast_resp is defined
              and daily_forecast_resp is mapping
              and weather_entity in daily_forecast_resp
              and daily_forecast_resp[weather_entity] is mapping
              and daily_forecast_resp[weather_entity].forecast is defined
              and daily_forecast_resp[weather_entity].forecast is iterable
              and daily_forecast_resp[weather_entity].forecast is not string
              and daily_forecast_resp[weather_entity].forecast is not mapping
           else [] }}
      # A daily entry's `temperature` is the day's HIGH (Met.no: the max of
      # that day's hourly readings; `templow` is the low) stamped at local
      # noon. Take today's entry by LOCAL date, else the first entry, else
      # none (the `None` literal re-parses to none on the far side). Entries
      # without a parsable datetime or a numeric temperature are skipped —
      # continue_on_error on the fetch does not protect these templates.
      forecast_daily_high: >-
        {% set ns = namespace(today=none, first=none) %}
        {% for f in forecast_daily_list %}
          {% set ts = f.datetime | default(none) %}
          {% set tp = f.temperature | default(none) %}
          {% if ts is not none and tp | float(none) is not none %}
            {% set fdt = as_datetime(ts, none) %}
            {% if fdt is not none %}
              {% if ns.first is none %}{% set ns.first = tp | float %}{% endif %}
              {% if ns.today is none and (fdt | as_local).date() == now().date() %}
                {% set ns.today = tp | float %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.today if ns.today is not none else ns.first }}
      forecast_daily_ok: "{{ forecast_daily_high is not none and forecast_daily_high | float(none) is not none }}"
      # Precedence: hourly window max -> the day's forecast high (never below
      # the live outdoor reading) -> the live outdoor reading alone.
      forecast_max: >-
        {% if forecast_window_temps | length > 0 %}
          {{ forecast_window_temps | max }}
        {% elif forecast_daily_ok %}
          {{ [forecast_daily_high | float, outdoor_now | float] | max }}
        {% else %}
          {{ outdoor_now | float }}
        {% endif %}

  # =============================================
  # STEP 2c: PREDICTION & PHASE VARIABLES
  # =============================================
  - variables:
      # --- Solar-gain factor (0..1 from sun elevation + azimuth) ---
      sun_elevation: "{{ state_attr(sun_entity, 'elevation') | float(0) }}"
      sun_azimuth: "{{ state_attr(sun_entity, 'azimuth') | float(0) }}"
      solar_elevation_factor: >-
        {{ [1.0, [0.0, (sun_elevation | float) / 35.0] | max] | min }}
      solar_azimuth_ok: >-
        {% if not solar_afternoon_only %}
          true
        {% else %}
          {{ sun_azimuth | float >= 180 and sun_azimuth | float <= 300 }}
        {% endif %}
      solar_load: >-
        {% if sun_elevation | float <= 0 or not solar_azimuth_ok %}
          0
        {% else %}
          {{ solar_elevation_factor | float | round(3) }}
        {% endif %}
      # --- Lead-time inputs ---
      delta_in: "{{ [0, warmest_bedroom | float - bedtime_target | float] | max }}"
      outdoor_for_lead: "{{ [forecast_max | float, outdoor_now | float] | max }}"
      delta_out: "{{ [0, outdoor_for_lead | float - ideal_temp | float] | max }}"
      # --- Auto-learn bias: read the helper every tick when enabled ---
      lead_bias_entity: >-
        {% if lead_bias_helper is iterable and lead_bias_helper is not string
              and lead_bias_helper | length > 0 %}
          {{ lead_bias_helper[0] }}
        {% else %}
          {{ '' }}
        {% endif %}
      lead_bias_configured: "{{ lead_bias_entity != '' }}"
      lead_bias: >-
        {% if enable_auto_learn and lead_bias_configured %}
          {{ states(lead_bias_entity) | float(0) }}
        {% else %}
          0
        {% endif %}
      # The helper's own range, intersected with the blueprint's -60..120
      # clamp (v1.1.0): a helper created narrower — the live one had min 60
      # until 2026-09-09 — rejected the write and aborted the lock run.
      # state_attr of an unconfigured ('') helper is none -> the defaults.
      bias_helper_min: "{{ state_attr(lead_bias_entity, 'min') | float(-60) }}"
      bias_helper_max: "{{ state_attr(lead_bias_entity, 'max') | float(120) }}"
      # Whole-number bounds INSIDE the intersection (the helper has step 1):
      # a fractional helper bound is rounded inward, and a helper that does
      # not overlap -60..120 at all (floor > ceiling) disables the write.
      bias_floor: "{{ ([bias_helper_min | float, -60] | max) | round(0, 'ceil') | int }}"
      bias_ceiling: "{{ ([bias_helper_max | float, 120] | min) | round(0, 'floor') | int }}"
      bias_range_valid: "{{ bias_floor | float <= bias_ceiling | float }}"
      bias_helper_range_ok: "{{ bias_helper_min | float <= -60 and bias_helper_max | float >= 120 }}"
      # --- Lead-time formula (transparent linear blend), then clamp ---
      lead_raw: >-
        {{ (base_minutes | float)
           + (k_indoor | float) * (delta_in | float)
           + (k_outdoor | float) * (delta_out | float)
           + (solar_max_minutes | float) * (solar_load | float)
           + (safety_margin_minutes | float)
           + (lead_bias | float) }}
      lead: "{{ [[lead_raw | float, 0] | max, lead_cap_minutes | float] | min | round(0) | int }}"
      # --- Cool-day skip gate (consulted in DAY-OFF only) ---
      cooling_needed: >-
        {{ warmest_bedroom | float > bedtime_target | float
           or forecast_max | float > skip_threshold | float }}
      # --- Schedule boundaries as time-of-day strings (HH:MM:SS).
      # Phase derivation compares time-of-day so the overnight window
      # (bedtime -> wake, spanning midnight) is handled without any
      # date arithmetic. turn_on is the only moving boundary: turn_on_ts
      # carries it as a UNIX timestamp (a datetime would arrive in the
      # next step as a plain string), and turn_on_tod is LOAD-BEARING —
      # precool_started compares now_tod against it; the debug dump only
      # reuses the same values. lock_tod / deep_end_tod format their
      # datetime inside the same template (wall-clock .strftime), while
      # turn_on_tod is instant-derived via timestamp_custom; the two agree
      # except inside a DST-skipped hour, unreachable at any bedtime that
      # keeps turn_on after 03:00. ---
      now_tod: "{{ now().strftime('%H:%M:%S') }}"
      wake_tod: "{{ wake_time }}"
      bedtime_tod: "{{ bedtime }}"
      lock_tod: >-
        {{ (today_at(bedtime) - timedelta(minutes=1)).strftime('%H:%M:%S') }}
      deep_tod: "{{ deep_night_check }}"
      deep_end_tod: >-
        {{ (today_at(deep_night_check) + timedelta(minutes=10)).strftime('%H:%M:%S') }}
      turn_on_ts: "{{ as_timestamp(today_at(bedtime) - timedelta(minutes=lead | int)) }}"
      turn_on_tod: "{{ turn_on_ts | float | timestamp_custom('%H:%M:%S') }}"
      # Earliest possible turn-on = bedtime - lead cap. A running AC is
      # evidence that PRECOOL has started ONLY inside [earliest_turn_on,
      # bedtime); earlier on the day side (from wake) ANY running unit — a
      # leftover night hold or a manual daytime turn-on — is switched off by
      # DAY_OFF on the next tick (one beep). Without this bound the
      # ac_is_running latch made DAY_OFF unreachable on every cooling night
      # (2026-09-08: the unit was re-driven at 07:15 and ran all day).
      # Wall-clock .strftime like lock_tod. STEP 3 rejects a lead cap whose
      # earliest turn-on is at/before wake — compared as instants inside one
      # template, because a wrapped HH:MM:SS (e.g. '23:00:00') would sort
      # ABOVE wake_time and slip past a string compare.
      earliest_turn_on_tod: >-
        {{ (today_at(bedtime) - timedelta(minutes=lead_cap_minutes | int)).strftime('%H:%M:%S') }}
      # Reference instant for the bedtime lock (this branch's fan-only park/off and
      # night fan setting; also settle-window relative). Depends only on bedtime, so
      # it is defined here — before manual_off (v1.2.0: tells the lock's own off from
      # a person's) and before the settle window that also reads it.
      # Board 20260909-151815 F1 (P0): anchored to the NIGHT's start date exactly like
      # earliest_turn_on_ts below — before wake time the night still belongs to
      # YESTERDAY's window. Without the day offset, at 01:00 this re-anchored to
      # TONIGHT's 19:29 (a future timestamp), so the lock's own 19:29:30 off fell
      # outside the manual_off exemption window for the rest of the night and the
      # guard never fired.
      lock_ts: "{{ as_timestamp(today_at(bedtime) - timedelta(days=(1 if now().strftime('%H:%M:%S') < wake_time else 0), minutes=1)) }}"
      # Before wake time the night still belongs to YESTERDAY's window (the
      # bedtime_ts pattern, mirrored), so a manual off stays visible until the
      # deep-night check instead of vanishing at local midnight.
      earliest_turn_on_ts: "{{ as_timestamp(today_at(bedtime) - timedelta(days=(1 if now().strftime('%H:%M:%S') < wake_time else 0), minutes=lead_cap_minutes | int)) }}"
      # --- Manual OFF inside the adoption window (v1.1.0) ---
      # The blueprint never switches the unit off between earliest_turn_on and
      # the lock (DAY_OFF cannot see a running unit there; only the vacation
      # branch can), so an `off` transition stamped inside that window came
      # from a person (remote, app, the unit's own timer). It is respected:
      # PRECOOL does not restart the unit and the night is a cool-day no-op.
      # Guards (all coordinator-lag tolerant): the window start carries a
      # 120 s margin (≈ 3 min after the last pre-window tick) so a DAY_OFF
      # turn_off issued on that tick whose confirmation lands after the window
      # opens is not a person's;
      # the state re-created at HA start / automation reload carries a fresh
      # last_changed (this.last_changed moves at the same moment — a cloud
      # integration may publish its first state up to minutes later, hence
      # 600 s); the vacation branch's turn_off is recognised by the toggle's
      # own last_changed within 120 s. A reload AFTER a manual off ends that
      # hold (the reload stamp is newer). Instants compared as timestamps.
      automation_up_since_ts: "{{ (this.last_changed | as_timestamp(0)) if (this is defined and this is not none) else 0 }}"
      ac_off_since_ts: "{{ as_timestamp(states[ac_climate].last_changed) | float(0) if states[ac_climate] is not none else 0 }}"
      vacation_changed_ts: >-
        {% set ns = namespace(ts=0) %}
        {% if vacation_toggle is iterable and vacation_toggle is not string %}
          {% for v in expand(vacation_toggle) %}
            {% set t = as_timestamp(v.last_changed) | float(0) %}
            {% if t > ns.ts %}{% set ns.ts = t %}{% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.ts }}
      # v1.2.0: the fan-only lock switches the unit off itself (≈ lock tick + cloud lag);
      # an off stamped within 180 s of the lock is the blueprint's, not a person's — a
      # person's off in that same window is misread as ours, documented.
      manual_off: >-
        {{ (not ac_is_running) and (not ac_unavailable)
           and ac_off_since_ts | float >= earliest_turn_on_ts | float + 120
           and ac_off_since_ts | float > automation_up_since_ts | float + 600
           and vacation_changed_ts | float < ac_off_since_ts | float - 120
           and not (fan_only_mode and ac_off_since_ts | float >= lock_ts | float and ac_off_since_ts | float < lock_ts | float + 180) }}
      # --- Phase derivation (all time-of-day string comparisons) ---
      # The "day side" of the schedule runs wake -> bedtime_lock.
      on_day_side: "{{ wake_tod <= now_tod and now_tod < lock_tod }}"
      in_lock_window: "{{ lock_tod <= now_tod and now_tod < bedtime_tod }}"
      in_deep_check: "{{ deep_tod <= now_tod and now_tod < deep_end_tod }}"
      in_deep_hold: "{{ deep_end_tod <= now_tod and now_tod < wake_tod }}"
      # NIGHT_HOLD is the phase-derivation else branch (after bedtime, before
      # the deep-night check) — no explicit variable is needed for it.
      # PRECOOL begins only when cooling is needed AND now >= turn_on;
      # once the AC is running inside the lead-cap window it STAYS PRECOOL
      # (one-way latch) even if a recomputed lead pushes turn_on later. The
      # running AC IS the persisted "PRECOOL has started" bit — stateless
      # and restart-safe — but only from earliest_turn_on_tod onward.
      precool_started: "{{ (cooling_needed and now_tod >= turn_on_tod) or (ac_is_running and now_tod >= earliest_turn_on_tod) }}"
      in_precool_window: "{{ on_day_side and precool_started }}"
      in_day_off: "{{ on_day_side and not precool_started }}"
      # Single-lined: a folded scalar leaves trailing whitespace between a
      # token and the next tag, and this value feeds == comparisons.
      phase: "{% if in_lock_window %}BEDTIME_LOCK{% elif in_precool_window %}PRECOOL{% elif in_deep_check %}DEEP_NIGHT_CHECK{% elif in_deep_hold %}DEEP_HOLD{% elif in_day_off %}DAY_OFF{% else %}NIGHT_HOLD{% endif %}"
      # --- PRECOOL sub-state ---
      precool_substate: >-
        {% if warmest_bedroom | float > bedtime_target | float %}DRIVE{% else %}HOLD{% endif %}
      # --- Setpoints, all clamped to the AC's discovered min/max, and held
      # the way the DEVICE holds them: the LG ThinQ integration sends
      # int(value) to a unit whose target_temp_step is a whole degree (core
      # lg_thinq/climate.py), so the blueprint quantises the same way and
      # every compare (idempotency guards, override detection) uses the
      # device-held value. On a 0.5-step unit every input is already on the
      # grid (all temperature selectors step 0.5). ---
      effective_drive: >-
        {% set v = [[drive_setpoint | float, ac_min_temp | float] | max, ac_max_temp | float] | min %}
        {{ (v | int) if ac_temp_step | float >= 1 else v }}
      maintaining_setpoint: >-
        {% set v = [[ideal_temp | float - hall_offset | float, ac_min_temp | float] | max, ac_max_temp | float] | min %}
        {{ (v | int) if ac_temp_step | float >= 1 else v }}
      # --- Manual SETPOINT override (v1.1.0) ---
      # The blueprint can only ever have commanded four setpoints: drive,
      # maintaining, and the two deep-night corrections. A running unit whose
      # setpoint is none of them was set by a person; PRECOOL then leaves the
      # unit alone until the bedtime lock (the next phase boundary) and the
      # lock skips that night's auto-learn write. HA state contexts cannot
      # tell this automation's writes from the remote's (both carry no
      # parent/user on a time-pattern run — verified live 2026-09-09), so the
      # comparison is against values, not authorship — the values as the
      # DEVICE holds them (see the quantisation note above). Single-lined: the
      # list crosses the variables boundary and is re-parsed as a list; a
      # value that arrives in any other shape counts as known (v1.0.x
      # behaviour).
      # Two-tick grace (board R1-01): the unit's own coordinator publishes a
      # commanded setpoint seconds AFTER the call, and a lost command was
      # self-healed by the next tick's idempotency guard in v1.0.x. A value
      # that does not match is therefore treated as a person's only once the
      # unit has been running for two ticks (>= 120 s since its off->on
      # change); the first tick after turn-on re-sends as before. A person's
      # change inside those first two minutes is re-asserted once (documented).
      known_setpoints: "{% set ns = namespace(vals=[]) %}{% for v in [effective_drive | float, maintaining_setpoint | float, [[maintaining_setpoint | float - correction_step | float, ac_min_temp | float] | max, ac_max_temp | float] | min, [[maintaining_setpoint | float + correction_step | float, ac_min_temp | float] | max, ac_max_temp | float] | min] %}{% set ns.vals = ns.vals + [(v | int) if ac_temp_step | float >= 1 else v] %}{% endfor %}{{ ns.vals }}"
      setpoint_is_known: "{% set ns = namespace(ok=false) %}{% if known_setpoints is string or known_setpoints is not iterable %}{% set ns.ok = true %}{% else %}{% for k in known_setpoints %}{% if (current_setpoint | float - k | float) | abs <= 0.1 %}{% set ns.ok = true %}{% endif %}{% endfor %}{% endif %}{{ ns.ok }}"
      manual_setpoint: "{{ ac_is_running and current_setpoint_known and not setpoint_is_known and ac_state_age_sec | float >= 120 }}"
      # --- Cool vs dry mode (only chosen while beeps are free) ---
      # Single-lined: this value feeds == comparisons and hvac_mode:; a
      # folded scalar would leave trailing whitespace on the rendered token.
      # The dry branch additionally requires the AC to advertise 'dry' in its
      # discovered hvac_modes — otherwise it falls through to cool.
      desired_mode: "{% if not enable_dry_mode %}cool{% elif warmest_bedroom | float > ideal_temp | float + tolerance | float %}cool{% elif room_humidity | float > humidity_threshold | float and 'dry' in ac_hvac_modes %}dry{% else %}cool{% endif %}"
      # --- Fan modes discovered from the entity ---
      fan_high: >-
        {% set m = ac_fan_modes %}
        {% set ns = namespace(found='') %}
        {% for c in ['Power', 'Turbo', 'High', 'high', '4', '3'] if c in m %}
          {% if ns.found == '' %}{% set ns.found = c %}{% endif %}
        {% endfor %}
        {{ ns.found if ns.found != '' else (m[-1] if m | length > 0 else 'high') }}
      fan_normal: >-
        {% set m = ac_fan_modes %}
        {% set ns = namespace(found='') %}
        {% for c in ['Mid', 'Medium', 'mid', 'medium', 'Auto', 'auto', '2'] if c in m %}
          {% if ns.found == '' %}{% set ns.found = c %}{% endif %}
        {% endfor %}
        {{ ns.found if ns.found != '' else (m[0] if m | length > 0 else 'auto') }}
      # Night fan: the configured level resolved against the unit's own modes,
      # case-insensitively (repo convention — non-lowercase units exist), so the
      # unit's spelling is what gets sent. '' when the unit lacks it, in which
      # case night_fan_mode falls back to fan_normal and STEP 7c says so.
      # Single-lined: both feed != comparisons and fan_mode:.
      night_fan_resolved: "{% set ns = namespace(found='') %}{% for c in ac_fan_modes if (c | string | lower) == (night_fan | string | lower) %}{% if ns.found == '' %}{% set ns.found = c %}{% endif %}{% endfor %}{{ ns.found }}"
      night_fan_mode: "{{ night_fan_resolved if night_fan_resolved != '' else fan_normal }}"
      # --- v1.2.0: parity, windows, guard ---
      # Parity of the NIGHT = day of the year of the night's start date, pivoting at
      # WAKE TIME: from wake through PRECOOL and the lock it is today, in the small
      # hours before wake it is yesterday — one value from a pre-noon PRECOOL start to
      # the last tick before wake (board R2-06).
      night_parity: "{{ 'odd' if (((now() if now_tod >= wake_tod else now() - timedelta(days=1)).timetuple().tm_yday) % 2) == 1 else 'even' }}"
      fan_assist_tonight: "{{ fan_assist == 'all' or fan_assist == night_parity }}"
      night_fans_tonight: "{{ night_fans == 'all' or night_fans == night_parity }}"
      settle_end_tod: "{{ (today_at(bedtime) + timedelta(minutes=fan_settle_minutes | int)).strftime('%H:%M:%S') }}"
      settle_last_tod: "{{ (today_at(bedtime) + timedelta(minutes=(fan_settle_minutes | int) - 1)).strftime('%H:%M:%S') }}"
      # v1.2.0: derived from main's ac_state_age_sec (STEP 2a) — same quantity
      # (seconds since the climate entity's last_changed), one computation.
      since_ac_start_min: "{{ ((ac_state_age_sec | float) / 60) | round(1) }}"
      in_wake_window: "{{ wake_tod <= now_tod and now_tod < (today_at(wake_time) + timedelta(minutes=1)).strftime('%H:%M:%S') }}"
      in_fan_settle: "{{ lock_tod <= now_tod and now_tod < settle_end_tod }}"
      in_settle_last_tick: "{{ settle_last_tod <= now_tod and now_tod < settle_end_tod }}"
      # Board 20260909-151815 F4: ac_started_ts is the climate's last_changed, which also
      # moves on a cool<->dry mode transition and at an HA restart — either would
      # re-open the 45-min assist window with a NEW reference, so a fan switched off
      # after the ORIGINAL start would count as untouched again. Guarded by the same
      # 600 s restart-grace convention as manual_off/automation_up_since_ts. A bare
      # mode transition inside a long-up automation is not further distinguished
      # (dry mode and fan_assist are both off by default — documented residual case).
      in_fan_assist_window: "{{ phase == 'PRECOOL' and ac_is_running and (since_ac_start_min | float) < (fan_settle_minutes | float) and (as_timestamp(now()) - (automation_up_since_ts | float)) > 600 }}"
      night_phase: "{{ phase in ['NIGHT_HOLD', 'DEEP_NIGHT_CHECK', 'DEEP_HOLD'] }}"
      # Night guard: fan-only, a night phase, unit off, warmest room over the band, on a
      # 5-minute tick (bounds a stuck cloud 'off' to ≤ 12 attempts/h, board R2-02). The
      # running unit is the latch — once on, guard_due is false until DAY_OFF turns it
      # off at wake. v1.2.0: a respected manual off (v1.1.0 semantics) is left alone —
      # the guard does not fight a person's own off.
      guard_due: "{{ fan_only_mode and night_phase and not ac_is_running and (warmest_bedroom | float) > (ideal_temp | float + tolerance | float) and (now().minute | int) % 5 == 0 and not manual_off }}"
      # Guard settle: for 15 min after ANY night start the parked state is asserted from
      # live reads, each call only if different (board R1-01/R1-03/R2-03/R2-04). The
      # setpoint check leaves a deep-night nudge (exactly correction_step away) alone.
      # v1.2.0: never while a manual setpoint is active — a person adjusting the unit
      # inside the 15-minute window is left alone (manual_setpoint already requires
      # ac_state_age_sec >= 120, so the first two ticks after a start are always ours).
      guard_settle_due: "{{ fan_only_mode and night_phase and ac_is_running and (since_ac_start_min | float) < 15 and not manual_setpoint }}"
      settle_mode_due: "{{ guard_settle_due and current_hvac_mode not in ['cool', 'dry'] }}"
      # Board 20260909-151815 F7 (P1, R1-02/R1-03): on a unit whose ac_temp_step >= 1, main
      # QUANTISES every commanded setpoint (int()) — maintaining = int(21.0) = 21, the
      # deep-night down-nudge = int(21 - 1.5) = 19 (NOT 19.5), up-nudge = int(22.5) = 22.
      # The old `> correction_step + 0.1` band compared against the UNQUANTISED nudge
      # (19.5), so it fired on the device's actual 19 (|19-21| = 2.0) and STEP 6b re-sent
      # 21 the tick after DEEP_NIGHT_CHECK set 19 — an alternating set_temperature loop
      # whenever the settle window overlaps 01:00 (a guard trip near 01:00, or a restart
      # that re-stamps the climate's last_changed). night_hold_setpoints lists exactly
      # what the device can be holding overnight — maintaining and its two nudges,
      # quantised the same way as known_setpoints — and setpoint_is_night_hold is true
      # when current_setpoint is within 0.1 of any of them (same "non-list arrives ->
      # treat as known" guard as setpoint_is_known). A stale DRIVE park (18 on this unit)
      # is not in that list and is still corrected.
      night_hold_setpoints: "{% set ns = namespace(vals=[]) %}{% for v in [maintaining_setpoint | float, [[maintaining_setpoint | float - correction_step | float, ac_min_temp | float] | max, ac_max_temp | float] | min, [[maintaining_setpoint | float + correction_step | float, ac_min_temp | float] | max, ac_max_temp | float] | min] %}{% set ns.vals = ns.vals + [(v | int) if ac_temp_step | float >= 1 else v] %}{% endfor %}{{ ns.vals }}"
      setpoint_is_night_hold: "{% set ns = namespace(ok=false) %}{% if night_hold_setpoints is string or night_hold_setpoints is not iterable %}{% set ns.ok = true %}{% else %}{% for k in night_hold_setpoints %}{% if (current_setpoint | float - k | float) | abs <= 0.1 %}{% set ns.ok = true %}{% endif %}{% endfor %}{% endif %}{{ ns.ok }}"
      settle_setpoint_due: "{{ guard_settle_due and current_setpoint_known and not setpoint_is_night_hold }}"
      settle_fan_due: "{{ guard_settle_due and enable_fan_control and ac_fan_modes | length > 0 and current_fan != 'unknown' and current_fan != night_fan_mode }}"
      # --- v1.2.0 fan write rule → per-window lists of fans DUE for one command ---
      # A fan is due when: configured, present and available, not already at the target
      # (state_attr | int(-1): a missing attribute is None, never an Undefined that
      # would abort this whole variables step), not an interlocked fan while the
      # interlock is blocked, and untouched since the reference instant (last_updated
      # older than it — a percentage change bumps last_updated, not last_changed). Our
      # own command bumps last_updated, so a fan is written at most once per reference;
      # a fan the safety cutoff or a person changed is left alone. The action step
      # (STEP 5c) re-checks the same rule live before each call. Lists cross the
      # variables boundary intact.
      fans_due_night: >-
        {% set ns = namespace(out=[]) %}
        {% if night_fans_tonight and in_fan_settle %}
          {% for f in bedroom_fans %}
            {% set st = expand(f) | list %}
            {% if st | length > 0 %}
              {% set s = st[0] %}
              {% set at_target = s.state == 'on' and (state_attr(f, 'percentage') | int(-1)) == (night_fan_percentage | int) %}
              {% set blocked = (f in interlocked_fans) and interlock_blocked %}
              {% if s.state not in ['unavailable', 'unknown'] and not at_target and not blocked
                    and as_timestamp(s.last_updated) < (lock_ts | float) %}
                {% set ns.out = ns.out + [f] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.out }}
      fans_due_precool: >-
        {% set ns = namespace(out=[]) %}
        {% if fan_assist_tonight and in_fan_assist_window %}
          {% for f in bedroom_fans %}
            {% set st = expand(f) | list %}
            {% if st | length > 0 %}
              {% set s = st[0] %}
              {% set at_target = s.state == 'on' and (state_attr(f, 'percentage') | int(-1)) == (precool_fan_percentage | int) %}
              {% set blocked = (f in interlocked_fans) and interlock_blocked %}
              {% if s.state not in ['unavailable', 'unknown'] and not at_target and not blocked
                    and as_timestamp(s.last_updated) < (ac_started_ts | float) %}
                {% set ns.out = ns.out + [f] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.out }}
      # Fans that COULD NOT be written this tick (blocked or unavailable), untouched and
      # not at target — disjoint from fans_due_night by construction; reported once on
      # the last settle tick, never retried.
      fans_unset_night: >-
        {% set ns = namespace(out=[]) %}
        {% if night_fans_tonight and in_fan_settle %}
          {% for f in bedroom_fans %}
            {% set st = expand(f) | list %}
            {% if st | length > 0 %}
              {% set s = st[0] %}
              {% set at_target = s.state == 'on' and (state_attr(f, 'percentage') | int(-1)) == (night_fan_percentage | int) %}
              {% set blocked = (f in interlocked_fans) and interlock_blocked %}
              {% if (s.state in ['unavailable', 'unknown'] or blocked) and not at_target
                    and as_timestamp(s.last_updated) < (lock_ts | float) %}
                {% set ns.out = ns.out + [f] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.out }}
      fans_on_at_wake: >-
        {% set ns = namespace(out=[]) %}
        {% if fans_at_wake == 'off' and in_wake_window %}
          {% for f in bedroom_fans %}
            {% set st = expand(f) | list %}
            {% if st | length > 0 and st[0].state == 'on' %}
              {% set ns.out = ns.out + [f] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.out }}
      # Board 20260909-151815 F3 (P1, R2-01): an interlocked fan that comes ON under an
      # ACTIVE interlock is switched off — the live re-check in STEP 5c cannot cancel a
      # Tuya command already in flight (applied 10-60 s later): if the PIR trips inside
      # that lag and the fan was still off, the cutoff's `to: on` trigger has already
      # passed and nothing else cuts it. Only a fan that turned on in the LAST 120 s
      # counts (older than that is the cutoff's own restore, or a person's deliberate on
      # respected after two minutes — the cutoff's own "manual override wins"); only an
      # interlock sensor actively reading `on` counts (not unavailable/unknown/the clear
      # hold — those already block new writes, not this one).
      fans_unsafe_on: >-
        {% set ns = namespace(out=[]) %}
        {% if expand(fan_interlocks) | selectattr('state', 'eq', 'on') | list | length > 0 %}
          {% for f in interlocked_fans %}
            {% set st = expand(f) | list %}
            {% if st | length > 0 %}
              {% set s = st[0] %}
              {% if s.state == 'on' and as_timestamp(now()) - as_timestamp(s.last_updated) < 120 %}
                {% set ns.out = ns.out + [f] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.out }}

  # =============================================
  # STEP 3: RUNTIME (CONFIG) VALIDATION
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ drive_setpoint | float >= ideal_temp | float
                 or hall_offset | float < 0
                 or bedtime == wake_time
                 or wake_time >= bedtime
                 or deep_night_check >= wake_time
                 or (today_at(bedtime) - timedelta(minutes=lead_cap_minutes | int))
                    <= today_at(wake_time)
                 or (today_at(bedtime) + timedelta(minutes=fan_settle_minutes | int)).date()
                    != today_at(bedtime).date() }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_notifications }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "Bedroom Pre-Cool — Configuration Error"
                      message: >
                        Invalid configuration detected. Check that Drive
                        Setpoint ({{ drive_setpoint }}°C) is below Ideal
                        Temperature ({{ ideal_temp }}°C), Hall Offset
                        ({{ hall_offset }}°C) is not negative, and the schedule
                        is ordered correctly: Wake Time ({{ wake_time }}) must
                        be before Bedtime ({{ bedtime }}), and the Deep-Night
                        Check ({{ deep_night_check }}) must fall in the small
                        hours before Wake Time, and Bedtime minus the Lead Cap
                        ({{ lead_cap_minutes }} min = {{ earliest_turn_on_tod }})
                        must be after Wake Time. Bedtime plus the Fan Settle
                        Window ({{ fan_settle_minutes }} min) must not cross
                        midnight. Control is paused until corrected.
                      notification_id: "bedroom_precool_config_error"
          - stop: "Configuration error"

  # =============================================
  # STEP 4: VACATION OVERRIDE
  # Before sensor validation — turning the AC off does not depend on
  # bedroom-sensor health.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ vacation_active }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not ac_unavailable and ac_is_running }}"
                sequence:
                  - service: climate.turn_off
                    target:
                      entity_id: "{{ ac_climate }}"
          - stop: "Vacation active"

  # =============================================
  # STEP 5c: BEDROOM FANS (v1.2.0) — the ONLY place fan services are called. Board
  # 20260909-151815 F10: moved here, AFTER the vacation stop but BEFORE STEP 5's
  # AC/sensor validation, so an LG cloud outage (ac_unavailable) or a missing bedroom
  # sensor no longer silently skips every fan write and the "reported once" notice for
  # the whole settle window — fans run and the notice fires on every real tick except
  # during vacation. Also deliberately BEFORE the AC dispatch: no climate call sits
  # between the STEP 2c snapshot and the fan command. fans_unsafe_on (F3) runs FIRST:
  # an interlocked fan that just turned on under an active interlock is cut before any
  # due-list write — the live re-check below cannot cancel a Tuya command already in
  # flight. Each due list re-checks the rule on LIVE state (availability, target,
  # interlock incl. the clear hold, untouched since the reference) so an adult who
  # entered or a cutoff that fired since the snapshot cancels the command. Empty lists
  # iterate nothing. Direction is never written. continue_on_error: one cloud failure
  # never aborts the other fans or the rest of the tick. The skipped-fan notice (F10)
  # is folded into the end of this same sequence — same condition, same
  # notification_id — instead of a separate STEP 7f that STEP 5 could pre-empt.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_real_trigger }}"
        sequence:
          - repeat:
              for_each: "{{ fans_unsafe_on }}"
              sequence:
                - service: fan.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
          - repeat:
              for_each: "{{ fans_due_precool }}"
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ states(repeat.item) not in ['unavailable', 'unknown']
                               and not (is_state(repeat.item, 'on')
                                        and (state_attr(repeat.item, 'percentage') | int(-1)) == (precool_fan_percentage | int))
                               and not ((repeat.item in interlocked_fans) and fan_interlocks | length > 0
                                        and (expand(fan_interlocks) | list | length < fan_interlocks | length
                                             or expand(fan_interlocks) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0
                                             or expand(fan_interlocks) | map(attribute='last_changed') | map('as_timestamp')
                                                | select('gt', as_timestamp(now()) - (interlock_clear_minutes | float) * 60) | list | length > 0))
                               and as_timestamp((expand(repeat.item) | first).last_updated) < (ac_started_ts | float) }}
                      sequence:
                        - service: fan.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            percentage: "{{ precool_fan_percentage | int }}"
          - repeat:
              for_each: "{{ fans_due_night }}"
              sequence:
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ states(repeat.item) not in ['unavailable', 'unknown']
                               and not (is_state(repeat.item, 'on')
                                        and (state_attr(repeat.item, 'percentage') | int(-1)) == (night_fan_percentage | int))
                               and not ((repeat.item in interlocked_fans) and fan_interlocks | length > 0
                                        and (expand(fan_interlocks) | list | length < fan_interlocks | length
                                             or expand(fan_interlocks) | selectattr('state', 'in', ['on', 'unavailable', 'unknown']) | list | length > 0
                                             or expand(fan_interlocks) | map(attribute='last_changed') | map('as_timestamp')
                                                | select('gt', as_timestamp(now()) - (interlock_clear_minutes | float) * 60) | list | length > 0))
                               and as_timestamp((expand(repeat.item) | first).last_updated) < (lock_ts | float) }}
                      sequence:
                        - service: fan.turn_on
                          continue_on_error: true
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            percentage: "{{ night_fan_percentage | int }}"
          - repeat:
              for_each: "{{ fans_on_at_wake }}"
              sequence:
                - service: fan.turn_off
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_notifications and in_settle_last_tick and fans_unset_night | length > 0 }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "Bedroom Pre-Cool — Night Fan Not Applied"
                      message: >
                        {{ fans_unset_night | join(', ') }} did not get the night fan setting
                        ({{ night_fan_percentage }}%) within {{ fan_settle_minutes }} min of the
                        lock — an interlock stayed on or the fan was unavailable. Nothing will
                        retry; set it by hand if you want it on.
                      notification_id: "bedroom_precool_fan_skipped"

  # =============================================
  # STEP 5: SENSOR / ENTITY VALIDATION
  # =============================================
  - choose:
      # AC entity unavailable — skip this tick, retry next minute.
      - conditions:
          - condition: template
            value_template: "{{ ac_unavailable }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_notifications }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "Bedroom Pre-Cool — AC Unavailable"
                      message: >
                        {{ ac_climate }} is {{ current_hvac_mode }}. Skipping
                        this cycle; will retry next minute.
                      notification_id: "bedroom_precool_ac_unavailable"
          - stop: "AC entity unavailable"
      # No valid bedroom temperature sensor — hold state, warn.
      - conditions:
          - condition: template
            value_template: "{{ not bedroom_sensors_ok }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_notifications }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "Bedroom Pre-Cool — No Bedroom Sensor"
                      message: >
                        All bedroom temperature sensors are unavailable. The
                        blueprint is holding the current AC state until a
                        sensor recovers.
                      notification_id: "bedroom_precool_sensor_warning"
          - stop: "No valid bedroom temperature sensor"

  # =============================================
  # STEP 5b: OVERCOOLING FAULT (child-safety floor)
  # Informational only — does not stop the cycle.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ enable_notifications and coldest_bedroom | float < 16 }}"
        sequence:
          - service: persistent_notification.create
            data:
              title: "Bedroom Pre-Cool — Overcooling Fault"
              message: >
                A bedroom sensor reads {{ coldest_bedroom }}°C, below the 16°C
                child-safety floor. Check AC operation and sensor placement.
                If inside the deep-night check window the blueprint will
                correct upward.
              notification_id: "bedroom_precool_overcool_fault"

  # =============================================
  # STEP 6: PHASE DISPATCH — exactly one phase acts.
  # Each acting branch resolves desired setpoint/mode/fan, then issues
  # only idempotent service calls (a stray call is a stray beep).
  # NIGHT_HOLD and DEEP_HOLD are deliberately EMPTY (zero service calls).
  #
  # The whole 6-branch dispatch is gated on is_real_trigger: a manual "Run"
  # has no trigger.id, so it computes everything and shows the STEP 8 debug
  # dump but NEVER actuates the AC nor double-applies the BEDTIME_LOCK
  # auto-learn write. STEP 1-5, 7 and 8 are unchanged on a manual Run.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_real_trigger }}"
        sequence:
          - choose:
              # ---------- DAY_OFF: ensure the AC is off ----------
              - conditions:
                  - condition: template
                    value_template: "{{ phase == 'DAY_OFF' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ ac_is_running }}"
                        sequence:
                          - service: climate.turn_off
                            target:
                              entity_id: "{{ ac_climate }}"

              # ---------- PRECOOL: closed-loop drive / hold ----------
              - conditions:
                  - condition: template
                    value_template: "{{ phase == 'PRECOOL' }}"
                sequence:
                  - variables:
                      precool_setpoint: >-
                        {% if precool_substate == 'DRIVE' %}
                          {{ effective_drive | float }}
                        {% else %}
                          {{ maintaining_setpoint | float }}
                        {% endif %}
                      precool_fan: >-
                        {% if precool_substate == 'DRIVE' %}
                          {{ fan_high }}
                        {% else %}
                          {{ fan_normal }}
                        {% endif %}
                  # v1.1.0: a person's setpoint, or a manual off inside the
                  # window, wins until the bedtime lock — no command at all
                  # while either flag is set (STEP 7e says so).
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ not manual_setpoint and not manual_off }}"
                        sequence:
                            # 1. Ensure the unit is running and in the desired mode.
                            #    set_hvac_mode fails on a powered-off LG unit, so turn_on
                            #    first when off, then set the mode while it is running.
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ not ac_is_running }}"
                                  sequence:
                                    - service: climate.turn_on
                                      target:
                                        entity_id: "{{ ac_climate }}"
                            # Mode guard intentionally omits the `ac_is_running` precondition:
                            # ac_is_running was captured in STEP 2 before this branch's
                            # climate.turn_on ran, so on a first-tick-from-off it is stale
                            # `false`. climate.turn_on always precedes this call when the unit
                            # was off, so the unit IS on by now; the stale current_hvac_mode
                            # ('off') still differs from desired_mode ('cool'), so the mode is
                            # set the same tick instead of waiting for the next minute.
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: >-
                                        {{ current_hvac_mode != desired_mode }}
                                  sequence:
                                    - service: climate.set_hvac_mode
                                      target:
                                        entity_id: "{{ ac_climate }}"
                                      data:
                                        hvac_mode: "{{ desired_mode }}"
                            # 2. Then set the temperature (separate, sequenced call).
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: >-
                                        {{ (not current_setpoint_known)
                                           or (current_setpoint | float - precool_setpoint | float)
                                              | abs > 0.1 }}
                                  sequence:
                                    - service: climate.set_temperature
                                      target:
                                        entity_id: "{{ ac_climate }}"
                                      data:
                                        temperature: "{{ precool_setpoint | float }}"
                            # 3. Fan, only if fan control is enabled and there is a delta.
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: >-
                                        {{ enable_fan_control
                                           and ac_fan_modes | length > 0
                                           and current_fan != precool_fan }}
                                  sequence:
                                    - service: climate.set_fan_mode
                                      target:
                                        entity_id: "{{ ac_climate }}"
                                      data:
                                        fan_mode: "{{ precool_fan }}"

              # ---------- BEDTIME_LOCK: park (+ off in fan-only) + auto-learn write ----------
              - conditions:
                  - condition: template
                    value_template: "{{ phase == 'BEDTIME_LOCK' }}"
                sequence:
                  # Only act on an already-running AC (cool-day no-op otherwise).
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ ac_is_running }}"
                        sequence:
                          # Lock the maintaining setpoint (mode first, then temp).
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ current_hvac_mode != desired_mode }}"
                                sequence:
                                  - service: climate.set_hvac_mode
                                    target:
                                      entity_id: "{{ ac_climate }}"
                                    data:
                                      hvac_mode: "{{ desired_mode }}"
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ (not current_setpoint_known)
                                         or (current_setpoint | float
                                             - maintaining_setpoint | float)
                                            | abs > 0.1 }}
                                sequence:
                                  - service: climate.set_temperature
                                    target:
                                      entity_id: "{{ ac_climate }}"
                                    data:
                                      temperature: "{{ maintaining_setpoint | float }}"
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ enable_fan_control
                                         and ac_fan_modes | length > 0
                                         and current_fan != night_fan_mode }}
                                sequence:
                                  - service: climate.set_fan_mode
                                    target:
                                      entity_id: "{{ ac_climate }}"
                                    data:
                                      fan_mode: "{{ night_fan_mode }}"
                          # v1.2.0 fan-only: the unit is now PARKED on the maintaining
                          # setpoint + night fan (the calls above ran only if needed), so a
                          # later night-guard turn_on restores exactly this state in one
                          # command. Switch it off and hand the night to the fans — unless
                          # the warmest room is already over the guard band, in which case
                          # the guard would only switch it back on next tick (board R1-07):
                          # then the unit simply stays on, as in AC-hold mode.
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ fan_only_mode and not ((warmest_bedroom | float) > (ideal_temp | float + tolerance | float)) }}"
                                sequence:
                                  - service: climate.turn_off
                                    target:
                                      entity_id: "{{ ac_climate }}"
                          # Auto-learn helper write — beep-free (an input_number,
                          # not the AC). Only on a cooling night (AC running) and
                          # never while a manual setpoint is active at the lock:
                          # that night's outcome does not reflect the predictor.
                          # A configured helper that no longer exists skips the
                          # write (STEP 7a notice) instead of aborting the run.
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: "{{ enable_auto_learn and lead_bias_configured and states[lead_bias_entity] is not none and not manual_setpoint and bias_range_valid }}"
                                sequence:
                                  - variables:
                                      bedtime_error: "{{ warmest_bedroom | float - bedtime_target | float }}"
                                      new_bias_raw: >-
                                        {{ (lead_bias | float)
                                           + (learn_gain | float)
                                             * (bedtime_error | float)
                                             * (k_indoor | float) }}
                                      # Rounded to a whole number first (the helper has
                                      # step 1), then clamped to the whole-number bounds
                                      # inside the helper's range ∩ -60..120, so the write
                                      # can never be rejected (the branch is skipped when
                                      # the ranges do not overlap — bias_range_valid).
                                      new_bias: "{{ [[new_bias_raw | float | round(0), bias_floor | float] | max, bias_ceiling | float] | min | int }}"
                                  - service: input_number.set_value
                                    target:
                                      entity_id: "{{ lead_bias_entity }}"
                                    data:
                                      value: "{{ new_bias | float }}"

              # ---------- DEEP_NIGHT_CHECK: at most one corrective command ----------
              - conditions:
                  - condition: template
                    value_template: "{{ phase == 'DEEP_NIGHT_CHECK' }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ ac_is_running }}"
                        sequence:
                          - variables:
                              deep_drift: "{{ warmest_bedroom | float - ideal_temp | float }}"
                              # Target is derived from the STABLE maintaining_setpoint —
                              # NOT the moving current_setpoint. The periodic trigger runs
                              # this branch ~10 times across the 10-minute window;
                              # maintaining_setpoint is deterministic on every tick, so the
                              # abs(current_setpoint - deep_target_setpoint) > 0.1
                              # idempotency guard genuinely caps the correction at exactly
                              # one climate.set_temperature call. Single-lined to avoid a
                              # folded-scalar trailing-whitespace artifact.
                              deep_target_setpoint: "{% if deep_drift | float > tolerance | float %}{% set t = [[maintaining_setpoint | float - correction_step | float, ac_min_temp | float] | max, ac_max_temp | float] | min %}{% elif deep_drift | float < (0 - tolerance | float) %}{% set t = [[maintaining_setpoint | float + correction_step | float, ac_min_temp | float] | max, ac_max_temp | float] | min %}{% else %}{% set t = maintaining_setpoint | float %}{% endif %}{{ (t | int) if ac_temp_step | float >= 1 else t }}"
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {{ current_setpoint_known
                                         and (deep_drift | float | abs) > (tolerance | float)
                                         and (current_setpoint | float
                                              - deep_target_setpoint | float)
                                             | abs > 0.1 }}
                                sequence:
                                  - service: climate.set_temperature
                                    target:
                                      entity_id: "{{ ac_climate }}"
                                    data:
                                      temperature: "{{ deep_target_setpoint | float }}"

              # ---------- NIGHT_HOLD: deliberately empty (zero service calls) ----------
              - conditions:
                  - condition: template
                    value_template: "{{ phase == 'NIGHT_HOLD' }}"
                sequence: []

              # ---------- DEEP_HOLD: deliberately empty (zero service calls) ----------
              - conditions:
                  - condition: template
                    value_template: "{{ phase == 'DEEP_HOLD' }}"
                sequence: []

  # =============================================
  # STEP 6a: NIGHT GUARD (v1.2.0, fan-only nights) — turn_on + set_hvac_mode per trip.
  # The unit was parked (maintaining setpoint + night fan) and switched off at the
  # lock; if the warmest bedroom drifts over ideal + tolerance after bedtime, one
  # climate.turn_on restores power AND an UNCONDITIONAL climate.set_hvac_mode forces
  # the cooling mode (board 20260909-151815 F2 / R2-02): a bare turn_on alone restores
  # whatever mode the unit last held (a cool-day night after manual heat use would
  # restore heat), and the state read on this tick is stale anyway, so the guard
  # cannot gate the call on a mismatch — it always sends it, the same turn_on ->
  # set_hvac_mode pair PRECOOL uses. Two beeps per trip. From the next tick
  # ac_is_running is true, so guard_due is false until DAY_OFF turns the unit off at
  # wake — the running unit IS the latch. The setpoint/fan settle still lives in
  # STEP 6b on the following ticks (settle_mode_due now only matters after a manual
  # night start, since the guard tick above already forces the mode). NIGHT_HOLD /
  # DEEP_HOLD stay empty.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_real_trigger and guard_due }}"
        sequence:
          - service: climate.turn_on
            target:
              entity_id: "{{ ac_climate }}"
          - service: climate.set_hvac_mode
            target:
              entity_id: "{{ ac_climate }}"
            data:
              hvac_mode: "{{ desired_mode }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_notifications }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "Bedroom Pre-Cool — Night Guard"
                      message: >
                        {{ now().strftime('%H:%M') }}: the warmest bedroom read
                        {{ warmest_bedroom }}°C, above {{ ideal_temp | float + tolerance | float }}°C
                        (ideal + tolerance). The AC was switched back on in cooling mode
                        and holds until wake time; the blueprint re-checks its setpoint
                        and fan for 15 minutes. The restored state is on the climate
                        entity's history.
                      notification_id: "bedroom_precool_guard_fired"

  # =============================================
  # STEP 6b: GUARD SETTLE (v1.2.0) — for 15 min after ANY night start in fan-only
  # mode, assert the parked state from LIVE reads, each call only if different: a
  # restored heat/fan_only/auto mode would "latch" without cooling (board R1-03/R2-04);
  # a stale DRIVE park restores 18 °C / high; a cloud restore reported late is
  # corrected on a later tick instead of lost (board R1-01/R2-03). Normally 0 calls.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_real_trigger and settle_mode_due }}"
        sequence:
          - service: climate.set_hvac_mode
            target:
              entity_id: "{{ ac_climate }}"
            data:
              hvac_mode: "{{ desired_mode }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_real_trigger and settle_setpoint_due }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: "{{ ac_climate }}"
            data:
              temperature: "{{ maintaining_setpoint | float }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_real_trigger and settle_fan_due }}"
        sequence:
          - service: climate.set_fan_mode
            target:
              entity_id: "{{ ac_climate }}"
            data:
              fan_mode: "{{ night_fan_mode }}"

  # =============================================
  # STEP 7a: LEAD-BIAS-HELPER NOT CONFIGURED / MISSING — one-time notice
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications and enable_auto_learn
                 and (not lead_bias_configured or states[lead_bias_entity] is none) }}
        sequence:
          - service: persistent_notification.create
            data:
              title: "Bedroom Pre-Cool — Auto-Learn Helper Missing"
              message: >
                {% if lead_bias_configured %}Auto-Learn is enabled but the
                configured Lead-Time Bias Helper ({{ lead_bias_entity }}) does
                not exist.{% else %}Auto-Learn is enabled but no Lead-Time
                Bias Helper is configured.{% endif %} The blueprint still
                runs with a zero bias. Create an input_number helper and
                select it to enable self-learning.
              notification_id: "bedroom_precool_no_bias_helper"

  # =============================================
  # STEP 7b: FORECAST UNAVAILABLE — informational notice
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications and phase == 'DAY_OFF'
                 and forecast_window_temps | length == 0
                 and not forecast_daily_ok
                 and not outdoor_now_ok }}
        sequence:
          - service: persistent_notification.create
            data:
              title: "Bedroom Pre-Cool — Forecast & Outdoor Unavailable"
              message: >
                Neither an hourly nor a daily forecast nor the outdoor sensor
                is available.
                The prediction is leaning on the indoor gap and solar term only
                until one recovers.
              notification_id: "bedroom_precool_forecast_warning"

  # =============================================
  # STEP 7c: NIGHT FAN MODE NOT SUPPORTED — informational notice
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications and enable_fan_control
                 and ac_fan_modes | length > 0
                 and night_fan_resolved == '' }}
        sequence:
          - service: persistent_notification.create
            data:
              title: "Bedroom Pre-Cool — Night Fan Mode Not Supported"
              message: >
                The unit does not offer the configured Night Fan Mode
                ({{ night_fan }}); its modes are {{ ac_fan_modes | join(', ') }}.
                The bedtime lock uses {{ fan_normal }} instead.
              notification_id: "bedroom_precool_night_fan_unsupported"

  # =============================================
  # STEP 7d: AUTO-LEARN HELPER RANGE — state-driven notice (v1.1.0)
  # Created while the helper's range does not cover -60..120 (the write is
  # clamped to the helper's range meanwhile), dismissed once it does.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications and enable_auto_learn
                 and lead_bias_configured and not bias_helper_range_ok }}
        sequence:
          - service: persistent_notification.create
            data:
              title: "Bedroom Pre-Cool — Auto-Learn Helper Range Too Narrow"
              message: >
                {{ lead_bias_entity }} allows {{ bias_helper_min }} to
                {{ bias_helper_max }}, but the lead-time bias needs -60 to 120.
                {% if bias_range_valid %}
                Until the helper is widened the learned bias is clamped to
                {{ bias_floor }}…{{ bias_ceiling }} (a bias floored at
                {{ bias_floor }} min starts the pre-cool that much early every
                night).
                {% else %}
                The ranges do not overlap at all, so no bias is written until
                the helper is fixed.
                {% endif %}
                Edit the helper's min/max under Settings -> Devices & Services
                -> Helpers.
              notification_id: "bedroom_precool_bias_helper_range"
            continue_on_error: true
    default:
      - service: persistent_notification.dismiss
        data:
          notification_id: "bedroom_precool_bias_helper_range"
        continue_on_error: true

  # =============================================
  # STEP 7e: MANUAL OVERRIDE — state-driven notice (v1.1.0)
  # One notice per override episode: created while a manual setpoint or a
  # manual off is being respected, dismissed at the next phase boundary.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ enable_notifications
                 and phase in ['PRECOOL', 'BEDTIME_LOCK', 'NIGHT_HOLD']
                 and (manual_setpoint or manual_off) }}
        sequence:
          - service: persistent_notification.create
            data:
              title: "Bedroom Pre-Cool — Manual Override"
              message: >
                {% if manual_off %}
                {{ ac_climate }} went off inside the pre-cool window; the
                blueprint treats that as a manual off and leaves it off tonight
                (no bedtime lock, no deep-night check). If nobody switched it
                off (a cloud outage that came back reads the same way), switch
                it on by hand — a running unit resumes the pre-cool at once.
                {% elif phase == 'NIGHT_HOLD' %}
                {{ ac_climate }} holds a setpoint of {{ current_setpoint }}°C
                that the blueprint did not set. It is respected until the
                deep-night check at {{ deep_tod }}, which may correct drift.
                {% elif phase == 'BEDTIME_LOCK' %}
                {{ ac_climate }} holds a setpoint of {{ current_setpoint }}°C
                that the blueprint did not set; the bedtime lock is re-applying
                {{ maintaining_setpoint }}°C now and tonight's auto-learn update
                is skipped.
                {% else %}
                {{ ac_climate }} holds a setpoint of {{ current_setpoint }}°C
                that the blueprint did not set (its own values are
                {{ known_setpoints }}). It is respected until the bedtime lock
                at {{ lock_tod }}, which re-applies {{ maintaining_setpoint }}°C;
                tonight's auto-learn update is skipped while the override is
                active at the lock.
                {% endif %}
              notification_id: "bedroom_precool_manual_override"
            continue_on_error: true
    default:
      - service: persistent_notification.dismiss
        data:
          notification_id: "bedroom_precool_manual_override"
        continue_on_error: true

  # =============================================
  # STEP 8: DEBUG NOTIFICATION (manual run only)
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id | default('manual') == 'manual' }}"
        sequence:
          - service: persistent_notification.create
            data:
              title: "Bedroom Pre-Cool Debug — {{ now().strftime('%H:%M:%S') }}"
              message: >
                **Phase:** {{ phase }}
                {% if phase == 'PRECOOL' %}({{ precool_substate }}){% endif %}

                **Warmest bedroom:** {{ warmest_bedroom }}°C
                | **Coldest:** {{ coldest_bedroom }}°C
                | **Ideal:** {{ ideal_temp }}°C

                **Humidity (max):** {{ room_humidity }}%
                | **Outdoor now:** {{ outdoor_now }}°C (ok={{ outdoor_now_ok }})

                **ΔT indoor:** {{ delta_in }}°C
                | **ΔT outdoor:** {{ delta_out }}°C
                | **forecast_max:** {{ forecast_max }}°C
                | **daily high:** {{ forecast_daily_high }}°C (ok={{ forecast_daily_ok }})

                **Solar load:** {{ solar_load }}
                (elev {{ sun_elevation }}°, azim {{ sun_azimuth }}°)

                **lead_bias:** {{ lead_bias }} min
                (configured={{ lead_bias_configured }})
                | **helper range:** {{ bias_helper_min }}…{{ bias_helper_max }}
                (ok={{ bias_helper_range_ok }})

                **lead:** {{ lead }} min
                | **turn_on:** {{ turn_on_ts | float | timestamp_custom('%H:%M') }}
                | **bedtime:** {{ bedtime_ts | float | timestamp_custom('%H:%M') }}
                | **earliest turn_on:** {{ earliest_turn_on_tod }}

                **cooling_needed:** {{ cooling_needed }}

                **AC:** mode={{ current_hvac_mode }},
                running={{ ac_is_running }},
                setpoint={{ current_setpoint }}°C (known={{ current_setpoint_known }}),
                fan={{ current_fan }}

                **AC limits:** min={{ ac_min_temp }}°C, max={{ ac_max_temp }}°C

                **manual:** setpoint={{ manual_setpoint }}
                (known {{ known_setpoints }}), off={{ manual_off }}

                **maintaining_setpoint:** {{ maintaining_setpoint }}°C
                | **effective_drive:** {{ effective_drive }}°C

                **desired_mode:** {{ desired_mode }}
                | **night fan:** {{ night_fan_mode }}
                | **vacation:** {{ vacation_active }}

                **night_mode:** {{ night_mode }} (fan_only={{ fan_only_mode }})
                | **bedtime_target:** {{ bedtime_target }}°C
                | **guard_due:** {{ guard_due }} · settle={{ guard_settle_due }}

                **night_parity:** {{ night_parity }}
                | fan_assist tonight={{ fan_assist_tonight }} · night fans tonight={{ night_fans_tonight }}
                | interlock blocked={{ interlock_blocked }}

                **fans due:** precool={{ fans_due_precool }} · night={{ fans_due_night }}
                · unset={{ fans_unset_night }} · wake-off={{ fans_on_at_wake }}
              notification_id: "bedroom_precool_debug"
