blueprint:
  name: "Adjacent Room Circadian Lights v2.1.0"
  description: >
    **Version: 2.1.0 - Re-check on every trigger (RFC 2026-11-26)**

    Motion-triggered circadian lighting for adjacent rooms (hallway, bathroom, etc.)
    that matches the Living Room color temperature exactly for seamless room-to-room transitions.

    List one or more motion sensors: any sensor on turns the lights on; dim/off stages
    follow how long every listed sensor has been clear.

    **Features:**
    - **Identical Circadian Formula:** Same time profiles and sun elevation calculation as the Living Room blueprint.
    - **Re-check:** Every trigger, HA start, reload and a 5-min tick recompute the room; the tick never turns lights on.
    - **Staged Turn-Off:** warning, dim, off by how long the room has been empty.
    - **Optional Lux Sensor:** daylight off above lux_off_threshold held lux_off_duration, back on
      below lux_on_threshold held lux_on_duration with motion. No sensor: lights always respond to motion.
    - **Dead or missing sensors count as clear;** a persistent notification names them.
    - **Manual changes:** lights changed by hand are left alone until the next profile start; with
      auto_off_helper, lights switched off by hand stay off until the room was empty.
    - **Manual Override:** Pause automation via a Switch or Input Boolean.

    **Designed for:** Philips Hue Ambiance Panel (tunable white) + Aqara PIR motion sensor.

  domain: automation
  input:
    # --- DEVICES ---
    target_lights:
      name: Target Lights
      description: Select the light entities for this room.
      selector:
        entity:
          domain: light
          multiple: true
    motion_sensors:
      name: Motion Sensors
      description: Select one or more motion or occupancy sensors (binary_sensor) for this room.
      selector:
        entity:
          domain: binary_sensor
          device_class: [motion, occupancy]
          multiple: true
    illuminance_entity:
      name: Lux Sensor (Optional)
      description: "Optional: Select a lux sensor. Leave empty to always turn on with motion."
      default: []
      selector:
        entity:
          domain: sensor
          device_class: illuminance
    override_entity:
      name: Manual Override Switch
      description: "If ON, automation pauses. Use a Helper (Input Boolean) toggled by your Remote."
      default: []
      selector:
        entity:
          domain:
            - input_boolean
            - switch
    auto_off_helper:
      name: Auto-Off Memory (Input Boolean)
      description: >-
        Optional input_boolean the automation switches on when IT turns the lights off. Lights that
        are off while it is off were switched off by hand and stay off until someone enters a room
        that had been empty for the off time. Leave empty to disable manual-off protection.
      default: []
      selector:
        entity:
          domain: input_boolean

    # --- LUX THRESHOLDS ---
    lux_on_threshold:
      name: Turn On Threshold
      description: "Lights turn ON if Lux drops below this (Default: 150)."
      default: 150
      selector:
        number:
          min: 0
          max: 1000
          unit_of_measurement: lx
    lux_off_threshold:
      name: Turn Off Threshold (Daylight Harvesting)
      description: "Lights turn OFF if Lux stays above this (Default: 400)."
      default: 400
      selector:
        number:
          min: 100
          max: 2000
          unit_of_measurement: lx
    lux_off_duration:
      name: Turn Off Duration (Anti-Flicker)
      description: "How long Lux must be high before turning off (Anti-Flicker)."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min
    lux_on_duration:
      name: Turn On Duration (Anti-Flicker)
      description: "How long Lux must be low before daylight-off lights come back on with motion."
      default: 5
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: min

    # --- STAGED TURN-OFF TIMING ---
    time_to_stage1:
      name: Minutes to First Warning
      description: "Minutes after motion clears before dimming to Stage 1. Must be less than Stage 2."
      default: 5
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min
    time_to_stage2:
      name: Minutes to Second Warning
      description: "Minutes after motion clears before dimming to Stage 2. Must be between Stage 1 and Turn Off."
      default: 10
      selector:
        number:
          min: 2
          max: 45
          unit_of_measurement: min
    time_to_off:
      name: Minutes to Turn Off
      description: "Minutes after motion clears before turning off. Must be greater than Stage 2."
      default: 15
      selector:
        number:
          min: 3
          max: 60
          unit_of_measurement: min
    stage_1_brightness:
      name: Stage 1 Warning Brightness (%)
      description: "Brightness for the first warning dim."
      default: 40
      selector:
        number:
          min: 10
          max: 60
          unit_of_measurement: "%"
    stage_2_brightness:
      name: Stage 2 Warning Brightness (%)
      description: "Brightness for the second warning dim."
      default: 20
      selector:
        number:
          min: 5
          max: 40
          unit_of_measurement: "%"
    warning_kelvin:
      name: Warning Color Temp (K)
      description: "Color temperature during warning stages."
      default: 2000
      selector:
        number:
          min: 2000
          max: 2500
          step: 100
          unit_of_measurement: K

    # --- DINNER PROFILE ---
    time_dinner:
      name: Dinner Start Time
      default: "18:00:00"
      selector:
        time:
    dinner_kelvin:
      name: Dinner Color (K)
      default: 3000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    dinner_bri:
      name: Dinner Brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- TODDLER PROFILE ---
    time_toddler:
      name: Toddler Prep Start Time
      default: "19:00:00"
      selector:
        time:
    toddler_kelvin:
      name: Toddler Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    toddler_bri:
      name: Toddler Brightness (%)
      default: 60
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- EVENING PROFILE ---
    time_evening:
      name: Evening Start Time
      default: "20:00:00"
      selector:
        time:
    evening_kelvin:
      name: Evening Color (K)
      default: 2700
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    evening_bri:
      name: Evening Brightness (%)
      default: 50
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- NIGHT PROFILE ---
    time_night:
      name: Night Start Time
      default: "22:00:00"
      selector:
        time:
    night_kelvin:
      name: Night Color (K)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    night_bri:
      name: Night Brightness (%)
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    # --- GENERAL LIGHT SETTINGS ---
    max_kelvin:
      name: Max Kelvin (Daylight)
      description: Used for Day Mode calculation.
      default: 4500
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K
    min_kelvin:
      name: Min Kelvin (Warm)
      description: Used for Day Mode calculation.
      default: 2200
      selector:
        number:
          min: 2000
          max: 4000
          step: 100
          unit_of_measurement: K

mode: restart
max_exceeded: silent

trigger_variables:
  t_lux: !input illuminance_entity
  t_on: !input lux_on_threshold
  t_off: !input lux_off_threshold

trigger:
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    id: "motion_on"

  # Stage wake-ups; the decision re-checks every sensor.
  - platform: state
    entity_id: !input motion_sensors
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: !input time_to_stage1
    id: "stage_1"
  - platform: state
    entity_id: !input motion_sensors
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: !input time_to_stage2
    id: "stage_2"
  - platform: state
    entity_id: !input motion_sensors
    to: ["off", "unavailable", "unknown"]
    for:
      minutes: !input time_to_off
    id: "stage_off"

  # Re-check: circadian shift, missed timers and missed lux crossings. Never turns lights on.
  - platform: time_pattern
    minutes: "/5"
    id: "update_loop"
  - platform: homeassistant
    event: start
    id: "ha_start"
  - platform: event
    event_type: automation_reloaded
    id: "reload"
  - platform: state
    entity_id: !input override_entity
    to: "off"
    id: "override_resume"

  # Daylight harvesting; template triggers because the lux sensor is optional.
  - platform: template
    value_template: >
      {% set v = states(t_lux) | float(none) if (t_lux is string and t_lux | length > 0) else none %}
      {{ v is number and v > t_off | float(0) }}
    for:
      minutes: !input lux_off_duration
    id: "lux_high"
  - platform: template
    value_template: >
      {% set v = states(t_lux) | float(none) if (t_lux is string and t_lux | length > 0) else none %}
      {{ v is number and v < t_on | float(0) }}
    for:
      minutes: !input lux_on_duration
    id: "lux_low"

  # Profile starts re-apply colour and brightness even to lights changed by hand.
  - platform: time
    at: "06:00:00"
    id: "profile_day"
  - platform: time
    at: !input time_dinner
    id: "profile_dinner"
  - platform: time
    at: !input time_toddler
    id: "profile_toddler"
  - platform: time
    at: !input time_evening
    id: "profile_evening"
  - platform: time
    at: !input time_night
    id: "profile_night"

  # Dead sensor for 30 min: re-check (it counts as clear) and raise a notification.
  - platform: state
    entity_id: !input motion_sensors
    to: "unavailable"
    for:
      minutes: 30
    id: "sensor_watchdog"
  - platform: state
    entity_id: !input motion_sensors
    to: "unknown"
    for:
      minutes: 30
    id: "sensor_watchdog"

variables:
  # Inputs
  light_list: !input target_lights
  sensor_motion: !input motion_sensors
  mins_stage1: !input time_to_stage1
  mins_stage2: !input time_to_stage2
  mins_off: !input time_to_off
  sensor_lux: !input illuminance_entity
  entity_override: !input override_entity
  auto_off_helper: !input auto_off_helper
  threshold_on: !input lux_on_threshold
  threshold_off: !input lux_off_threshold
  lux_off_mins: !input lux_off_duration
  val_max_k: !input max_kelvin
  val_min_k: !input min_kelvin
  val_warn_k: !input warning_kelvin
  b_stage1: !input stage_1_brightness
  b_stage2: !input stage_2_brightness

  # Lux sensor enabled flag
  lux_enabled: "{{ sensor_lux not in [[], none, ''] }}"

  # Time Slots
  t_dinner: !input time_dinner
  t_toddler: !input time_toddler
  t_evening: !input time_evening
  t_night: !input time_night

  # Profile Settings
  k_dinner: !input dinner_kelvin
  b_dinner: !input dinner_bri
  k_toddler: !input toddler_kelvin
  b_toddler: !input toddler_bri
  k_evening: !input evening_kelvin
  b_evening: !input evening_bri
  k_night: !input night_kelvin
  b_night: !input night_bri

action:
  # 1. Check Override First
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ entity_override != [] and is_state(entity_override, 'on') }}"
        sequence:
          - stop: "Manual Override is ON. Automation halted."

  # 2. Recompute the room from current state (same rules as circadian_livingroom.yaml).
  - variables:
      current_lux: "{{ states(sensor_lux) | float(none) if lux_enabled else none }}"
      lux_age: >
        {% set st = states[sensor_lux] if lux_enabled else none %}
        {% if st is not none and st.last_changed is defined and st.last_changed is not none %}{{ (as_timestamp(now()) - as_timestamp(st.last_changed)) | round(0) }}{% else %}{{ none }}{% endif %}
      missing_sensors: >
        {% set ns = namespace(m=[]) %}
        {% for s in sensor_motion %}{% if states[s] is none %}{% set ns.m = ns.m + [s] %}{% endif %}{% endfor %}
        {{ ns.m }}
      is_motion_on: >
        {% set ns = namespace(v=false) %}
        {% for s in sensor_motion %}{% if is_state(s, 'on') %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ ns.v }}
      # Seconds every sensor has been clear; a missing sensor is skipped, a dead one counts as clear.
      empty_age: >
        {% set ns = namespace(a=1000000000) %}
        {% for s in sensor_motion %}
          {% set st = states[s] %}
          {% if st is not none %}
            {% set lc = st.last_changed if st.last_changed is defined else none %}
            {% if st.state in ['off', 'unavailable', 'unknown'] and lc is not none %}
              {% set ns.a = [ns.a, as_timestamp(now()) - as_timestamp(lc)] | min %}
            {% else %}{% set ns.a = 0 %}{% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.a }}
      lights_on: >
        {% set ns = namespace(v=false) %}
        {% for l in light_list %}{% if is_state(l, 'on') %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ ns.v }}
      # Off by hand: the helper was not set by our own off, or a light changed > 30 s after it.
      manual_off: >
        {% set h = states[auto_off_helper] if auto_off_helper is string and auto_off_helper | length > 0 else none %}
        {% if h is none or lights_on %}{{ false }}
        {% elif h.state != 'on' %}{{ true }}
        {% else %}
          {% set ns = namespace(t=0) %}
          {% for l in light_list %}
            {% set st = states[l] %}
            {% if st is not none and st.last_changed is defined and st.last_changed is not none %}
              {% set ns.t = [ns.t, as_timestamp(st.last_changed)] | max %}
            {% endif %}
          {% endfor %}
          {{ ns.t > as_timestamp(h.last_changed) + 30 }}
        {% endif %}
      # A motion_on after a manual off relights only when the room had been empty for the off time.
      was_empty: >
        {% if trigger.id | default('') != 'motion_on' %}{{ false }}
        {% else %}
          {% set me = trigger.entity_id | default('') %}
          {% set fs = trigger.from_state | default(none) %}
          {% set ns = namespace(a=1000000000) %}
          {% for s in sensor_motion %}
            {% if s == me %}
              {% if fs is not none and fs.state in ['off', 'unavailable', 'unknown']
                    and fs.last_changed is defined and fs.last_changed is not none %}
                {% set age = as_timestamp(now()) - as_timestamp(fs.last_changed) %}
              {% else %}{% set age = 0 %}{% endif %}
            {% else %}
              {% set st = states[s] %}
              {% if st is none %}{% set age = 1000000000 %}
              {% elif st.state in ['off', 'unavailable', 'unknown'] and st.last_changed is defined and st.last_changed is not none %}
                {% set age = as_timestamp(now()) - as_timestamp(st.last_changed) %}
              {% else %}{% set age = 0 %}{% endif %}
            {% endif %}
            {% set ns.a = [ns.a, age] | min %}
          {% endfor %}
          {{ ns.a >= mins_off | float(0) * 60 }}
        {% endif %}
      # HA drops `for:` timers on restart/reload, so start and reload act on the reading at once.
      bright: >
        {{ current_lux is number and current_lux > threshold_off | float(0)
           and (trigger.id | default('') in ['lux_high', 'ha_start', 'reload']
                or (lux_age is number and lux_age >= lux_off_mins | float(0) * 60)) }}
      decision: >
        {% set tid = trigger.id | default('') %}
        {% set dark = current_lux is not number or current_lux < threshold_on | float(0) %}
        {% if lights_on and empty_age >= mins_off | float(0) * 60 %}off
        {% elif lights_on and bright %}off
        {% elif lights_on and empty_age >= mins_stage2 | float(0) * 60 %}stage_2
        {% elif lights_on and empty_age >= mins_stage1 | float(0) * 60 %}stage_1
        {% elif not lights_on and is_motion_on and dark
              and ((tid == 'motion_on' and (was_empty or not manual_off))
                   or (tid in ['lux_low', 'ha_start', 'reload'] and not manual_off)
                   or tid == 'override_resume') %}on
        {% elif lights_on and is_motion_on and tid in ['motion_on', 'override_resume'] %}update
        {% elif lights_on and (tid in ['update_loop', 'ha_start', 'reload'] or tid.startswith('profile_')) %}update
        {% else %}none{% endif %}

      # Determine Current Mode based on Time
      mode: >
        {% set t_now = now().strftime('%H:%M:%S') %}
        {% if t_now >= t_night %} night
        {% elif t_now >= t_evening %} evening
        {% elif t_now >= t_toddler %} toddler
        {% elif t_now >= t_dinner %} dinner
        {% elif t_now >= '06:00:00' %} day
        {% else %} night {% endif %}

      # Target Kelvin (Base) — IDENTICAL formula to circadian_livingroom.yaml
      target_kelvin: >
        {% if mode == 'dinner' %} {{ k_dinner | int }}
        {% elif mode == 'toddler' %} {{ k_toddler | int }}
        {% elif mode == 'evening' %} {{ k_evening | int }}
        {% elif mode == 'night' %} {{ k_night | int }}
        {% else %}
          {# Day Mode: Use Sun Elevation #}
          {% set elev = state_attr('sun.sun', 'elevation') | float(0) %}
          {% set pct = (elev + 6) / 51 %}
          {% set k = (val_max_k - val_min_k) * pct + val_min_k %}
          {{ [val_min_k, [val_max_k, k] | min] | max | int }}
        {% endif %}

      target_brightness: >
        {% if mode == 'dinner' %} {{ b_dinner | int }}
        {% elif mode == 'toddler' %} {{ b_toddler | int }}
        {% elif mode == 'evening' %} {{ b_evening | int }}
        {% elif mode == 'night' %} {{ b_night | int }}
        {% else %} 100 {% endif %}

      # Lit lights the update may touch: within 5 % / 150 K of the target or of a warning stage,
      # in colour-temperature mode. Others were changed by hand until the next profile start.
      force_update: "{{ (trigger.id | default('')).startswith('profile_') }}"
      lit_lights: >
        {% set ns = namespace(l=[]) %}
        {% for l in light_list %}{% if is_state(l, 'on') %}{% set ns.l = ns.l + [l] %}{% endif %}{% endfor %}
        {{ ns.l }}
      update_lights: >
        {% set ns = namespace(l=[]) %}
        {% for l in lit_lights %}
          {% set a = states[l].attributes %}
          {% set pct = (a.get('brightness') | float(0)) / 2.55 %}
          {% set k = a.get('color_temp_kelvin') %}
          {% set ours_target = (pct - target_brightness | float(0)) | abs <= 5
                               and (k is none or (k | float(0) - target_kelvin | float(0)) | abs <= 150) %}
          {% set ours_stage = ((pct - b_stage1 | float(0)) | abs <= 5 or (pct - b_stage2 | float(0)) | abs <= 5)
                              and (k is none or (k | float(0) - val_warn_k | float(0)) | abs <= 150) %}
          {% set mode_ok = a.get('color_mode') in [none, 'color_temp', 'brightness', 'onoff'] %}
          {% if force_update or ((ours_target or ours_stage) and mode_ok) %}{% set ns.l = ns.l + [l] %}{% endif %}
        {% endfor %}
        {{ ns.l }}

  # 3. Apply the decision.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ decision == 'off' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ auto_off_helper is string and auto_off_helper | length > 0 }}"
            then:
              - service: input_boolean.turn_on
                target:
                  entity_id: "{{ auto_off_helper }}"
          - service: light.turn_off
            target:
              entity_id: "{{ light_list }}"
            data:
              transition: 5

      - conditions:
          - condition: template
            value_template: "{{ decision == 'stage_1' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ auto_off_helper is string and auto_off_helper | length > 0 and is_state(auto_off_helper, 'on') }}"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ auto_off_helper }}"
          - service: light.turn_on
            target:
              entity_id: "{{ lit_lights }}"
            data:
              color_temp_kelvin: "{{ val_warn_k | int }}"
              brightness_pct: "{{ b_stage1 | int }}"
              transition: 3

      - conditions:
          - condition: template
            value_template: "{{ decision == 'stage_2' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ auto_off_helper is string and auto_off_helper | length > 0 and is_state(auto_off_helper, 'on') }}"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ auto_off_helper }}"
          - service: light.turn_on
            target:
              entity_id: "{{ lit_lights }}"
            data:
              color_temp_kelvin: "{{ val_warn_k | int }}"
              brightness_pct: "{{ b_stage2 | int }}"
              transition: 3

      - conditions:
          - condition: template
            value_template: "{{ decision == 'on' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ light_list != [] }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ light_list }}"
                data:
                  color_temp_kelvin: "{{ target_kelvin | int }}"
                  brightness_pct: "{{ target_brightness | int }}"
                  transition: 2
          # Cleared only after the lights are on: a restart in between must not look like a manual off.
          - if:
              - condition: template
                value_template: "{{ auto_off_helper is string and auto_off_helper | length > 0 and is_state(auto_off_helper, 'on') }}"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ auto_off_helper }}"

      - conditions:
          - condition: template
            value_template: "{{ decision == 'update' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ auto_off_helper is string and auto_off_helper | length > 0 and is_state(auto_off_helper, 'on') }}"
            then:
              - service: input_boolean.turn_off
                target:
                  entity_id: "{{ auto_off_helper }}"
          - if:
              - condition: template
                value_template: "{{ update_lights | count > 0 }}"
            then:
              - service: light.turn_on
                target:
                  entity_id: "{{ update_lights }}"
                data:
                  color_temp_kelvin: "{{ target_kelvin | int }}"
                  brightness_pct: "{{ target_brightness | int }}"
                  transition: 30

  # 4. Dead or missing sensors: one persistent notification per instance (D14).
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id | default('') == 'sensor_watchdog'
                 or (trigger.id | default('') == 'update_loop' and now().minute == 0 and missing_sensors | count > 0) }}
        sequence:
          - service: persistent_notification.create
            data:
              notification_id: "adjacent_lights_{{ this.entity_id | replace('.', '_') }}"
              title: "Adjacent room lights - motion sensor offline"
              message: >-
                {% if trigger.id | default('') == 'sensor_watchdog' %}
                {{ trigger.entity_id | default(sensor_motion | join(', ')) }} has been unavailable or unknown for 30 min.
                It counts as clear, so the other sensors decide.
                {% else %}
                {{ missing_sensors | join(', ') }} missing in Home Assistant (renamed or removed?).
                The lights ignore it until the automation instance is updated.
                {% endif %}
