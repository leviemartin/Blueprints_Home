blueprint:
  name: "LG AC Climate Control v1.2.0"
  description: >
    **Version: 1.2.0**

    Automates LG air conditioners per-floor using external temperature sensors
    for reliable ambient readings.

    **Features:**
    - **Automatic Mode Selection:** Heats, cools, or turns off based on a
      configurable comfort range.
    - **Outdoor-Aware Deadband:** Disables deadband in extreme weather to
      prevent energy-wasting on/off cycling.
    - **Proportional Fan + Escalation:** Fan speed scales with distance from
      target, with time-based escalation if the target isn't reached.
    - **Per-Day Schedule:** Independent start/end times for each day of the week.
    - **Vacation Mode:** Toggle to force AC fully off.
    - **Door Sensor:** Auto-off when garden door is left open.
    - **Beep-Silent Control:** Commands are sent only when they change
      something — steady state sends nothing (LG units beep per command).
    - **Deep Hysteresis (v1.2.0):** While actively heating/cooling, the
      setpoint aims max(device step, 0.5 °C) past the comfort-range release
      point, so the room sensors — not the unit's internal one — decide when
      the target is reached and the unit genuinely turns OFF. The off/on
      transitions beep by design (silence-over-beeps trade); steady state
      stays command-free. If the device's setpoint grid or limits leave no
      valid deep setpoint, that mode falls back to v1.1.0 boundary idling
      and a persistent notification is raised.
    - **Manual-Override Hold:** Optional input_text helper detects remote/app
      changes and pauses comfort control for a configurable window (vacation,
      schedule end, and door-open still force off). Reloading any automation
      clears active holds on all instances and reasserts control once.
    - **Fail-Safe Degradation:** Weather outage falls back to normal cycling;
      silently-stale sensors are excluded.

    **Requirements:**
    - LG AC connected via SmartThinQ or LG ThinQ integration
    - External temperature sensor(s) (e.g., Aqara)
    - Weather entity for outdoor temperature (e.g., Met.no)
    - input_boolean helper for vacation mode
    - input_text helper (optional) for manual-override hold

  domain: automation
  homeassistant:
    min_version: "2024.8.0"
  input:
    # --- DEVICES ---
    climate_entity:
      name: LG AC Climate Entity
      description: The climate entity for your LG air conditioner.
      selector:
        entity:
          domain: climate
    temperature_sensors:
      name: Temperature Sensors
      description: One or more Aqara (or other) temperature sensors for this floor.
      selector:
        entity:
          domain: sensor
          device_class: temperature
          multiple: true
    sensor_strategy:
      name: Sensor Aggregation Strategy
      description: "How to combine multiple sensor readings: average, min, or max."
      default: "average"
      selector:
        select:
          options:
            - label: "Average"
              value: "average"
            - label: "Minimum"
              value: "min"
            - label: "Maximum"
              value: "max"
    weather_entity:
      name: Weather Entity
      description: "Weather entity for outdoor temperature (e.g., weather.home from Met.no)."
      selector:
        entity:
          domain: weather
    door_sensor:
      name: Door Sensor (Optional)
      description: Garden/balcony door contact sensor(s). AC turns off when door is left open.
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    # --- COMFORT RANGE ---
    temp_range_low:
      name: Comfort Range — Low (°C)
      description: Lower bound of comfort range. AC heats if room drops below this.
      default: 20.0
      selector:
        number:
          min: 10.0
          max: 30.0
          step: 0.5
          unit_of_measurement: "°C"
    temp_range_high:
      name: Comfort Range — High (°C)
      description: Upper bound of comfort range. AC cools if room rises above this.
      default: 24.0
      selector:
        number:
          min: 10.0
          max: 30.0
          step: 0.5
          unit_of_measurement: "°C"
    deadband_outdoor_threshold:
      name: Deadband Outdoor Threshold (°C)
      description: "If outdoor temp is this far from the comfort range, deadband is disabled and AC holds in maintenance mode instead of cycling."
      default: 10.0
      selector:
        number:
          min: 0.0
          max: 25.0
          step: 0.5
          unit_of_measurement: "°C"

    # --- PER-DAY OPERATING SCHEDULE ---
    schedule_start_mon:
      name: "Monday — Start"
      default: "07:00:00"
      selector:
        time:
    schedule_end_mon:
      name: "Monday — End"
      default: "23:00:00"
      selector:
        time:
    schedule_start_tue:
      name: "Tuesday — Start"
      default: "07:00:00"
      selector:
        time:
    schedule_end_tue:
      name: "Tuesday — End"
      default: "23:00:00"
      selector:
        time:
    schedule_start_wed:
      name: "Wednesday — Start"
      default: "07:00:00"
      selector:
        time:
    schedule_end_wed:
      name: "Wednesday — End"
      default: "23:00:00"
      selector:
        time:
    schedule_start_thu:
      name: "Thursday — Start"
      default: "07:00:00"
      selector:
        time:
    schedule_end_thu:
      name: "Thursday — End"
      default: "23:00:00"
      selector:
        time:
    schedule_start_fri:
      name: "Friday — Start"
      default: "07:00:00"
      selector:
        time:
    schedule_end_fri:
      name: "Friday — End"
      default: "23:00:00"
      selector:
        time:
    schedule_start_sat:
      name: "Saturday — Start"
      default: "07:00:00"
      selector:
        time:
    schedule_end_sat:
      name: "Saturday — End"
      default: "23:00:00"
      selector:
        time:
    schedule_start_sun:
      name: "Sunday — Start"
      default: "07:00:00"
      selector:
        time:
    schedule_end_sun:
      name: "Sunday — End"
      default: "23:00:00"
      selector:
        time:

    # --- VACATION MODE ---
    vacation_toggle:
      name: Vacation Mode Toggle
      description: "An input_boolean helper. When ON, AC is forced fully off."
      selector:
        entity:
          domain: input_boolean

    # --- FAN SPEED & ESCALATION ---
    fan_speed_low_threshold:
      name: Fan Low Threshold (°C)
      description: "Distance from target below which fan = low."
      default: 1.0
      selector:
        number:
          min: 0.5
          max: 5.0
          step: 0.5
          unit_of_measurement: "°C"
    fan_speed_medium_threshold:
      name: Fan Medium Threshold (°C)
      description: "Distance from target for medium fan. Above this = high."
      default: 3.0
      selector:
        number:
          min: 1.0
          max: 10.0
          step: 0.5
          unit_of_measurement: "°C"
    escalation_stage_1_minutes:
      name: Escalation Stage 1 (min)
      description: "Minutes before first fan speed escalation."
      default: 20
      selector:
        number:
          min: 5
          max: 60
          unit_of_measurement: min
    escalation_stage_2_minutes:
      name: Escalation Stage 2 (min)
      description: "Minutes before second fan speed escalation (max speed)."
      default: 40
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: min

    # --- DOOR ---
    door_off_delay:
      name: Door Open Delay (min)
      description: "Minutes to wait after door opens before shutting off AC."
      default: 5
      selector:
        number:
          min: 1
          max: 30
          unit_of_measurement: min

    # --- HYSTERESIS / ROBUSTNESS (v1.1.0) ---
    comfort_margin:
      name: Comfort Margin (°C)
      description: "Hysteresis release depth: an actively heating/cooling AC continues until the room is this far inside the comfort range, then turns OFF. The commanded setpoint aims max(device step, 0.5 °C) past this release so the room sensors decide, not the unit's own. 0 approximates v1.0.0 cycling behavior."
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 2.0
          step: 0.1
          unit_of_measurement: "°C"
    sensor_staleness_minutes:
      name: Sensor Staleness Cutoff (min)
      description: "Ignore temperature sensors whose last report is older than this. Must exceed the sensors' periodic report interval (Aqara ≈ 60 min)."
      default: 90
      selector:
        number:
          min: 15
          max: 1440
          step: 5
          unit_of_measurement: min

    # --- MANUAL OVERRIDE HOLD (v1.1.0, optional) ---
    manual_hold_helper:
      name: Manual Override State Helper (Optional)
      description: "An input_text helper storing the last automation-commanded state. When set, manual remote/app changes pause comfort control for the hold duration. Leave empty to disable. Create the helper with max length 255. Create a DEDICATED helper per automation instance — sharing one helper between two ACs breaks both."
      default: ""
      selector:
        entity:
          domain: input_text
    manual_hold_minutes:
      name: Manual Hold Duration (min)
      description: "How long comfort control pauses after a manual change is detected."
      default: 60
      selector:
        number:
          min: 15
          max: 360
          step: 5
          unit_of_measurement: min

mode: restart
max_exceeded: silent

trigger:
  # 1. Main Control Loop (every 10 minutes)
  - platform: time_pattern
    minutes: "/10"
    id: "update_loop"

  # 2. Vacation Mode ON
  - platform: state
    entity_id: !input vacation_toggle
    to: "on"
    id: "vacation_on"

  # 3. HA Restart
  - platform: homeassistant
    event: start
    id: "init"

  # 4. Door left open (exact-time shut-off)
  - platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      minutes: !input door_off_delay
    id: "door_open"

  # 5. Vacation Mode OFF (instant resume)
  - platform: state
    entity_id: !input vacation_toggle
    to: "off"
    id: "vacation_off"

  # 6. Automation reload (same seed semantics as HA start — board R2-2)
  - platform: event
    event_type: automation_reloaded
    id: "init"

variables:
  # --- Entity Mappings ---
  climate_ac: !input climate_entity
  sensors_temp: !input temperature_sensors
  strategy: !input sensor_strategy
  entity_weather: !input weather_entity
  sensor_door: !input door_sensor
  entity_vacation: !input vacation_toggle

  # --- Comfort ---
  temp_low: !input temp_range_low
  temp_high: !input temp_range_high
  deadband_thresh: !input deadband_outdoor_threshold

  # --- Schedule (Start/End per day) ---
  t_start_mon: !input schedule_start_mon
  t_end_mon: !input schedule_end_mon
  t_start_tue: !input schedule_start_tue
  t_end_tue: !input schedule_end_tue
  t_start_wed: !input schedule_start_wed
  t_end_wed: !input schedule_end_wed
  t_start_thu: !input schedule_start_thu
  t_end_thu: !input schedule_end_thu
  t_start_fri: !input schedule_start_fri
  t_end_fri: !input schedule_end_fri
  t_start_sat: !input schedule_start_sat
  t_end_sat: !input schedule_end_sat
  t_start_sun: !input schedule_start_sun
  t_end_sun: !input schedule_end_sun

  # --- Fan ---
  fan_low_thresh: !input fan_speed_low_threshold
  fan_med_thresh: !input fan_speed_medium_threshold
  esc_stage_1: !input escalation_stage_1_minutes
  esc_stage_2: !input escalation_stage_2_minutes

  # --- Door ---
  door_delay: !input door_off_delay

  # --- Hysteresis / Robustness (v1.1.0) ---
  margin: !input comfort_margin
  sensor_staleness: !input sensor_staleness_minutes
  hold_helper: !input manual_hold_helper
  hold_minutes: !input manual_hold_minutes

action:
  # =============================================
  # STEP 1: COMPUTE VARIABLES
  # =============================================
  - variables:
      # --- Sensor Aggregation ---
      valid_temps: >
        {% set ns = namespace(vals=[]) %}
        {% set cutoff = sensor_staleness | int * 60 %}
        {% for s in sensors_temp %}
          {% set v = states(s) %}
          {% if v not in ['unavailable', 'unknown', none] and v | float(none) is not none
                and states[s] is not none
                and (as_timestamp(now()) - as_timestamp(states[s].last_reported)) < cutoff %}
            {% set ns.vals = ns.vals + [v | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.vals }}
      sensors_available: "{{ valid_temps | length > 0 }}"
      current_temp: >
        {% if valid_temps | length == 0 %}
          {{ 0 }}
        {% elif strategy == 'min' %}
          {{ valid_temps | min }}
        {% elif strategy == 'max' %}
          {{ valid_temps | max }}
        {% else %}
          {{ ((valid_temps | sum) / (valid_temps | length)) | round(1) }}
        {% endif %}

      # --- Outdoor (from weather entity) ---
      outdoor_temp_raw: "{{ state_attr(entity_weather, 'temperature') }}"
      weather_ok: "{{ outdoor_temp_raw is not none and outdoor_temp_raw | float(none) is not none }}"
      outdoor_temp: "{{ outdoor_temp_raw | float(0) if weather_ok else 0 }}"

      # --- Vacation ---
      is_vacation: "{{ is_state(entity_vacation, 'on') }}"

      # --- Door ---
      door_is_open: >
        {% if sensor_door in [[], none, ''] %}
          {{ false }}
        {% else %}
          {% set ns = namespace(open=false) %}
          {% for d in sensor_door %}
            {% if is_state(d, 'on') %}
              {% set opened_sec = as_timestamp(now()) - as_timestamp(states[d].last_changed) %}
              {% if opened_sec >= (door_delay | int * 60) %}
                {% set ns.open = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.open }}
        {% endif %}

      # --- Current AC State ---
      current_ac_mode: "{{ states(climate_ac) }}"

      # --- Device setpoint limits (v1.1.0 R1C-1: never command what the unit can't store) ---
      ac_min_temp: "{{ state_attr(climate_ac, 'min_temp') | float(16) }}"
      ac_max_temp: "{{ state_attr(climate_ac, 'max_temp') | float(30) }}"
      ac_temp_step: "{{ [state_attr(climate_ac, 'target_temp_step') | float(0.5), 0.1] | max }}"
      setpoint_cool_q: >-
        {{ ([([(((temp_high | float / ac_temp_step) | round(0, 'floor')) * ac_temp_step), ac_min_temp] | max), ac_max_temp] | min) | round(1) }}
      setpoint_heat_q: >-
        {{ ([([(((temp_low | float / ac_temp_step) | round(0, 'ceil')) * ac_temp_step), ac_min_temp] | max), ac_max_temp] | min) | round(1) }}

      # --- Deep-pull setpoints + feasibility gates (v1.2.0) ---
      # Declaration order is load-bearing: each references the previous.
      deep_pull_depth: "{{ [ac_temp_step, 0.5] | max }}"
      setpoint_cool_active_q: >-
        {% set r = temp_high | float - margin | float %}
        {% set q = ((((r - deep_pull_depth) / ac_temp_step) + 0.001) | round(0, 'floor')) * ac_temp_step %}
        {{ ([([q, ac_min_temp] | max), ac_max_temp] | min) | round(1) }}
      setpoint_heat_active_q: >-
        {% set r = temp_low | float + margin | float %}
        {% set q = ((((r + deep_pull_depth) / ac_temp_step) - 0.001) | round(0, 'floor') + 1) * ac_temp_step %}
        {{ ([([q, ac_max_temp] | min), ac_min_temp] | max) | round(1) }}
      cool_deep_ok: >-
        {{ (setpoint_cool_active_q | float | round(2)) <= ((temp_high | float - margin | float - deep_pull_depth) | round(2))
           and (setpoint_cool_active_q | float | round(2)) > (temp_low | float | round(2)) }}
      heat_deep_ok: >-
        {{ (setpoint_heat_active_q | float | round(2)) >= ((temp_low | float + margin | float + deep_pull_depth) | round(2))
           and (setpoint_heat_active_q | float | round(2)) < (temp_high | float | round(2)) }}

      # --- Per-Day Schedule ---
      schedule_start_today: >
        {{ [t_start_mon, t_start_tue, t_start_wed, t_start_thu, t_start_fri, t_start_sat, t_start_sun][now().weekday()] }}
      schedule_end_today: >
        {{ [t_end_mon, t_end_tue, t_end_wed, t_end_thu, t_end_fri, t_end_sat, t_end_sun][now().weekday()] }}
      schedule_start_yesterday: >
        {{ [t_start_mon, t_start_tue, t_start_wed, t_start_thu, t_start_fri, t_start_sat, t_start_sun][(now().weekday() - 1) % 7] }}
      schedule_end_yesterday: >
        {{ [t_end_mon, t_end_tue, t_end_wed, t_end_thu, t_end_fri, t_end_sat, t_end_sun][(now().weekday() - 1) % 7] }}
      in_operating_window: >
        {% set t_now = now().strftime('%H:%M:%S') %}
        {% set today = (schedule_start_today <= t_now < schedule_end_today)
              if schedule_start_today <= schedule_end_today
              else (t_now >= schedule_start_today) %}
        {% set y_tail = schedule_start_yesterday > schedule_end_yesterday
              and t_now < schedule_end_yesterday %}
        {{ today or y_tail }}

      # --- Target Mode & Distance ---
      target_mode: >
        {% if current_temp | float > temp_high | float %}
          cool
        {% elif current_temp | float < temp_low | float %}
          heat
        {% elif current_ac_mode == 'cool' and current_temp | float > (temp_high | float - margin | float) %}
          cool
        {% elif current_ac_mode == 'heat' and current_temp | float < (temp_low | float + margin | float) %}
          heat
        {% else %}
          off
        {% endif %}
      distance_from_target: >
        {% if current_temp | float > temp_high | float %}
          {{ (current_temp | float - temp_high | float) | round(1) }}
        {% elif current_temp | float < temp_low | float %}
          {{ (temp_low | float - current_temp | float) | round(1) }}
        {% else %}
          {{ 0 }}
        {% endif %}

      # --- Outdoor Distance & Deadband ---
      outdoor_distance: >
        {% set o = outdoor_temp | float %}
        {% set dist_low = (temp_low | float - o) | abs %}
        {% set dist_high = (o - temp_high | float) | abs %}
        {% if o < temp_low | float %}
          {{ dist_low | round(1) }}
        {% elif o > temp_high | float %}
          {{ dist_high | round(1) }}
        {% else %}
          {{ 0 }}
        {% endif %}
      deadband_active: "{{ (not weather_ok) or (outdoor_distance | float < deadband_thresh | float) }}"

      # --- Fan Speed (Proportional) ---
      available_fan_modes: "{{ state_attr(climate_ac, 'fan_modes') | default(['low', 'mid', 'high'], true) }}"
      fan_mode_low: >
        {% set modes = available_fan_modes %}
        {% set ns = namespace(found='') %}
        {% for m in ['Low', 'low', '1'] if m in modes %}
          {% if ns.found == '' %}{% set ns.found = m %}{% endif %}
        {% endfor %}
        {{ ns.found if ns.found != '' else (modes[0] if modes | length > 0 else 'low') }}
      fan_mode_mid: >
        {% set modes = available_fan_modes %}
        {% set ns = namespace(found='') %}
        {% for m in ['Mid', 'Medium', 'mid', 'medium', '2'] if m in modes %}
          {% if ns.found == '' %}{% set ns.found = m %}{% endif %}
        {% endfor %}
        {{ ns.found if ns.found != '' else (modes[1] if modes | length > 1 else fan_mode_low) }}
      fan_mode_high: >
        {% set modes = available_fan_modes %}
        {% set ns = namespace(found='') %}
        {% for m in ['High', 'high', '3'] if m in modes %}
          {% if ns.found == '' %}{% set ns.found = m %}{% endif %}
        {% endfor %}
        {{ ns.found if ns.found != '' else (modes[2] if modes | length > 2 else fan_mode_mid) }}
      fan_mode_max: >
        {% set modes = available_fan_modes %}
        {% set ns = namespace(found='') %}
        {% for m in ['Power', 'Turbo', 'power', 'turbo', '4'] if m in modes %}
          {% if ns.found == '' %}{% set ns.found = m %}{% endif %}
        {% endfor %}
        {{ ns.found if ns.found != '' else fan_mode_high }}

      base_fan: >
        {% set dist = distance_from_target | float %}
        {% if dist < fan_low_thresh | float %}
          {{ fan_mode_low }}
        {% elif dist < fan_med_thresh | float %}
          {{ fan_mode_mid }}
        {% else %}
          {{ fan_mode_high }}
        {% endif %}

      # --- Escalation ---
      minutes_in_current_mode: >
        {% if target_mode != current_ac_mode %}
          0
        {% else %}
          {% set last = as_timestamp(states[climate_ac].last_changed) | default(as_timestamp(now())) %}
          {{ ((as_timestamp(now()) - last) / 60) | round(0) | int }}
        {% endif %}
      target_fan: >
        {% set mins = minutes_in_current_mode | int %}
        {% set dist = distance_from_target | float %}
        {% set fan_levels = [fan_mode_low, fan_mode_mid, fan_mode_high, fan_mode_max] %}
        {% set base_idx = fan_levels.index(base_fan) if base_fan in fan_levels else 0 %}
        {% if dist < fan_low_thresh | float %}
          {{ base_fan }}
        {% elif mins >= esc_stage_2 | int %}
          {{ fan_mode_max }}
        {% elif mins >= esc_stage_1 | int %}
          {{ fan_levels[[base_idx + 1, fan_levels | length - 1] | min] }}
        {% else %}
          {{ base_fan }}
        {% endif %}

      # --- Manual Hold (v1.1.0) ---
      current_setpoint: "{{ state_attr(climate_ac, 'temperature') }}"
      current_fan: "{{ state_attr(climate_ac, 'fan_mode') }}"
      hold_enabled: "{{ hold_helper not in ['', none] }}"
      expected: >
        {% set e = (states(hold_helper) | from_json(default={})) if hold_enabled else {} %}
        {{ e if e is mapping else {} }}
      hold_until: "{{ expected.get('hold_until', 0) | float(0) }}"
      hold_active: >-
        {{ hold_enabled and expected.get('mode') is not none
           and expected.get('mode') not in ['unavailable', 'unknown']
           and hold_until | float(0) > as_timestamp(now())
           and hold_until | float(0) <= as_timestamp(now()) + hold_minutes | int * 60 }}
      manual_detected: >
        {% if not hold_enabled or hold_active or expected.get('mode') is none
              or expected.get('mode') in ['unavailable', 'unknown'] %}
          {{ false }}
        {% elif current_ac_mode != expected.get('mode') %}
          {{ true }}
        {% elif expected.get('mode') != 'off' and expected.get('temp') is not none
              and (current_setpoint | float(-99) - expected.get('temp') | float(-99)) | abs > 0.3 %}
          {{ true }}
        {% elif expected.get('mode') != 'off' and expected.get('fan') is not none
              and current_fan != expected.get('fan') %}
          {{ true }}
        {% else %}
          {{ false }}
        {% endif %}

  # =============================================
  # STEP 2: RUNTIME VALIDATION
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ temp_low | float >= temp_high | float }}"
        sequence:
          - service: persistent_notification.create
            data:
              title: "AC Climate Blueprint — Configuration Error"
              message: >
                Comfort range is misconfigured: Low ({{ temp_low }}°C) must be
                less than High ({{ temp_high }}°C). AC control is paused until
                this is corrected.
              notification_id: "ac_climate_config_error"
          - stop: "Comfort range misconfigured"

      - conditions:
          - condition: template
            value_template: "{{ (margin | float * 2) > (temp_high | float - temp_low | float) }}"
        sequence:
          - service: persistent_notification.create
            data:
              title: "AC Climate Blueprint — Configuration Error"
              message: >
                Comfort margin ({{ margin }}°C) is too large for the comfort
                range ({{ temp_low }}–{{ temp_high }}°C): twice the margin must
                not exceed the range. AC control is paused until corrected.
              notification_id: "ac_climate_config_error"
          - stop: "Comfort margin misconfigured"

  # =============================================
  # STEP 2b: NOTIFICATION HYGIENE
  # =============================================
  - service: persistent_notification.dismiss
    data:
      notification_id: "ac_climate_config_error"
    continue_on_error: true
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ sensors_available }}"
        sequence:
          - service: persistent_notification.dismiss
            data:
              notification_id: "ac_climate_sensor_warning"
            continue_on_error: true
    default:
      - service: persistent_notification.create
        data:
          title: "AC Climate Blueprint — Sensor Warning"
          message: >
            All temperature sensors are unavailable. AC is holding current
            state until sensors recover. Sensors: {{ sensors_temp }}
          notification_id: "ac_climate_sensor_warning"
  # Deep-pull infeasibility signal (v1.2.0) — self-healing, config-static
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ cool_deep_ok and heat_deep_ok }}"
        sequence:
          - service: persistent_notification.dismiss
            data:
              notification_id: "ac_climate_deep_infeasible"
            continue_on_error: true
    default:
      - service: persistent_notification.create
        data:
          title: "AC Climate Blueprint — Deep-pull infeasible"
          message: >
            The comfort range/margin and this AC's setpoint grid (step
            {{ ac_temp_step }}, min {{ ac_min_temp }}, max {{ ac_max_temp }})
            leave no valid deep setpoint for
            {{ 'cooling' if not cool_deep_ok else 'heating' }}.
            That mode falls back to boundary idling (v1.1.0 behavior).
          notification_id: "ac_climate_deep_infeasible"
        continue_on_error: true

  # =============================================
  # STEP 2c: RESTART SEED (no false hold after HA restart)
  # =============================================
  - choose:
      - conditions:
          - condition: trigger
            id: "init"
          - condition: template
            value_template: "{{ hold_enabled }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: "{{ hold_helper }}"
            data:
              value: >
                {{ {'mode': current_ac_mode, 'temp': current_setpoint | float(none),
                    'fan': current_fan, 'hold_until': 0} | to_json }}
            continue_on_error: true

  # =============================================
  # STEP 3: MAIN PRIORITY CHOOSE
  # =============================================
  - choose:
      # --- 4a2: AC ENTITY UNAVAILABLE ---
      - conditions:
          - condition: template
            value_template: "{{ current_ac_mode in ['unavailable', 'unknown'] }}"
        sequence:
          - stop: "AC entity unavailable, retrying next loop"

      # --- 4b: VACATION MODE ---
      - conditions:
          - condition: template
            value_template: "{{ is_vacation }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_ac_mode != 'off' }}"
                sequence:
                  - service: climate.turn_off
                    target:
                      entity_id: "{{ climate_ac }}"
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hold_enabled }}"
                sequence:
                  - service: input_text.set_value
                    target:
                      entity_id: "{{ hold_helper }}"
                    data:
                      value: >
                        {{ {'mode': 'off', 'temp': none, 'fan': none,
                            'hold_until': 0} | to_json }}

      # --- 4c: OUTSIDE OPERATING WINDOW ---
      - conditions:
          - condition: template
            value_template: "{{ not in_operating_window }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_ac_mode != 'off' }}"
                sequence:
                  - service: climate.turn_off
                    target:
                      entity_id: "{{ climate_ac }}"
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hold_enabled }}"
                sequence:
                  - service: input_text.set_value
                    target:
                      entity_id: "{{ hold_helper }}"
                    data:
                      value: >
                        {{ {'mode': 'off', 'temp': none, 'fan': none,
                            'hold_until': 0} | to_json }}

      # --- 4d: DOOR OPEN ---
      - conditions:
          - condition: template
            value_template: "{{ door_is_open or (trigger is defined and trigger.id == 'door_open') }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_ac_mode != 'off' }}"
                sequence:
                  - service: climate.turn_off
                    target:
                      entity_id: "{{ climate_ac }}"
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hold_enabled }}"
                sequence:
                  - service: input_text.set_value
                    target:
                      entity_id: "{{ hold_helper }}"
                    data:
                      value: >
                        {{ {'mode': 'off', 'temp': none, 'fan': none,
                            'hold_until': 0} | to_json }}

      # --- SENSOR CHECK (pierces above must not starve on stale sensors) ---
      - conditions:
          - condition: template
            value_template: "{{ not sensors_available }}"
        sequence:
          - stop: "No sensors available"

      # --- MANUAL CHANGE DETECTED → START HOLD ---
      - conditions:
          - condition: template
            value_template: "{{ manual_detected and not (trigger is defined and trigger.id == 'init') }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: "{{ hold_helper }}"
            data:
              value: >
                {{ {'mode': current_ac_mode, 'temp': current_setpoint | float(none),
                    'fan': current_fan,
                    'hold_until': (as_timestamp(now()) + hold_minutes | int * 60) | int} | to_json }}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (states(hold_helper) | from_json(default={})).get('hold_until', 0) | float(0) <= as_timestamp(now()) }}"
                sequence:
                  - service: persistent_notification.create
                    data:
                      title: "AC Climate Blueprint — Hold Helper Error"
                      message: >
                        The manual-hold helper {{ hold_helper }} did not persist the
                        hold timestamp (write failed — check the helper's max length
                        is 255). Manual-override holds are not functioning.
                      notification_id: "ac_climate_hold_helper_error"
                    continue_on_error: true
            default:
              - service: persistent_notification.dismiss
                data:
                  notification_id: "ac_climate_hold_helper_error"
                continue_on_error: true
          - stop: "Manual change detected — holding"

      # --- HOLD ACTIVE (refresh expected to live, keep the clock) ---
      - conditions:
          - condition: template
            value_template: "{{ hold_active and not (trigger is defined and trigger.id == 'init') }}"
        sequence:
          - service: input_text.set_value
            target:
              entity_id: "{{ hold_helper }}"
            data:
              value: >
                {{ {'mode': current_ac_mode, 'temp': current_setpoint | float(none),
                    'fan': current_fan, 'hold_until': hold_until | float(0) | int} | to_json }}
          - stop: "Manual hold active"

      # --- 4e: TEMP INSIDE COMFORT RANGE ---
      - conditions:
          - condition: template
            value_template: "{{ target_mode == 'off' }}"
        sequence:
          - choose:
              # Deadband ACTIVE (mild outdoor) → turn off
              - conditions:
                  - condition: template
                    value_template: "{{ deadband_active }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ current_ac_mode != 'off' }}"
                        sequence:
                          - service: climate.turn_off
                            target:
                              entity_id: "{{ climate_ac }}"
                            continue_on_error: true
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ hold_enabled }}"
                        sequence:
                          - service: input_text.set_value
                            target:
                              entity_id: "{{ hold_helper }}"
                            data:
                              value: >
                                {{ {'mode': 'off', 'temp': none, 'fan': none,
                                    'hold_until': 0} | to_json }}
              # Deadband DISABLED (extreme outdoor) → maintenance mode
              - conditions:
                  - condition: template
                    value_template: "{{ not deadband_active }}"
                sequence:
                  - variables:
                      desired_mode: >
                        {% if current_ac_mode in ['cool', 'heat'] %}
                          {{ current_ac_mode }}
                        {% elif current_temp | float >= ((temp_low | float + temp_high | float) / 2) %}
                          cool
                        {% else %}
                          heat
                        {% endif %}
                      desired_setpoint: "{{ setpoint_cool_q if desired_mode == 'cool' else setpoint_heat_q }}"
                      desired_fan: "{{ fan_mode_low }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ current_ac_mode != desired_mode or (state_attr(climate_ac, 'temperature') | float(-99) - desired_setpoint | float) | abs > 0.05 }}"
                        sequence:
                          - service: climate.set_temperature
                            target:
                              entity_id: "{{ climate_ac }}"
                            data:
                              hvac_mode: "{{ desired_mode }}"
                              temperature: "{{ desired_setpoint }}"
                            continue_on_error: true
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ state_attr(climate_ac, 'fan_mode') != desired_fan }}"
                        sequence:
                          - service: climate.set_fan_mode
                            target:
                              entity_id: "{{ climate_ac }}"
                            data:
                              fan_mode: "{{ desired_fan }}"
                            continue_on_error: true
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ hold_enabled }}"
                        sequence:
                          - service: input_text.set_value
                            target:
                              entity_id: "{{ hold_helper }}"
                            data:
                              value: >
                                {{ {'mode': desired_mode, 'temp': desired_setpoint | float(none),
                                    'fan': desired_fan, 'hold_until': 0} | to_json }}

      # --- 4f: COOL ---
      - conditions:
          - condition: template
            value_template: "{{ target_mode == 'cool' }}"
        sequence:
          - variables:
              desired_mode: "cool"
              desired_setpoint: "{{ setpoint_cool_active_q if (deadband_active and cool_deep_ok) else setpoint_cool_q }}"
              desired_fan: "{{ target_fan }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_ac_mode != desired_mode or (state_attr(climate_ac, 'temperature') | float(-99) - desired_setpoint | float) | abs > 0.05 }}"
                sequence:
                  - service: climate.set_temperature
                    target:
                      entity_id: "{{ climate_ac }}"
                    data:
                      hvac_mode: "{{ desired_mode }}"
                      temperature: "{{ desired_setpoint }}"
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(climate_ac, 'fan_mode') != desired_fan }}"
                sequence:
                  - service: climate.set_fan_mode
                    target:
                      entity_id: "{{ climate_ac }}"
                    data:
                      fan_mode: "{{ desired_fan }}"
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hold_enabled }}"
                sequence:
                  - service: input_text.set_value
                    target:
                      entity_id: "{{ hold_helper }}"
                    data:
                      value: >
                        {{ {'mode': desired_mode, 'temp': desired_setpoint | float(none),
                            'fan': desired_fan, 'hold_until': 0} | to_json }}

      # --- 4g: HEAT ---
      - conditions:
          - condition: template
            value_template: "{{ target_mode == 'heat' }}"
        sequence:
          - variables:
              desired_mode: "heat"
              desired_setpoint: "{{ setpoint_heat_active_q if (deadband_active and heat_deep_ok) else setpoint_heat_q }}"
              desired_fan: "{{ target_fan }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ current_ac_mode != desired_mode or (state_attr(climate_ac, 'temperature') | float(-99) - desired_setpoint | float) | abs > 0.05 }}"
                sequence:
                  - service: climate.set_temperature
                    target:
                      entity_id: "{{ climate_ac }}"
                    data:
                      hvac_mode: "{{ desired_mode }}"
                      temperature: "{{ desired_setpoint }}"
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ state_attr(climate_ac, 'fan_mode') != desired_fan }}"
                sequence:
                  - service: climate.set_fan_mode
                    target:
                      entity_id: "{{ climate_ac }}"
                    data:
                      fan_mode: "{{ desired_fan }}"
                    continue_on_error: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ hold_enabled }}"
                sequence:
                  - service: input_text.set_value
                    target:
                      entity_id: "{{ hold_helper }}"
                    data:
                      value: >
                        {{ {'mode': desired_mode, 'temp': desired_setpoint | float(none),
                            'fan': desired_fan, 'hold_until': 0} | to_json }}
