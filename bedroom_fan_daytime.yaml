blueprint:
  name: "Bedroom Fan Daytime v1.1.0"
  description: >
    **Version: 1.1.0** — off-only daytime run limit for one bedroom fan.

    At Day Start (default 08:00) a fan still running from the night is
    switched off. Between Day Start and Day End (default 18:00) a fan that is
    switched on — by anyone or anything — runs for the Maximum Run time
    (default 120 min) and is then switched off. The run is counted from the
    moment the fan last went on; a speed change does not restart it, but an
    off/on cycle (a safety-cutoff resume, a cloud availability flap) does.

    From Day End to Day Start nothing is switched off, so a fan started late in
    the afternoon keeps running into the evening. The blueprint never switches
    a fan on and never changes its speed or direction: its only service is a
    single `fan.turn_off`, re-checked on live state. A Home Assistant start and
    a manual Run evaluate everything and issue nothing.

    **Requirements:** Home Assistant with the fan entity. No helpers.
  domain: automation
  input:
    fan:
      name: Ceiling Fan
      description: The fan this instance may switch off. Required.
      selector:
        entity:
          domain: fan
    day_start:
      name: Day Start
      description: A fan still running from the night is switched off at this time.
      default: "08:00:00"
      selector:
        time:
    day_end:
      name: Day End
      description: End of the window (exclusive). Must be later than Day Start.
      default: "18:00:00"
      selector:
        time:
    max_run_minutes:
      name: Maximum Run
      description: A fan switched on inside the window is switched off after this many minutes.
      default: 120
      selector:
        number:
          min: 15
          max: 600
          step: 5
          unit_of_measurement: "min"

mode: queued
max: 10
max_exceeded: silent

# =============================================
# TOP-LEVEL VARIABLES — !input pass-through
# =============================================
variables:
  fan: !input fan
  day_start: !input day_start
  day_end: !input day_end
  max_run_minutes: !input max_run_minutes

trigger:
  - platform: time_pattern
    minutes: "/1"
    id: tick
  # Re-evaluates only: is_real_trigger is false on this run, so it issues nothing.
  - platform: homeassistant
    event: start
    id: ha_start

action:
  # =============================================
  # STEP 1: PREDICATES. The definition order is normative: HA renders this step key by
  # key and hands each key the literal_eval'd result of the ones above it, so only
  # strings, booleans and unix timestamps are stored — never a State object.
  # =============================================
  - variables:
      is_real_trigger: "{{ trigger is defined and trigger.id is defined and trigger.id == 'tick' }}"
      now_ts: "{{ as_timestamp(now()) }}"
      day_start_ts: "{{ as_timestamp(today_at(day_start)) }}"
      day_end_ts: "{{ as_timestamp(today_at(day_end)) }}"
      in_day: "{{ (day_start_ts | float) <= (now_ts | float) < (day_end_ts | float) }}"
      fan_state: "{{ states[fan].state if states[fan] is not none else 'absent' }}"
      fan_on: "{{ fan_state == 'on' }}"
      # While the fan reads on, last_changed is the instant it went on; a speed or
      # direction change is an attribute update and does not move it.
      on_since_ts: "{{ as_timestamp(states[fan].last_changed) if states[fan] is not none else 0 }}"
      from_night: "{{ (on_since_ts | float) < (day_start_ts | float) }}"
      run_expired: "{{ (now_ts | float) - (on_since_ts | float) >= (max_run_minutes | float) * 60 }}"
      off_due: "{{ is_real_trigger and in_day and fan_on and (from_night or run_expired) }}"

  # =============================================
  # STEP 2: SWITCH-OFF — the only service. The branch re-checks the fan and the window on
  # live state; a fan that went off or a clock past Day End cancels it.
  # =============================================
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ off_due and is_state(fan, 'on')
                 and (day_start_ts | float) <= as_timestamp(now()) < (day_end_ts | float) }}
        sequence:
          - service: fan.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ fan }}"
